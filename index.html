<style>.stf__parent {
  position: relative;
  display: block;
  box-sizing: border-box;
  transform: translateZ(0);

  -ms-touch-action: pan-y;
  touch-action: pan-y;
}

.stf__wrapper {
  position: relative;
  width: 100%;
  box-sizing: border-box;
}

.stf__parent canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
}

.stf__block {
  position: absolute;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  perspective: 2000px;
}

.stf__item {
  display: none;
  position: absolute;
  transform-style: preserve-3d;
}

.stf__outerShadow {
  position: absolute;
  left: 0;
  top: 0;
}

.stf__innerShadow {

}

.stf__hardShadow {

<style>/* Grimoire — light theme only. Palette: limestone, ink, lapis, gold leaf, vermilion rubric. */
:root {
  color-scheme: only light;
  --stone: #eef0ec;
  --stone-2: #e2e6e0;
  --paper: #fbfcfa;
  --ink: #1d2433;
  --ink-2: #4a5265;
  --ink-3: #7b8294;
  --rule: #cfd4cc;
  --lapis: #24418f;
  --lapis-2: #3653a8;
  --lapis-wash: #e3e8f5;
  --gold: #a87a1f;
  --gold-2: #d8b25a;
  --gold-wash: #f5ecd6;
  --rubric: #b3321f;
  --rubric-wash: #f7e3de;
  --vellum: #f1e7cf;
  --vellum-ink: #2e2416;
  --leather: #5a2e1b;
  --leather-2: #3e1d10;
  --wax: #9e1c1c;
  --display: "Cinzel", "Times New Roman", serif;
  --text: "EB Garamond", Georgia, serif;
  --hand: "Caveat", "Segoe Print", cursive;
  --bar-h: 56px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--stone);
  color: var(--ink);
  font-family: var(--text);
  font-size: 18px;
  line-height: 1.45;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button > * { pointer-events: none; }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: 100%; }
.screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 20;
  height: var(--bar-h);
  display: flex; align-items: center; gap: 4px;
  padding: 0 6px;
  background: var(--ink);
  color: #f4f1e8;
}
.bar h1 {
  flex: 1; min-width: 0; margin: 0 6px;
  font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar h1 small { display: block; font-family: var(--text); font-weight: 400; font-size: 13px; letter-spacing: 0; color: #c9cdd8; margin-top: -2px; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: inherit;
}
.icon-btn:active { background: rgba(255,255,255,.12); }
.icon-btn svg { width: 24px; height: 24px; }
.bar .back { margin-left: -2px; }

main.content { flex: 1; padding: 0 0 120px; max-width: 760px; width: 100%; margin: 0 auto; }

/* ---------- Home: header strip ---------- */
.char-strip {
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding: 12px 16px 10px;
}
.counter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.counter { font-size: 16px; color: var(--ink-2); }
.counter b { font-family: var(--display); font-size: 22px; color: var(--ink); font-weight: 700; }
.counter.over b { color: var(--rubric); }
.text-btn {
  border: 0; background: none; padding: 8px 4px; color: var(--lapis);
  font-weight: 600; font-size: 16px;
}
.text-btn:active { opacity: .6; }

/* Spell slots */
.slots { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.slot-row { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.slot-row .lvl { width: 54px; flex: none; font-size: 14px; color: var(--ink-3); }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pip {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--lapis); background: var(--lapis);
  padding: 0; position: relative;
}
.pip.used { background: transparent; border-style: dashed; border-color: var(--ink-3); }
.slots-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.slots-actions .hint { font-size: 13px; color: var(--ink-3); }

/* Search */
.search {
  position: relative; margin: 12px 16px 4px;
}
.search input {
  width: 100%; height: 46px; padding: 0 14px 0 42px;
  border: 1px solid var(--rule); border-radius: 23px; background: var(--paper);
  font-size: 17px;
}
.search input:focus { outline: none; border-color: var(--lapis); }
.search svg { position: absolute; left: 14px; top: 13px; width: 20px; height: 20px; color: var(--ink-3); }

/* ---------- Spell list ---------- */
.group { margin-top: 14px; }
.group-head {
  display: flex; align-items: baseline; gap: 10px;
  padding: 6px 16px 4px;
  font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--rubric);
}
.group-head .n { font-family: var(--text); font-weight: 400; font-size: 14px; color: var(--ink-3); }
.list { list-style: none; margin: 0; padding: 0; background: var(--paper); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px 10px 16px; min-height: 64px;
  border-bottom: 1px solid var(--stone-2);
  width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0;
}
.list li:last-child .row { border-bottom: 0; }
.row:active { background: var(--lapis-wash); }
.row .main { flex: 1; min-width: 0; }
.row .name { font-size: 19px; font-weight: 600; line-height: 1.2; }
.row .meta { font-size: 14.5px; color: var(--ink-2); margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.row .chev { color: var(--ink-3); width: 20px; height: 20px; flex: none; }
.row.dim .name { color: var(--ink-3); }

/* Badges */
.badges { display: inline-flex; gap: 3px; }
.badge {
  display: inline-grid; place-items: center;
  min-width: 21px; height: 21px; padding: 0 4px;
  border-radius: 4px; border: 1.5px solid var(--lapis); color: var(--lapis);
  font-family: var(--text); font-weight: 700; font-size: 12.5px; line-height: 1;
}
.badge.conc { border-color: var(--rubric); background: var(--rubric); color: #fff; }
.badge.rit { border-color: var(--gold); background: var(--gold); color: #fff; }
.badge.m.costly { border-color: var(--gold); color: var(--gold); background: var(--gold-wash); }
.badge.always { border-color: var(--gold); color: var(--gold); font-size: 11px; }
.tag-always { font-size: 13px; color: var(--gold); font-style: italic; }

/* Switch */
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 15px; background: var(--stone-2); border: 1px solid var(--rule); transition: background .15s; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked ~ .track { background: var(--lapis); border-color: var(--lapis); }
.switch input:checked ~ .knob { transform: translateX(20px); }
.switch input:disabled ~ .track { opacity: .5; }
.switch input:focus-visible ~ .track { outline: 2px solid var(--lapis); outline-offset: 2px; }

/* Empty states */
.empty { padding: 36px 24px; text-align: center; color: var(--ink-2); }
.empty h2 { font-family: var(--display); font-size: 20px; color: var(--ink); margin: 12px 0 6px; }
.empty p { margin: 0 auto 16px; max-width: 34ch; }
.empty svg { width: 64px; height: 64px; color: var(--gold); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 23px;
  border: 1.5px solid var(--lapis); background: var(--lapis); color: #fff;
  font-weight: 600; font-size: 17px;
}
.btn.ghost { background: transparent; color: var(--lapis); }
.btn.danger { background: transparent; border-color: var(--rubric); color: var(--rubric); }
.btn.block { width: 100%; }
.btn:active { filter: brightness(.9); }
.btn svg { width: 20px; height: 20px; }

/* ---------- Book FAB ---------- */
.fab-book {
  position: fixed; right: 18px; bottom: 22px; z-index: 30;
  width: 72px; height: 84px; border: 0; padding: 0; background: none;
  filter: drop-shadow(0 6px 10px rgba(29,36,51,.35));
}
.fab-book svg { width: 100%; height: 100%; }
.fab-book:active { transform: scale(.95); }
.fab-label { position: fixed; right: 12px; bottom: 6px; width: 84px; text-align: center; font-size: 12px; color: var(--ink-2); z-index: 30; pointer-events: none; }

/* ---------- Spell detail (stat block) ---------- */
.statblock { background: var(--paper); margin: 0; padding: 20px 18px 8px; border-bottom: 1px solid var(--rule); }
.statblock h2 { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.15; margin: 0; color: var(--ink); }
.statblock .school { font-style: italic; color: var(--ink-2); margin: 4px 0 12px; font-size: 17px; }
.statblock .badges { margin-bottom: 12px; }
.statblock .badge { min-width: 26px; height: 26px; font-size: 14px; }
.props { margin: 0; padding: 10px 0; border-top: 2px solid var(--rubric); border-bottom: 2px solid var(--rubric); }
.props div { display: flex; gap: 6px; padding: 2px 0; font-size: 17px; }
.props dt { font-weight: 700; color: var(--rubric); flex: none; }
.props dd { margin: 0; }
.desc { padding: 6px 0 4px; font-size: 18px; line-height: 1.55; }
.desc p { margin: 0 0 .75em; }
.desc table { border-collapse: collapse; width: 100%; margin: .4em 0 1em; font-size: 16px; }
.desc th, .desc td { text-align: left; padding: 5px 8px; vertical-align: top; }
.desc th { border-bottom: 1.5px solid var(--ink); }
.desc tr:nth-child(even) td { background: var(--stone); }
.desc .tbl-title { font-weight: 700; margin-bottom: 2px; }
.classes-line { font-size: 15px; color: var(--ink-3); padding: 8px 0 12px; border-top: 1px solid var(--rule); }

.panel { background: var(--paper); margin-top: 14px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.setting { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; border-bottom: 1px solid var(--stone-2); }
.setting:last-child { border-bottom: 0; }
.setting .lbl { flex: 1; }
.setting .lbl b { display: block; font-weight: 600; }
.setting .lbl span { display: block; font-size: 14.5px; color: var(--ink-3); line-height: 1.3; }
.notes { padding: 12px 16px 16px; }
.notes label { font-weight: 600; display: block; margin-bottom: 6px; }
.notes textarea {
  width: 100%; min-height: 96px; padding: 10px 12px; resize: vertical;
  border: 1px solid var(--rule); border-radius: 8px; background: #fff; font-size: 17px;
}
.actions { display: flex; flex-direction: column; gap: 10px; padding: 18px 16px; }

/* ---------- Forms ---------- */
.form { padding: 8px 16px 24px; }
.field { margin: 14px 0; }
.field > label, .field > .lab { display: block; font-weight: 600; margin-bottom: 6px; }
.field input[type=text], .field input[type=number], .field select, .field textarea {
  width: 100%; min-height: 46px; padding: 8px 12px;
  border: 1px solid var(--rule); border-radius: 8px; background: #fff; font-size: 17px;
}
.field textarea { min-height: 160px; line-height: 1.45; }
.field .help { font-size: 14px; color: var(--ink-3); margin-top: 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 22px; background: #fff; }
.check input { width: 18px; height: 18px; accent-color: var(--lapis); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-width: 40px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--rule); background: var(--paper); font-size: 15px; }
.chip[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }

.add-btn {
  flex: none; min-width: 74px; height: 38px; padding: 0 12px; border-radius: 19px;
  border: 1.5px solid var(--lapis); background: transparent; color: var(--lapis); font-weight: 600; font-size: 15px;
}
.add-btn.in { border-color: transparent; color: var(--ink-3); font-weight: 400; }
.add-btn.in:disabled { cursor: default; }

/* ---------- Sheet / dialog / toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(29,36,51,.45); animation: fade .15s ease-out; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 81;
  background: var(--paper); border-radius: 18px 18px 0 0; padding: 8px 0 18px;
  max-height: 85vh; overflow: auto;
  animation: rise .2s ease-out;
}
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 4px auto 8px; }
.sheet h3 { font-family: var(--display); font-size: 17px; margin: 4px 20px 8px; }
.menu-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px; padding: 0 20px; border: 0; background: none; text-align: left; font-size: 18px; }
.menu-item:active { background: var(--lapis-wash); }
.menu-item svg { width: 22px; height: 22px; color: var(--lapis); flex: none; }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 81; width: min(92vw, 400px); background: var(--paper); border-radius: 14px; padding: 20px; animation: fade .15s ease-out; }
.dialog h3 { margin: 0 0 8px; font-family: var(--display); font-size: 19px; }
.dialog p { margin: 0 0 18px; color: var(--ink-2); }
.dialog .row-btns { display: flex; justify-content: flex-end; gap: 8px; }
.toast {
  position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 90;
  display: flex; align-items: center; gap: 14px;
  max-width: calc(100vw - 32px); padding: 10px 10px 10px 18px; border-radius: 10px;
  background: var(--ink); color: #fff; font-size: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.25);
  animation: rise .2s ease-out;
}
.toast button { border: 0; background: none; color: var(--gold-2); font-weight: 700; padding: 8px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translate(var(--tx, 0), 24px); opacity: 0; } }
.toast { --tx: -50%; }

/* ---------- About ---------- */
.prose { padding: 8px 18px 30px; }
.prose h2 { font-family: var(--display); font-size: 20px; margin: 22px 0 6px; }
.prose p { margin: 0 0 12px; }
.prose a { color: var(--lapis); }

/* =================================================================
   SPELLBOOK
   ================================================================= */
.book-screen {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse at 50% 40%, #3a4258 0%, #1d2433 70%);
  color: #f4f1e8;
  overflow: hidden;
}
.book-screen .bar { background: transparent; position: relative; }
.book-stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.book-host { position: relative; }
.book-nav { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 4px 8px 6px; }
.book-nav .icon-btn { width: 48px; height: 48px; background: rgba(255,255,255,.08); }
.book-nav .pg { min-width: 90px; text-align: center; font-size: 15px; color: #c9cdd8; }
.ribbons { display: flex; justify-content: safe center; gap: 4px; padding: 0 8px 14px; flex-wrap: nowrap; overflow-x: auto; min-height: 58px; scrollbar-width: none; }
.ribbons::-webkit-scrollbar { display: none; }
.ribbon {
  position: relative; flex: none; width: 30px; height: 44px; border: 0; padding: 0 0 8px;
  color: #fff; font-family: var(--display); font-weight: 700; font-size: 14px;
  background: var(--rib, var(--wax));
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
  display: grid; place-items: center;
}
.ribbon[aria-current=true] { transform: translateY(-4px); box-shadow: inset 0 0 0 2px var(--gold-2); }

/* Cover */
.page { background: var(--vellum); color: var(--vellum-ink); overflow: hidden; }
.page.cover {
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.08), transparent 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.05) 0 2px, transparent 2px 7px),
    var(--leather);
  color: var(--gold-2);
}
.cover-inner {
  position: absolute; inset: 14px; border: 2px solid rgba(216,178,90,.65); border-radius: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
  box-shadow: inset 0 0 0 6px rgba(0,0,0,0), inset 0 0 0 8px rgba(216,178,90,.35);
}
.cover-inner .sigil { width: 46%; max-width: 140px; color: var(--gold-2); margin-bottom: 18px; }
.cover-inner h2 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0 0 6px; line-height: 1.15; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.cover-inner p { margin: 0; font-style: italic; font-size: 16px; color: #d9c08a; }
.cover-inner .open-hint { position: absolute; bottom: 18px; font-size: 14px; font-style: normal; color: rgba(217,192,138,.8); }
.page.back-cover .cover-inner .sigil { width: 26%; opacity: .7; }

/* Paper pages */
.page.paper {
  background:
    radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(120,86,40,.18) 100%),
    var(--vellum);
}
.page.paper.left { box-shadow: inset -18px 0 22px -18px rgba(70,45,15,.45); }
.page.paper.right { box-shadow: inset 18px 0 22px -18px rgba(70,45,15,.45); }
.pg-inner { position: absolute; inset: 0; padding: 18px 18px 46px; display: flex; flex-direction: column; font-size: var(--bfs, 15px); line-height: 1.38; }
.pg-run { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--display); font-size: .72em; letter-spacing: .06em; color: #8a6a3a; text-align: center; border-bottom: 1px solid rgba(138,106,58,.35); padding-bottom: 4px; margin-bottom: 8px; flex: none; }
.pg-body { flex: 1; min-height: 0; overflow: visible; }
.pg-foot { position: absolute; bottom: 14px; left: 18px; right: 18px; text-align: left; font-size: .78em; color: #8a6a3a; }
.bk-name { font-family: var(--display); font-weight: 700; font-size: 1.45em; line-height: 1.12; margin: 0 0 2px; color: #3b1d0e; }
.bk-name.cont { font-size: 1.05em; color: #6e5432; }
.bk-school { font-style: italic; margin: 0 0 6px; color: #5d4a30; }
.bk-props { margin: 0 0 6px; padding: 4px 0; border-top: 1.5px solid #9b2c1c; border-bottom: 1.5px solid #9b2c1c; }
.bk-props div { padding: 0; }
.bk-props b { color: #8c2414; }
.bk-text p { margin: 0 0 .55em; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.bk-text table { border-collapse: collapse; width: 100%; font-size: .9em; margin: .2em 0 .6em; }
.bk-text th, .bk-text td { text-align: left; padding: 2px 4px; vertical-align: top; }
.bk-text th { border-bottom: 1px solid #5d4a30; }
.bk-text .tbl-title { font-weight: 700; margin: 0; }
.bk-note { font-family: var(--hand); font-size: 1.25em; line-height: 1.15; color: #2a4a8a; transform: rotate(-1.2deg); margin: 6px 4px; }
.bk-drop::first-letter { font-family: var(--display); font-weight: 700; float: left; font-size: 3.1em; line-height: .85; padding: 4px 3px 0 0; color: #9b2c1c; }

/* Wax seal */
.seal {
  position: absolute; left: 50%; bottom: 4px; z-index: 3; transform: translateX(-50%);
  width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
  background: transparent;
}
.seal svg { width: 100%; height: 100%; }
.seal .lbl { position: absolute; left: 50px; bottom: 13px; width: 80px; text-align: left; font-size: 12px; color: #8a6a3a; font-family: var(--text); }
.seal.on .lbl { color: var(--wax); }

/* TOC */
.toc h3 { font-family: var(--display); text-align: center; font-size: 1.25em; margin: 4px 0 8px; color: #3b1d0e; }
.toc .lv { font-family: var(--display); font-weight: 700; color: #9b2c1c; margin: 8px 0 2px; font-size: .9em; }
.toc a, .toc button.tl {
  display: flex; align-items: baseline; gap: 4px; width: 100%; border: 0; background: none; padding: 3px 0; text-align: left; color: inherit; text-decoration: none; font-size: 1em;
}
.toc .dots { flex: 1; border-bottom: 1px dotted #8a6a3a; transform: translateY(-4px); }
.toc .prep-mark { color: var(--wax); }
.scribe-page { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; gap: 14px; color: #5d4a30; }
.scribe-page svg { width: 70px; height: 70px; color: #8a6a3a; }
.scribe-page button.quill-btn {
  border: 1.5px solid #8c2414; color: #8c2414; background: rgba(255,255,255,.35);
  min-height: 46px; padding: 0 18px; border-radius: 23px; font-weight: 600; font-family: var(--text); font-size: 16px;
}

/* Scribing animation */
.scribing .pg-body { animation: ink-in 2.4s steps(30, end) both; }
@keyframes ink-in {
  from { clip-path: inset(0 0 100% 0); }
  to { clip-path: inset(0 0 0 0); }
}
.quill-anim { position: absolute; z-index: 5; width: 46px; height: 46px; color: #3b1d0e; pointer-events: none; animation: quill 2.4s ease-in-out both; }
@keyframes quill {
  0% { left: 10%; top: 10%; opacity: 0; }
  8% { opacity: 1; }
  20% { left: 70%; top: 18%; }
  35% { left: 15%; top: 32%; }
  50% { left: 72%; top: 46%; }
  65% { left: 18%; top: 60%; }
  85% { left: 68%; top: 76%; opacity: 1; }
  100% { left: 80%; top: 82%; opacity: 0; }
}

.measure { position: absolute; left: -9999px; top: 0; visibility: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* page-flip container sizing */
.book-host > .stf__parent { width: 100% !important; height: 100% !important; min-width: 0 !important; }
.book-host .stf__wrapper { height: 100%; }
.toast { width: max-content; }

/* Short screens (phone turned sideways): arrows beside the book, ribbons down the side */
@media (max-height: 560px) {
  .book-screen .bar { height: 44px; }
  .book-screen .bar h1 { font-size: 16px; }
  .book-nav { position: absolute; inset: 44px 0 0 0; pointer-events: none; justify-content: space-between; padding: 0 6px; }
  .book-nav .icon-btn { pointer-events: auto; }
  .book-nav .pg { display: none; }
  .ribbons { position: absolute; right: 52px; top: 0; min-height: 0; padding: 0; z-index: 30; max-width: calc(100% - 160px); }
  .book-screen .bar h1 { margin-right: calc(var(--ribw, 0px) + 8px); }
  .ribbons .ribbon { height: 36px; width: 28px; font-size: 12px; }
  .book-stage { padding: 0 56px; }
}
.toc-key { text-align: center; font-size: .85em; font-style: italic; color: #6e5432; margin: -4px 0 4px; }

.page.paper.left .pg-foot { text-align: right; }

/* ---------- v1.1: every class ---------- */
.casters { display: flex; flex-direction: column; gap: 8px; }
.cline { display: flex; flex-direction: column; gap: 2px; }
.cname { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); }
.cname span { font-family: var(--text); font-weight: 400; color: var(--ink-3); }
.cstats { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 15.5px; color: var(--ink-2); }
.cstats b { font-family: var(--display); font-size: 18px; color: var(--ink); }
.cstats .over b, .counter.over b { color: var(--rubric); }
.strip-actions { display: flex; justify-content: flex-end; margin-top: -2px; }
.pip.pact { border-color: #6d4c8f; background: #6d4c8f; }
.pip.pact.used { background: transparent; border-color: var(--ink-3); }
.free { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--gold); margin-left: 2px; }
.fpip { width: 22px; height: 22px; border-radius: 4px; transform: rotate(45deg) scale(.8); border: 2px solid var(--gold); background: var(--gold); padding: 0; flex: none; }
.fpip.used { background: transparent; border-style: dashed; border-color: var(--ink-3); }
.setting .free { flex: none; }
.group-note { margin: 2px 16px 8px; font-size: 15px; color: var(--ink-3); line-height: 1.4; }
.prep-src { margin-top: 18px; }
.src-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 16px; }
.src-head h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.mini-select { max-width: 48%; min-height: 40px; border: 1px solid var(--rule); border-radius: 8px; background: #fff; font-size: 15px; padding: 4px 8px; }
.at-level { margin: 0 0 10px; padding: 8px 12px; background: var(--gold-wash); border-radius: 8px; font-size: 16px; }
a.term { color: inherit; text-decoration: underline dotted var(--lapis); text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: pointer; }
.bk-text a.term { text-decoration-color: rgba(140,36,20,.55); }
.term-sheet { padding: 8px 20px 24px; }
.term-sheet h3 { margin: 4px 0 10px; font-size: 20px; }
.term-body { font-size: 17px; }
.desc h4, .term-body h4 { font-family: var(--display); font-size: 16px; margin: 14px 0 4px; color: var(--rubric); }
.desc ul, .term-body ul { margin: 0 0 .75em; padding-left: 22px; }
.term-src { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.form-h { font-family: var(--display); font-size: 18px; margin: 26px 0 4px; padding-top: 14px; border-top: 1px solid var(--rule); }
.class-card { border: 1px solid var(--rule); border-radius: 12px; background: var(--paper); padding: 4px 14px 10px; margin: 12px 0; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.three .field input { text-align: center; }
.slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slots-grid label { font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.slots-grid input { min-height: 42px; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; background: #fff; }
.prep-num { width: 90px; min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; background: #fff; }
.danger-text { color: var(--rubric); }
.list-chips .chip { font-weight: 600; }
.rule-row { min-height: 52px; }
.sheet .menu-item small { display: block; font-size: 13px; color: var(--ink-3); }
.sheet.term-sheet { max-height: 75vh; }
.slots-actions > span:last-child { display: flex; gap: 14px; }
.bk-text ul { margin: 0 0 .35em; padding-left: 1.1em; }
.bk-text h4 { font-family: var(--display); font-size: 1em; margin: .4em 0 .2em; color: #8c2414; }
.bk-text { display: flow-root; }

/* ---------- v1.2: iPhone (notch, home bar, rounded corners). env() is 0 on Android, where the wrapper pads instead. ---------- */
:root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
html { background: var(--ink); }
.bar { height: calc(var(--bar-h) + var(--st)); padding-top: var(--st); padding-left: max(6px, var(--sl)); padding-right: max(6px, var(--sr)); }
main.content { padding-left: var(--sl); padding-right: var(--sr); padding-bottom: calc(120px + var(--sb)); }
.char-strip { padding-left: max(16px, var(--sl)); padding-right: max(16px, var(--sr)); }
.fab-book { right: calc(18px + var(--sr)); bottom: calc(22px + var(--sb)); }
.fab-label { right: calc(12px + var(--sr)); bottom: calc(6px + var(--sb)); }
.toast { bottom: calc(120px + var(--sb)); }
.sheet { padding-bottom: calc(18px + var(--sb)); padding-left: var(--sl); padding-right: var(--sr); }
.book-screen .ribbons { padding-bottom: calc(14px + var(--sb)); }
.book-screen .book-stage { padding-left: var(--sl); padding-right: var(--sr); }
@media (max-height: 560px) {
  .book-screen .bar { height: calc(44px + var(--st)); }
  .book-nav { inset: calc(44px + var(--st)) 0 0 0; padding: 0 max(6px, var(--sr)) 0 max(6px, var(--sl)); }
  .ribbons { right: calc(52px + var(--sr)); top: var(--st); padding-bottom: 0 !important; }
  .book-stage { padding: 0 calc(56px + var(--sr)) var(--sb) calc(56px + var(--sl)) !important; }
}
/* iPhone typing and touch details */
.mini-select { font-size: 16px; }
input[type=search] { -webkit-appearance: none; appearance: none; }
input, select, textarea { font-size: max(16px, 1em); }
button, .row, .bar, .book-screen, .ribbon, .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.screen.swiping { transition: none; }
.screen.swipe-back { transition: transform .2s ease-out; }
.edge-shade { position: fixed; inset: 0; z-index: 60; pointer-events: none; background: linear-gradient(90deg, rgba(29,36,51,.18), transparent 40%); opacity: 0; }

/* "Add to Home Screen" banner (Safari only) */
.install-tip {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--sb)); z-index: 95;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 44px 14px 16px;
  box-shadow: 0 10px 30px rgba(29,36,51,.28); font-size: 16px; line-height: 1.4; animation: rise .25s ease-out;
}
.install-tip b { font-family: var(--display); font-size: 17px; display: block; margin-bottom: 4px; }
.install-tip p { margin: 0 0 4px; color: var(--ink-2); }
.install-tip .share-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; color: var(--lapis); }
.install-tip .x { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; border: 0; background: none; color: var(--ink-3); display: grid; place-items: center; }
.install-tip .x svg { width: 20px; height: 20px; }
.book-screen .book-nav, .book-screen .ribbons { flex: none; }
.book-screen .ribbons { min-height: calc(58px + var(--sb)); }
@media (max-height: 560px) { .book-screen .ribbons { min-height: 0; } }
</style>

<div id="app"></div>
<script>/* Rules text and spells: System Reference Document 5.2.1 by Wizards of the Coast LLC, CC-BY-4.0. */
window.SRD_SPELLS=[{"id":"acid-splash","name":"Acid Splash","level":0,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You create an acidic bubble at a point within range, where it explodes in a 5-foot-radius Sphere. Each creature in that Sphere must succeed on a Dexterity saving throw or take 1d6 Acid damage.","higher":"The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"chill-touch","name":"Chill Touch","level":0,"school":"Necromancy","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous Channeling the chill of the grave, make a melee spell attack against a target within reach. On a hit, the target takes 1d10 Necrotic damage, and it can’t regain Hit Points until the end of your next turn.","conc":false,"desc":"***Cantrip Upgrade.*** The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dancing-lights","name":"Dancing Lights","level":0,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a bit of phosphorus","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create up to four torch-size lights within range, making them appear as torches, lanterns, or glowing orbs that hover for the duration. Alternatively, you combine the four lights into one glowing Medium form that is vaguely humanlike. Whichever form you choose, each light sheds Dim Light in a 10-foot radius.\n\nAs a Bonus Action, you can move the lights up to 60 feet to a space within range. A light must be within 20 feet of another light created by this spell, and a light vanishes if it exceeds the spell’s range.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"druidcraft","name":"Druidcraft","level":0,"school":"Transmutation","classes":["Druid"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Whispering to the spirits of nature, you create one of the following effects within range.\n\n***Weather Sensor.*** You create a Tiny, harmless sensory effect that predicts what the weather will be at your location for the next 24 hours. The effect might manifest as a golden orb for clear skies, a cloud for rain, falling snowflakes for snow, and so on. This effect persists for 1 round.\n\n***Bloom.*** You instantly make a flower blossom, a seed pod open, or a leaf bud bloom.\n\n***Sensory Effect.*** You create a harmless sensory effect, such as falling leaves, spectral dancing fairies, a gentle breeze, the sound of an animal, or the faint odor of skunk. The effect must fit in a 5-foot Cube.\n\n***Fire Play.*** You light or snuff out a candle, a torch, or a campfire.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"eldritch-blast","name":"Eldritch Blast","level":0,"school":"Evocation","classes":["Warlock"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You hurl a beam of crackling energy. Make a ranged spell attack against one creature or object in range. On a hit, the target takes 1d10 Force damage.","higher":"The spell creates two beams at level 5, three beams at level 11, and four beams at level 17. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"elementalism","name":"Elementalism","level":0,"school":"Transmutation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You exert control over the elements, creating one of the following effects within range.\n\n***Beckon Air.*** You create a breeze strong enough to ripple cloth, stir dust, rustle leaves, and close open doors and shutters, all in a 5-foot Cube. Doors and shutters being held open by someone or something aren’t affected.\n\n***Beckon Earth.*** You create a thin shroud of dust or sand that covers surfaces in a 5-foot-square area, or you cause a single word to appear in your handwriting in a patch of dirt or sand.\n\n***Beckon Fire.*** You create a thin cloud of harmless embers and colored, scented smoke in a 5-foot Cube. You choose the color and scent, and the embers can light candles, torches, or lamps in that area. The smoke’s scent lingers for 1 minute.\n\n***Beckon Water.*** You create a spray of cool mist that lightly dampens creatures and objects in a 5-foot Cube. Alternatively, you create 1 cup of clean water either in an open container or on a surface, and the water evaporates in 1 minute.\n\n***Sculpt Element.*** You cause dirt, sand, fire, smoke, mist, or water that can fit in a 1-foot Cube to assume a crude shape (such as that of a creature) for 1 hour.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"fire-bolt","name":"Fire Bolt","level":0,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You hurl a mote of fire at a creature or an object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Fire damage. A flammable object hit by this spell starts burning if it isn’t being worn or carried.","higher":"The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"guidance","name":"Guidance","level":0,"school":"Divination","classes":["Cleric","Druid"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You touch a willing creature and choose a skill. Until the spell ends, the creature adds 1d4 to any ability check using the chosen skill.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"light","name":"Light","level":0,"school":"Evocation","classes":["Bard","Cleric","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":false,"m":true,"mat":"a firefly or phosphorescent moss","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch one Large or smaller object that isn’t being worn or carried by someone else. Until the spell ends, the object sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The light can be colored as you like.\n\nCovering the object with something opaque blocks the light. The spell ends if you cast it again.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mage-hand","name":"Mage Hand","level":0,"school":"Conjuration","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again.\n\nWhen you cast the spell, you can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial.\n\nAs a Magic action on your later turns, you can control the hand thus again. As part of that action, you can move the hand up to 30 feet.\n\nThe hand can’t attack, activate magic items, or carry more than 10 pounds.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mending","name":"Mending","level":0,"school":"Transmutation","classes":["Bard","Cleric","Druid","Sorcerer","Wizard"],"time":"1 minute","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"two lodestones","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"This spell repairs a single break or tear in an object you touch, such as a broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage.\n\nThis spell can physically repair a magic item, but it can’t restore magic to such an object.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"message","name":"Message","level":0,"school":"Transmutation","classes":["Bard","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":false,"s":true,"m":true,"mat":"a copper wire","costly":false,"consumed":false,"duration":"1 round","conc":false,"desc":"You point toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear.\n\nYou can cast this spell through solid objects if you are familiar with the target and know it is beyond the barrier. Magical silence; 1 foot of stone, metal, or wood; or a thin sheet of lead blocks the spell.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"minor-illusion","name":"Minor Illusion","level":0,"school":"Illusion","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":false,"s":true,"m":true,"mat":"a bit of fleece","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"You create a sound or an image of an object within range that lasts for the duration. See the descriptions below for the effects of each. The illusion ends if you cast this spell again.\n\nIf a creature takes a Study action to examine the sound or image, the creature can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the illusion becomes faint to the creature.\n\n***Sound.*** If you create a sound, its volume can range from a whisper to a scream. It can be your voice, someone else’s voice, a lion’s roar, a beating of drums, or any other sound you choose. The sound continues unabated throughout the duration, or you can make discrete sounds at different times before the spell ends.\n\n***Image.*** If you create an image of an object—such as a chair, muddy footprints, or a small chest—it must be no larger than a 5-foot Cube. The image can’t create sound, light, smell, or any other sensory effect. Physical interaction with the image reveals it to be an illusion, since things can pass through it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"poison-spray","name":"Poison Spray","level":0,"school":"Necromancy","classes":["Druid","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You spray toxic mist at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d12 Poison damage.","higher":"The damage increases by 1d12 when you reach levels 5 (2d12), 11 (3d12), and 17 (4d12).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"prestidigitation","name":"Prestidigitation","level":0,"school":"Transmutation","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"10 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Up to 1 hour","conc":false,"desc":"You create a magical effect within range. Choose the effect from the options below. If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time.\n\n***Sensory Effect.*** You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor.\n\n***Fire Play.*** You instantaneously light or snuff out a candle, a torch, or a small campfire.\n\n***Clean or Soil.*** You instantaneously clean or soil an object no larger than 1 cubic foot.\n\n***Minor Sensation.*** You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour.\n\n***Magic Mark.*** You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour.\n\n***Minor Creation.*** You create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn. A trinket can deal no damage and has no monetary worth.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"produce-flame","name":"Produce Flame","level":0,"school":"Conjuration","classes":["Druid"],"time":"Bonus Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"A flickering flame appears in your hand and remains there for the duration. While there, the flame emits no heat and ignites nothing, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The spell ends if you cast it again.\n\nUntil the spell ends, you can take a Magic action to hurl fire at a creature or an object within 60 feet of you. Make a ranged spell attack. On a hit, the target takes 1d8 Fire damage.","higher":"The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"ray-of-frost","name":"Ray of Frost","level":0,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 Cold damage, and its Speed is reduced by 10 feet until the start of your next turn.","higher":"The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"resistance","name":"Resistance","level":0,"school":"Abjuration","classes":["Cleric","Druid"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You touch a willing creature and choose a damage type: Acid, Bludgeoning, Cold, Fire, Lightning, Necrotic, Piercing, Poison, Radiant, Slashing, or Thunder. When the creature takes damage of the chosen type before the spell ends, the creature reduces the total damage taken by 1d4. A creature can benefit from this spell only once per turn.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sacred-flame","name":"Sacred Flame","level":0,"school":"Evocation","classes":["Cleric"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 Radiant damage. The target gains no benefit from Half Cover or Three-Quarters Cover for this save.","higher":"The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"shillelagh","name":"Shillelagh","level":0,"school":"Transmutation","classes":["Druid"],"time":"Bonus Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"mistletoe","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"A Club or Quarterstaff you are holding is imbued with nature’s power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon’s damage die becomes a d8. If the attack deals damage, it can be Force damage or the weapon’s normal damage type (your choice).\n\nThe spell ends early if you cast it again or if you let go of the weapon.","higher":"The damage die changes when you reach levels 5 (d10), 11 (d12), and 17 (2d6).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"shocking-grasp","name":"Shocking Grasp","level":0,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can’t make Opportunity Attacks until the start of its next turn.","higher":"The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"sorcerous-burst","name":"Sorcerous Burst","level":0,"school":"Evocation","classes":["Sorcerer"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You cast sorcerous energy at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 damage of a type you choose: Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder.\n\nIf you roll an 8 on a d8 for this spell, you can roll another d8, and add it to the damage. When you cast this spell, the maximum number of these d8s you can add to the spell’s damage equals your spellcasting ability modifier.","higher":"The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"spare-the-dying","name":"Spare the Dying","level":0,"school":"Necromancy","classes":["Cleric","Druid"],"time":"Action","ritual":false,"range":"15 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Choose a creature within range that has 0 Hit Points and isn’t dead. The creature becomes Stable.","higher":"The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"starry-wisp","name":"Starry Wisp","level":0,"school":"Evocation","classes":["Bard","Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You launch a mote of light at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 Radiant damage, and until the end of your next turn, it emits Dim Light in a 10-foot radius and can’t benefit from the Invisible condition.","higher":"The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"thaumaturgy","name":"Thaumaturgy","level":0,"school":"Transmutation","classes":["Cleric"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Up to 1 minute","conc":false,"desc":"You manifest a minor wonder within range. You create one of the effects below within range. If you cast this spell multiple times, you can have up to three of its 1-minute effects active at a time.\n\n***Altered Eyes.*** You alter the appearance of your eyes for 1 minute.\n\n***Booming Voice.*** Your voice booms up to three times as loud as normal for 1 minute. For the duration, you have Advantage on Charisma (Intimidation) checks.\n\n***Fire Play.*** You cause flames to flicker, brighten, dim, or change color for 1 minute.\n\n***Invisible Hand.*** You instantaneously cause an unlocked door or window to fly open or slam shut.\n\n***Phantom Sound.*** You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers.\n\n***Tremors.*** You cause harmless tremors in the ground for 1 minute.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"true-strike","name":"True Strike","level":0,"school":"Divination","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":false,"s":true,"m":true,"mat":"a weapon with which you have proficiency and that is worth 1+ CP","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Guided by a flash of magical insight, you make one attack with the weapon used in the spell’s casting. The attack uses your spellcasting ability for the attack and damage rolls instead of using Strength or Dexterity. If the attack deals damage, it can be Radiant damage or the weapon’s normal damage type (your choice).","higher":"Whether you deal Radiant damage or the weapon’s normal damage type, the attack deals extra Radiant damage when you reach levels 5 (1d6), 11 (2d6), and 17 (3d6).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"vicious-mockery","name":"Vicious Mockery","level":0,"school":"Enchantment","classes":["Bard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You unleash a string of insults laced with subtle enchantments at one creature you can see or hear within range. The target must succeed on a Wisdom saving throw or take 1d6 Psychic damage and have Disadvantage on the next attack roll it makes before the end of its next turn.","higher":"The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).","higherLabel":"Cantrip Upgrade","src":"SRD 5.2.1"},{"id":"alarm","name":"Alarm","level":1,"school":"Abjuration","classes":["Ranger","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a bell and silver wire","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You set an alarm against intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot Cube. Until the spell ends, an alarm alerts you whenever a creature touches or enters the warded area. When you cast the spell, you can designate creatures that won’t set off the alarm. You also choose whether the alarm is audible or mental:\n\n**Audible Alarm.** The alarm produces the sound of a handbell for 10 seconds within 60 feet of the warded area.\n\n**Mental Alarm.** You are alerted by a mental ping if you are within 1 mile of the warded area. This ping awakens you if you’re asleep.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"animal-friendship","name":"Animal Friendship","level":1,"school":"Enchantment","classes":["Bard","Druid","Ranger"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a morsel of food","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"Target a Beast that you can see within range. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. If you or one of your allies deals damage to the target, the spells ends.","higher":"You can target one additional Beast for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"bane","name":"Bane","level":1,"school":"Enchantment","classes":["Bard","Cleric","Warlock"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a drop of blood","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Up to three creatures of your choice that you can see within range must each make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target must subtract 1d4 from the attack roll or save.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"bless","name":"Bless","level":1,"school":"Enchantment","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a Holy Symbol worth 5+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"burning-hands","name":"Burning Hands","level":1,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A thin sheet of flames shoots forth from you. Each creature in a 15-foot Cone makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one.\n\nFlammable objects in the Cone that aren’t being worn or carried start burning.","higher":"The damage increases by 1d6 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"charm-person","name":"Charm Person","level":1,"school":"Enchantment","classes":["Bard","Druid","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"One Humanoid you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"chromatic-orb","name":"Chromatic Orb","level":1,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"a diamond worth 50+ GP","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You hurl an orb of energy at a target within range. Choose Acid, Cold, Fire, Lightning, Poison, or Thunder for the type of orb you create, and then make a ranged spell attack against the target. On a hit, the target takes 3d8 damage of the chosen type.\n\nIf you roll the same number on two or more of the d8s, the orb leaps to a different target of your choice within 30 feet of the target. Make an attack roll against the new target, and make a new damage roll. The orb can’t leap again unless you cast the spell with a level 2+ spell slot.","higher":"The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting of this spell.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"color-spray","name":"Color Spray","level":1,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a pinch of colorful sand","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You launch a dazzling array of flashing, colorful light. Each creature in a 15-foot Cone originating from you must succeed on a Constitution saving throw or have the Blinded condition until the end of your next turn.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"command","name":"Command","level":1,"school":"Enchantment","classes":["Bard","Cleric","Paladin"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options:\n\n**Approach.** The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you.\n\n**Drop.** The target drops whatever it is holding and then ends its turn.\n\n**Flee.** The target spends its turn moving away from you by the fastest available means.\n\n**Grovel.** The target has the Prone condition and then ends its turn.\n\n**Halt.** On its turn, the target doesn’t move and takes no action or Bonus Action.","higher":"You can affect one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"comprehend-languages","name":"Comprehend Languages","level":1,"school":"Divination","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"a pinch of soot and salt","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn’t decode symbols or secret messages.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"create-or-destroy-water","name":"Create or Destroy Water","level":1,"school":"Transmutation","classes":["Cleric","Druid"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a mix of water and sand","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You do one of the following:\n\n**Create Water.** You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot Cube within range, extinguishing exposed flames there.\n\n**Destroy Water.** You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot Cube within range.","higher":"You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"cure-wounds","name":"Cure Wounds","level":1,"school":"Abjuration","classes":["Bard","Cleric","Druid","Paladin","Ranger"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A creature you touch regains a number of Hit Points equal to 2d8 plus your spellcasting ability modifier.","higher":"The healing increases by 2d8 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"detect-evil-and-good","name":"Detect Evil and Good","level":1,"school":"Divination","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"For the duration, you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of yourself. You also sense whether the *Hallow* spell is active there and, if so, where.\n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"detect-magic","name":"Detect Magic","level":1,"school":"Divination","classes":["Bard","Cleric","Druid","Paladin","Ranger","Sorcerer","Warlock","Wizard"],"time":"Action or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the Magic action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell’s school of magic.\n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"detect-poison-and-disease","name":"Detect Poison and Disease","level":1,"school":"Divination","classes":["Cleric","Druid","Paladin","Ranger"],"time":"Action or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"a yew leaf","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"For the duration, you sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 feet of yourself. You sense the kind of poison, creature, or contagion in each case.\n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"disguise-self","name":"Disguise Self","level":1,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You make yourself—including your clothing, armor, weapons, and other belongings on your person—look different until the spell ends. You can seem 1 foot shorter or taller and can appear heavier or lighter. You must adopt a form that has the same basic arrangement of limbs as you have. Otherwise, the extent of the illusion is up to you.\n\nThe changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing.\n\nTo discern that you are disguised, a creature must take the Study action to inspect your appearance and succeed on an Intelligence (Investigation) check against your spell save DC.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dissonant-whispers","name":"Dissonant Whispers","level":1,"school":"Enchantment","classes":["Bard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its Reaction, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only.","higher":"The damage increases by 1d6 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"divine-favor","name":"Divine Favor","level":1,"school":"Transmutation","classes":["Paladin"],"time":"Bonus Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"Until the spell ends, your attacks with weapons deal an extra 1d4 Radiant damage on a hit.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"divine-smite","name":"Divine Smite","level":1,"school":"Evocation","classes":["Paladin"],"time":"Bonus Action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead.","higher":"The damage increases by 1d8 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"ensnaring-strike","name":"Ensnaring Strike","level":1,"school":"Conjuration","classes":["Ranger"],"time":"Bonus Action, which you take immediately after hitting a creature with a weapon","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends.\n\nWhile Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against your spell save DC. On a success, the spell ends.","higher":"The damage increases by 1d6 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"entangle","name":"Entangle","level":1,"school":"Conjuration","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Grasping plants sprout from the ground in a 20-foot square within range. For the duration, these plants turn the ground in the area into Difficult Terrain. They disappear when the spell ends.\n\nEach creature (other than you) in the area when you cast the spell must succeed on a Strength saving throw or have the Restrained condition until the spell ends. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC. On a success, it frees itself from the grasping plants and is no longer Restrained by them.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"expeditious-retreat","name":"Expeditious Retreat","level":1,"school":"Transmutation","classes":["Sorcerer","Warlock","Wizard"],"time":"Bonus Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You take the Dash action, and until the spell ends, you can take that action again as a Bonus Action.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"faerie-fire","name":"Faerie Fire","level":1,"school":"Evocation","classes":["Bard","Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Objects in a 20-foot Cube within range are outlined in blue, green, or violet light (your choice). Each creature in the Cube is also outlined if it fails a Dexterity saving throw. For the duration, objects and affected creatures shed Dim Light in a 10-foot radius and can’t benefit from the Invisible condition.\n\nAttack rolls against an affected creature or object have Advantage if the attacker can see it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"false-life","name":"False Life","level":1,"school":"Necromancy","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a drop of alcohol","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You gain 2d4 + 4 Temporary Hit Points.","higher":"You gain 5 additional Temporary Hit Points for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"feather-fall","name":"Feather Fall","level":1,"school":"Transmutation","classes":["Bard","Sorcerer","Wizard"],"time":"Reaction, which you take when you or a creature you can see within 60 feet of you falls","ritual":false,"range":"60 feet","v":true,"s":false,"m":true,"mat":"a small feather or piece of down","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"Choose up to five falling creatures within range. A falling creature’s rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"find-familiar","name":"Find Familiar","level":1,"school":"Conjuration","classes":["Wizard"],"time":"1 hour or Ritual","ritual":true,"range":"10 feet","v":true,"s":true,"m":true,"mat":"burning incense worth 10+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You gain the service of a familiar, a spirit that takes an animal form you choose: **Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel,** or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form (see “Monsters”), though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it obeys your commands.\n\n***Telepathic Connection.*** While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a Bonus Action, you can see through the familiar’s eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has.\n\nFinally, when you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a Reaction to deliver the touch when you cast the spell.\n\n***Combat.*** The familiar is an ally to you and your allies. It rolls its own Initiative and acts on its own turn. A familiar can’t attack, but it can take other actions as normal.\n\n***Disappearance of the Familiar.*** When the familiar drops to 0 Hit Points, it disappears. It reappears after you cast this spell again. As a Magic action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a Magic action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 Hit Points or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying.\n\n***One Familiar Only.*** You can’t have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"floating-disk","name":"Floating Disk","level":1,"school":"Conjuration","classes":["Wizard"],"time":"Action or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a drop of mercury","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground.\n\nThe disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. It can move across uneven terrain, up or down stairs, slopes and the like, but it can’t cross an elevation change of 10 feet or more. For example, the disk can’t move across a 10-foot-deep pit, nor could it leave such a pit if it was created at the bottom.\n\nIf you move more than 100 feet from the disk (typically because it can’t move around an obstacle to follow you), the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"fog-cloud","name":"Fog Cloud","level":1,"school":"Conjuration","classes":["Druid","Ranger","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You create a 20-foot-radius Sphere of fog centered on a point within range. The Sphere is Heavily Obscured. It lasts for the duration or until a strong wind (such as one created by *Gust of Wind*) disperses it.","higher":"The fog’s radius increases by 20 feet for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"goodberry","name":"Goodberry","level":1,"school":"Conjuration","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a sprig of mistletoe","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"Ten berries appear in your hand and are infused with magic for the duration. A creature can take a Bonus Action to eat one berry. Eating a berry restores 1 Hit Point, and the berry provides enough nourishment to sustain a creature for one day.\n\nUneaten berries disappear when the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"grease","name":"Grease","level":1,"school":"Conjuration","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a bit of pork rind or butter","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"Nonflammable grease covers the ground in a 10-foot square centered on a point within range and turns it into Difficult Terrain for the duration.\n\nWhen the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the Prone condition. A creature that enters the area or ends its turn there must also succeed on that save or fall Prone.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"guiding-bolt","name":"Guiding Bolt","level":1,"school":"Evocation","classes":["Cleric"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 round","conc":false,"desc":"You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has Advantage.","higher":"The damage increases by 1d6 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"healing-word","name":"Healing Word","level":1,"school":"Abjuration","classes":["Bard","Cleric","Druid"],"time":"Bonus Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A creature of your choice that you can see within range regains Hit Points equal to 2d4 plus your spellcasting ability modifier.","higher":"The healing increases by 2d4 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"hellish-rebuke","name":"Hellish Rebuke","level":1,"school":"Evocation","classes":["Warlock"],"time":"Reaction, which you take in response to tak
