:"counterspell","name":"Counterspell","level":3,"school":"Abjuration","classes":["Sorcerer","Warlock","Wizard"],"time":"Reaction, which you take when you see a creature within 60 feet of yourself casting a spell with Verbal, Somatic, or Material components","ritual":false,"range":"60 feet","v":false,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You attempt to interrupt a creature in the process of casting a spell. The creature makes a Constitution saving throw. On a failed save, the spell dissipates with no effect, and the action, Bonus Action, or Reaction used to cast it is wasted. If that spell was cast with a spell slot, the slot isn’t expended.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"create-food-and-water","name":"Create Food and Water","level":3,"school":"Conjuration","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You create 45 pounds of food and 30 gallons of fresh water on the ground or in containers within range—both useful in fending off the hazards of malnutrition and dehydration. The food is bland but nourishing and looks like a food of your choice, and the water is clean. The food spoils after 24 hours if uneaten.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"daylight","name":"Daylight","level":3,"school":"Evocation","classes":["Cleric","Druid","Paladin","Ranger","Sorcerer"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"For the duration, sunlight spreads from a point within range and fills a 60-foot-radius Sphere. The sunlight’s area is Bright Light and sheds Dim Light for an additional 60 feet.\n\nAlternatively, you cast the spell on an object that isn’t being worn or carried, causing the sunlight to fill a 60-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight.\n\nIf any of this spell’s area overlaps with an area of Darkness created by a spell of level 3 or lower, that other spell is dispelled.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dispel-magic","name":"Dispel Magic","level":3,"school":"Abjuration","classes":["Bard","Cleric","Druid","Paladin","Ranger","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Choose one creature, object, or magical effect within range. Any ongoing spell of level 3 or lower on the target ends. For each ongoing spell of level 4 or higher on the target, make an ability check using your spellcasting ability (DC 10 plus that spell’s level). On a successful check, the spell ends.","higher":"You automatically end a spell on the target if the spell’s level is equal to or less than the level of the spell slot you use.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"fear","name":"Fear","level":3,"school":"Illusion","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a white feather","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Each creature in a 30-foot Cone must succeed on a Wisdom saving throw or drop whatever it is holding and have the Frightened condition for the duration.\n\nA Frightened creature takes the Dash action and moves away from you by the safest route on each of its turns unless there is nowhere to move. If the creature ends its turn in a space where it doesn’t have line of sight to you, the creature makes a Wisdom saving throw. On a successful save, the spell ends on that creature.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"fireball","name":"Fireball","level":3,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"a ball of bat guano and sulfur","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A bright streak flashes from you to a point you choose within range and then blossoms with a low roar into a fiery explosion. Each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw, taking 8d6 Fire damage on a failed save or half as much damage on a successful one.\n\nFlammable objects in the area that aren’t being worn or carried start burning.","higher":"The damage increases by 1d6 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"fly","name":"Fly","level":3,"school":"Transmutation","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a feather","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You touch a willing creature. For the duration, the target gains a Fly Speed of 60 feet and can hover. When the spell ends, the target falls if it is still aloft unless it can stop the fall.","higher":"You can target one additional creature for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"gaseous-form","name":"Gaseous Form","level":3,"school":"Transmutation","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a bit of gauze","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"A willing creature you touch shape-shifts, along with everything it’s wearing and carrying, into a misty cloud for the duration. The spell ends on the target if it drops to 0 Hit Points or if it takes a Magic action to end the spell on itself.\n\nWhile in this form, the target’s only method of movement is a Fly Speed of 10 feet, and it can hover. The target can enter and occupy the space of another creature. The target has Resistance to Bludgeoning, Piercing, and Slashing damage; it has Immunity to the Prone condition; and it has Advantage on Strength, Dexterity, and Constitution saving throws. The target can pass through narrow openings, but it treats liquids as though they were solid surfaces.\n\nThe target can’t talk or manipulate objects, and any objects it was carrying or holding can’t be dropped, used, or otherwise interacted with. Finally, the target can’t attack or cast spells.","higher":"You can target one additional creature for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"glyph-of-warding","name":"Glyph of Warding","level":3,"school":"Abjuration","classes":["Bard","Cleric","Wizard"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"powdered diamond worth 200+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled or triggered","conc":false,"desc":"You inscribe a glyph that later unleashes a magical effect. You inscribe it either on a surface (such as a table or a section of floor) or within an object that can be closed (such as a book or chest) to conceal the glyph. The glyph can cover an area no larger than 10 feet in diameter. If the surface or object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.\n\nThe glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice.\n\nWhen you inscribe the glyph, you set its trigger and choose whether it’s an explosive rune or a spell glyph, as explained below.\n\n***Set the Trigger.*** You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. Once a glyph is triggered, this spell ends.\n\nYou can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don’t trigger the glyph, such as those who say a certain password.\n\n***Explosive Rune.*** When triggered, the glyph erupts with magical energy in a 20-foot-radius Sphere centered on the glyph. Each creature in the area makes a Dexterity saving throw. A creature takes 5d8 Acid, Cold, Fire, Lightning, or Thunder damage (your choice when you create the glyph) on a failed save or half as much damage on a successful one.\n\n***Spell Glyph.*** You can store a prepared spell of level 3 or lower in the glyph by casting it as part of creating the glyph. The spell must target a single creature or an area. The spell being stored has no immediate effect when cast in this way.\n\nWhen the glyph is triggered, the stored spell takes effect. If the spell has a target, it targets the creature that triggered the glyph. If the spell affects an area, the area is centered on that creature. If the spell summons Hostile creatures or creates harmful objects or traps, they appear as close as possible to the intruder and attack it. If the spell requires Concentration, it lasts until the end of its full duration.","higher":"The damage of an explosive rune increases by 1d8 for each spell slot level above 3. If you create a spell glyph, you can store any spell of up to the same level as the spell slot you use for the *Glyph of Warding*.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"haste","name":"Haste","level":3,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a shaving of licorice root","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Choose a willing creature that you can see within range. Until the spell ends, the target’s Speed is doubled, it gains a +2 bonus to Armor Class, it has Advantage on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used to take only the Attack (one attack only), Dash, Disengage, Hide, or Utilize action.\n\nWhen the spell ends, the target is Incapacitated and has a Speed of 0 until the end of its next turn, as a wave of lethargy washes over it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"hypnotic-pattern","name":"Hypnotic Pattern","level":3,"school":"Illusion","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":false,"s":true,"m":true,"mat":"a pinch of confetti","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a twisting pattern of colors in a 30-foot Cube within range. The pattern appears for a moment and vanishes. Each creature in the area who can see the pattern must succeed on a Wisdom saving throw or have the Charmed condition for the duration. While Charmed, the creature has the Incapacitated condition and a Speed of 0.\n\nThe spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"lightning-bolt","name":"Lightning Bolt","level":3,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a bit of fur and a crystal rod","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.","higher":"The damage increases by 1d6 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"magic-circle","name":"Magic Circle","level":3,"school":"Abjuration","classes":["Cleric","Paladin","Warlock","Wizard"],"time":"1 minute","ritual":false,"range":"10 feet","v":true,"s":true,"m":true,"mat":"salt and powdered silver worth 100+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"1 hour","conc":false,"desc":"You create a 10-foot-radius, 20-foot-tall Cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the Cylinder intersects with the floor or other surface.\n\nChoose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways:\n\n- The creature can’t willingly enter the Cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw.\n- The creature has Disadvantage on attack rolls against targets within the Cylinder.\n- Targets within the Cylinder can’t be possessed by or gain the Charmed or Frightened condition from the creature.\n\nEach time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the Cylinder and protecting targets outside it.","higher":"The duration increases by 1 hour for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"major-image","name":"Major Image","level":3,"school":"Illusion","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a bit of fleece","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot Cube. The image appears at a spot that you can see within range and lasts for the duration. It seems real, including sounds, smells, and temperature appropriate to the thing depicted, but it can’t deal damage or cause conditions.\n\nIf you are within range of the illusion, you can take a Magic action to cause the image to move to any other spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Similarly, you can cause the illusion to make different sounds at different times, even making it carry on a conversation, for example.\n\nPhysical interaction with the image reveals it to be an illusion, for things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and its other sensory qualities become faint to the creature.","higher":"The spell lasts until dispelled, without requiring Concentration, if cast with a level 4+ spell slot.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"mass-healing-word","name":"Mass Healing Word","level":3,"school":"Abjuration","classes":["Bard","Cleric"],"time":"Bonus Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Up to six creatures of your choice that you can see within range regain Hit Points equal to 2d4 plus your spellcasting ability modifier.","higher":"The healing increases by 1d4 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"meld-into-stone","name":"Meld into Stone","level":3,"school":"Transmutation","classes":["Cleric","Druid","Ranger"],"time":"Action or Ritual","ritual":true,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You step into a stone object or surface large enough to fully contain your body, merging yourself and your equipment with the stone for the duration. You must touch the stone to do so. Nothing of your presence remains visible or otherwise detectable by nonmagical senses.\n\nWhile merged with the stone, you can’t see what occurs outside it, and any Wisdom (Perception) checks you make to hear sounds outside it are made with Disadvantage. You remain aware of the passage of time and can cast spells on yourself while merged in the stone. You can use 5 feet of movement to leave the stone where you entered it, which ends the spell. You otherwise can’t move.\n\nMinor physical damage to the stone doesn’t harm you, but its partial destruction or a change in its shape (to the extent that you no longer fit within it) expels you and deals 6d6 Force damage to you. The stone’s complete destruction (or transmutation into a different substance) expels you and deals 50 Force damage to you. If expelled, you move into an unoccupied space closest to where you first entered and have the Prone condition.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"nondetection","name":"Nondetection","level":3,"school":"Abjuration","classes":["Bard","Ranger","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a pinch of diamond dust worth 25+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"8 hours","conc":false,"desc":"For the duration, you hide a target that you touch from Divination spells. The target can be a willing creature, or it can be a place or an object no larger than 10 feet in any dimension. The target can’t be targeted by any Divination spell or perceived through magical scrying sensors.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"phantom-steed","name":"Phantom Steed","level":3,"school":"Illusion","classes":["Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"A Large, quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature’s appearance, and it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed.\n\nFor the duration, you or a creature you choose can ride the steed. The steed uses the **Riding Horse** stat block (see “Monsters”), except it has a Speed of 100 feet and can travel 13 miles in an hour. When the spell ends, the steed gradually fades, giving the rider 1 minute to dismount. The spell ends early if the steed takes any damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"plant-growth","name":"Plant Growth","level":3,"school":"Transmutation","classes":["Bard","Druid","Ranger"],"time":"Action (Overgrowth) or 8 hours (Enrichment)","ritual":false,"range":"150 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"This spell channels vitality into plants. The casting time you use determines whether the spell has the Overgrowth or the Enrichment effect below.\n\n***Overgrowth.*** Choose a point within range. All normal plants in a 100-foot-radius Sphere centered on that point become thick and overgrown. A creature moving through that area must spend 4 feet of movement for every 1 foot it moves. You can exclude one or more areas of any size within the spell’s area from being affected.\n\n***Enrichment.*** All plants in a half-mile radius centered on a point within range become enriched for 365 days. The plants yield twice the normal amount of food when harvested. They can benefit from only one *Plant Growth* per year.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"protection-from-energy","name":"Protection from Energy","level":3,"school":"Abjuration","classes":["Cleric","Druid","Ranger","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"For the duration, the willing creature you touch has Resistance to one damage type of your choice: Acid, Cold, Fire, Lightning, or Thunder.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"remove-curse","name":"Remove Curse","level":3,"school":"Abjuration","classes":["Cleric","Paladin","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner’s Attunement to the object so it can be removed or discarded.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"revivify","name":"Revivify","level":3,"school":"Necromancy","classes":["Cleric","Druid","Paladin","Ranger"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a diamond worth 300+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You touch a creature that has died within the last minute. That creature revives with 1 Hit Point. This spell can’t revive a creature that has died of old age, nor does it restore any missing body parts.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sending","name":"Sending","level":3,"school":"Divination","classes":["Bard","Cleric","Wizard"],"time":"Action","ritual":false,"range":"Unlimited","v":true,"s":true,"m":true,"mat":"a copper wire","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You send a short message of 25 words or fewer to a creature you have met or a creature described to you by someone who has met it. The target hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables targets to understand the meaning of your message.\n\nYou can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn’t arrive. You know if the delivery fails.\n\nUpon receiving your message, a creature can block your ability to reach it again with this spell for 8 hours. If you try to send another message during that time, you learn that you are blocked, and the spell fails.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sleet-storm","name":"Sleet Storm","level":3,"school":"Conjuration","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"a miniature umbrella","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Until the spell ends, sleet falls in a 40-foot-tall, 20-foot-radius Cylinder centered on a point you choose within range. The area is Heavily Obscured, and exposed flames in the area are doused.\n\nGround in the Cylinder is Difficult Terrain. When a creature enters the Cylinder for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Prone condition and lose Concentration.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"slow","name":"Slow","level":3,"school":"Transmutation","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a drop of molasses","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You alter time around up to six creatures of your choice in a 40-foot Cube within range. Each target must succeed on a Wisdom saving throw or be affected by this spell for the duration.\n\nAn affected target’s Speed is halved, it takes a −2 penalty to AC and Dexterity saving throws, and it can’t take Reactions. On its turns, it can take either an action or a Bonus Action, not both, and it can make only one attack if it takes the Attack action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell’s gestures too slowly.\n\nAn affected target repeats the save at the end of each of its turns, ending the spell on itself on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"speak-with-dead","name":"Speak with Dead","level":3,"school":"Necromancy","classes":["Bard","Cleric","Wizard"],"time":"Action","ritual":false,"range":"10 feet","v":true,"s":true,"m":true,"mat":"burning incense","costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"You grant the semblance of life to a corpse of your choice within range, allowing it to answer questions you pose. The corpse must have a mouth, and this spell fails if the deceased creature was Undead when it died. The spell also fails if the corpse was the target of this spell within the past 10 days.\n\nUntil the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no compulsion to offer a truthful answer if you are antagonistic toward it or it recognizes you as an enemy. This spell doesn’t return the creature’s soul to its body, only its animating spirit. Thus, the corpse can’t learn new information, doesn’t comprehend anything that has happened since it died, and can’t speculate about future events.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"speak-with-plants","name":"Speak with Plants","level":3,"school":"Transmutation","classes":["Bard","Druid","Ranger"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"You imbue plants in an immobile 30-foot Emanation with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell’s area within the past day, gaining information about creatures that have passed, weather, and other circumstances.\n\nYou can also turn Difficult Terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into Difficult Terrain that lasts for the duration.\n\nThe spell doesn’t enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you.\n\nIf a Plant creature is in the area, you can communicate with it as if you shared a common language.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"spirit-guardians","name":"Spirit Guardians","level":3,"school":"Conjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a prayer scroll","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish.\n\nWhen you cast this spell, you can designate creatures to be unaffected by it. Any other creature’s Speed is halved in the Emanation, and whenever the Emanation enters a creature’s space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.","higher":"The damage increases by 1d8 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"stinking-cloud","name":"Stinking Cloud","level":3,"school":"Conjuration","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"a rotten egg","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a 20-foot-radius Sphere of yellow, nauseating gas centered on a point within range. The cloud is Heavily Obscured. The cloud lingers in the air for the duration or until a strong wind (such as the one created by *Gust of Wind*) disperses it.\n\nEach creature that starts its turn in the Sphere must succeed on a Constitution saving throw or have the Poisoned condition until the end of the current turn. While Poisoned in this way, the creature can’t take an action or a Bonus Action.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"tiny-hut","name":"Tiny Hut","level":3,"school":"Evocation","classes":["Bard","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"a crystal bead","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"A 10-foot Emanation springs into existence around you and remains stationary for the duration. The spell fails when you cast it if the Emanation isn’t big enough to fully encapsulate all creatures in its area.\n\nCreatures and objects within the Emanation when you cast the spell can move through it freely. All other creatures and objects are barred from passing through it. Spells of level 3 or lower can’t be cast through it, and the effects of such spells can’t extend into it.\n\nThe atmosphere inside the Emanation is comfortable and dry, regardless of the weather outside. Until the spell ends, you can command the interior to have Dim Light or Darkness (no action required). The Emanation is opaque from the outside and of any color you choose, but it’s transparent from the inside.\n\nThe spell ends early if you leave the Emanation or if you cast it again.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"tongues","name":"Tongues","level":3,"school":"Divination","classes":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":false,"m":true,"mat":"a miniature ziggurat","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see the signing.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"vampiric-touch","name":"Vampiric Touch","level":3,"school":"Necromancy","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain Hit Points equal to half the amount of Necrotic damage dealt.\n\nUntil the spell ends, you can make the attack again on each of your turns as a Magic action, targeting the same creature or a different one.","higher":"The damage increases by 1d6 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"water-breathing","name":"Water Breathing","level":3,"school":"Transmutation","classes":["Druid","Ranger","Sorcerer","Wizard"],"time":"Action or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a short reed","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"water-walk","name":"Water Walk","level":3,"school":"Transmutation","classes":["Cleric","Druid","Ranger","Sorcerer"],"time":"Action or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a piece of cork","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"This spell grants the ability to move across any liquid surface—such as water, acid, mud, snow, quicksand, or lava—as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration.\n\nAn affected target must take a Bonus Action to pass from the liquid’s surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"wind-wall","name":"Wind Wall","level":3,"school":"Evocation","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a fan and a feather","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration.\n\nWhen the wall appears, each creature in its area makes a Strength saving throw, taking 4d8 Bludgeoning damage on a failed save or half as much damage on a successful one.\n\nThe strong wind keeps fog, smoke, and other gases at bay. Small or smaller flying creatures or objects can’t pass through the wall. Loose, lightweight materials brought into the wall fly upward. Arrows, bolts, and other ordinary projectiles launched at targets behind the wall are deflected upward and miss automatically. Boulders hurled by Giants or siege engines, and similar projectiles, are unaffected. Creatures in gaseous form can’t pass through it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"arcane-eye","name":"Arcane Eye","level":4,"school":"Divination","classes":["Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a bit of bat fur","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You create an Invisible, invulnerable eye within range that hovers for the duration. You mentally receive visual information from the eye, which can see in every direction. It also has Darkvision with a range of 30 feet.\n\nAs a Bonus Action, you can move the eye up to 30 feet in any direction. A solid barrier blocks the eye’s movement, but the eye can pass through an opening as small as 1 inch in diameter.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"aura-of-life","name":"Aura of Life","level":4,"school":"Abjuration","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"An aura radiates from you in a 30-foot Emanation for the duration. While in the aura, you and your allies have Resistance to Necrotic damage, and your Hit Point maximums can’t be reduced. If an ally with 0 Hit Points starts its turn in the aura, that ally regains 1 Hit Point.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"banishment","name":"Banishment","level":4,"school":"Abjuration","classes":["Cleric","Paladin","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a pentacle","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"One creature that you can see within range must succeed on a Charisma saving throw or be transported to a harmless demiplane for the duration. While there, the target has the Incapacitated condition. When the spell ends, the target reappears in the space it left or in the nearest unoccupied space if that space is occupied.\n\nIf the target is an Aberration, a Celestial, an Elemental, a Fey, or a Fiend, the target doesn’t return if the spell lasts for 1 minute. The target is instead transported to a random location on a plane (GM’s choice) associated with its creature type.","higher":"You can target one additional creature for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"black-tentacles","name":"Black Tentacles","level":4,"school":"Conjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"a tentacle","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in that area into Difficult Terrain.\n\nEach creature in that area makes a Strength saving throw. On a failed save, it takes 3d6 Bludgeoning damage, and it has the Restrained condition until the spell ends. A creature also makes that save if it enters the area or ends it turn there. A creature makes that save only once per turn.\n\nA Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC, ending the condition on itself on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"blight","name":"Blight","level":4,"school":"Necromancy","classes":["Druid","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A creature that you can see within range makes a Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one. A Plant creature automatically fails the save.\n\nAlternatively, target a nonmagical plant that isn’t a creature, such as a tree or shrub. It doesn’t make a save; it simply withers and dies.","higher":"The damage increases by 1d8 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"charm-monster","name":"Charm Monster","level":4,"school":"Enchantment","classes":["Bard","Druid","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"One creature you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you.","higher":"You can target one additional creature for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"compulsion","name":"Compulsion","level":4,"school":"Enchantment","classes":["Bard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Each creature of your choice that you can see within range must succeed on a Wisdom saving throw or have the Charmed condition until the spell ends.\n\nFor the duration, you can take a Bonus Action to designate a direction that is horizontal to you. Each Charmed target must use as much of its movement as possible to move in that direction on its next turn, taking the safest route. After moving in this way, a target repeats the save, ending the spell on itself on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"confusion","name":"Confusion","level":4,"school":"Enchantment","classes":["Bard","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"three nut shells","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Each creature in a 10-foot-radius Sphere centered on a point you choose within range must succeed on a Wisdom saving throw, or that target can’t take Bonus Actions or Reactions and must roll 1d10 at the start of each of its turns to determine its behavior for that turn, consulting the table below.\n\n| 1d10 | Behavior for the Turn |\n| --- | --- |\n| 1 | The target doesn’t take an action, and it uses all its movement to move. Roll 1d4 for the direction: 1, north; 2, east; 3, south; or 4, west. |\n| 2–6 | The target doesn’t move or take actions. |\n| 7–8 | The target doesn’t move, and it takes the Attack action to make one melee attack against a random creature within reach. If none are within reach, the target takes no action. |\n| 9–10 | The target chooses its behavior. |\n\nAt the end of each of its turns, an affected target repeats the save, ending the spell on itself on a success.","higher":"The Sphere’s radius increases by 5 feet for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"conjure-minor-elementals","name":"Conjure Minor Elementals","level":4,"school":"Conjuration","classes":["Druid","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You conjure spirits from the Elemental Planes that flit around you in a 15-foot Emanation for the duration. Until the spell ends, any attack you make deals an extra 2d8 damage when you hit a creature in the Emanation. This damage is Acid, Cold, Fire, or Lightning (your choice when you make the attack).\n\nIn addition, the ground in the Emanation is Difficult Terrain for your enemies.","higher":"The damage increases by 1d8 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"conjure-woodland-beings","name":"Conjure Woodland Beings","level":4,"school":"Conjuration","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You conjure nature spirits that flit around you in a 10-foot Emanation for the duration. Whenever the Emanation enters the space of a creature you can see and whenever a creature you can see enters the Emanation or ends its turn there, you can force that creature to make a Wisdom saving throw. The creature takes 5d8 Force damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.\n\nIn addition, you can take the Disengage action as a Bonus Action for the spell’s duration.","higher":"The damage increases by 1d8 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"control-water","name":"Control Water","level":4,"school":"Transmutation","classes":["Cleric","Druid","Wizard"],"time":"Action","ritual":false,"range":"300 feet","v":true,"s":true,"m":true,"mat":"a mixture of water and dust","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"Until the spell ends, you control any water inside an area you choose that is a Cube up to 100 feet on a side, using one of the following effects. As a Magic action on your later turns, you can repeat the same effect or choose a different one.\n\n***Flood.*** You cause the water level of all standing water in the area to rise by as much as 20 feet. If you choose an area in a large body of water, you instead create a 20-foot tall wave that travels from one side of the area to the other and then crashes. Any Huge or smaller vehicles in the wave’s path are carried with it to the other side. Any Huge or smaller vehicles struck by the wave have a 25 percent chance of capsizing.\n\nThe water level remains elevated until the spell ends or you choose a different effect. If this effect produced a wave, the wave repeats on the start of your next turn while the flood effect lasts.\n\n***Part Water.*** You part water in the area and create a trench. The trench extends across the spell’s area, and the separated water forms a wall to either side. The trench remains until the spell ends or you choose a different effect. The water then slowly fills in the trench over the course of the next round until the normal water level is restored.\n\n***Redirect Flow.*** You cause flowing water in the area to move in a direction you choose, even if the water has to flow over obstacles, up walls, or in other unlikely directions. The water in the area moves as you direct it, but once it moves beyond the spell’s area, it resumes its flow based on the terrain. The water continues to move in the direction you chose until the spell ends or you choose a different effect.\n\n***Whirlpool.*** You cause a whirlpool to form in the center of the area, which must be at least 50 feet square and 25 feet deep. The whirlpool lasts until you choose a different effect or the spell ends. The whirlpool is 5 feet wide at the base, up to 50 feet wide at the top, and 25 feet tall. Any creature in the water and within 25 feet of the whirlpool is pulled 10 feet toward it. When a creature enters the whirlpool for the first time on a turn or ends its turn there, it makes a Strength saving throw. On a failed save, the creature takes 2d8 Bludgeoning damage. On a successful save, the creature takes half as much damage. A creature can swim away from the whirlpool only if it first takes an action to pull away and succeeds on a Strength (Athletics) check against your spell save DC.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"death-ward","name":"Death Ward","level":4,"school":"Abjuration","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You touch a creature and grant it a measure of protection from death. The first time the target would drop to 0 Hit Points before the spell ends, the target instead drops to 1 Hit Point, and the spell ends.\n\nIf the spell is still in effect when the target is subjected to an effect that would kill it instantly without dealing damage, that effect is negated against the target, and the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dimension-door","name":"Dimension Door","level":4,"school":"Conjuration","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"500 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You teleport to a location within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as “200 feet straight downward” or “300 feet upward to the northwest at a 45-degree angle.”\n\nYou can also teleport one willing creature. The creature must be within 5 feet of you when you teleport, and it teleports to a space within 5 feet of your destination space.\n\nIf you, the other creature, or both would arrive in a space occupied by a creature or completely filled by one or more objects, you and any creature traveling with you each take 4d6 Force damage, and the teleportation fails.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"divination","name":"Divination","level":4,"school":"Divination","classes":["Cleric","Druid","Wizard"],"time":"Action or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"incense worth 25+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"This spell puts you in contact with a god or a god’s servants. You ask one question about a specific goal, event, or activity to occur within 7 days. The GM offers a truthful reply, which might be a short phrase or cryptic rhyme. The spell doesn’t account for circumstances that might change the answer, such as the casting of other spells.\n\nIf you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dominate-beast","name":"Dominate Beast","level":4,"school":"Enchantment","classes":["Druid","Ranger","Sorcerer"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"One Beast you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.\n\nYou have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as “Attack that creature,” “Move over there,” or “Fetch that object.” The target does its best to obey on its turn. If it completes an order and doesn’t receive further direction from you, it acts and moves as it likes, focusing on protecting itself.\n\nYou can command the target to take a Reaction but must take your own Reaction to do so.","higher":"Your Concentration can last longer with a spell slot of level 5 (up to 10 minutes), 6 (up to 1 hour), or 7+ (up to 8 hours).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"fabricate","name":"Fabricate","level":4,"school":"Transmutation","classes":["Wizard"],"time":"10 minutes","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, or clothes from flax or wool.\n\nChoose raw materials that you can see within range. You can fabricate a Large or smaller object (contained within a 10-foot Cube or eight connected 5-foot Cubes) given a sufficient quantity of material. If you’re working with metal, stone, or another mineral substance, however, the fabricated object can be no larger than Medium (contained within a 5-foot Cube). The quality of any fabricated objects is based on the quality of the raw materials.\n\nCreatures and magic items can’t be created by this spell. You also can’t use it to create items that require a high degree of skill—such as weapons and armor—unless you have proficiency with the type of Artisan’s Tools used to craft such objects.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"faithful-hound","name":"Faithful Hound","level":4,"school":"Conjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a silver whistle","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You conjure a phantom watchdog in an unoccupied space that you can see within range. The hound remains for the duration or until the two of you are more than 300 feet apart from each other.\n\nNo one but you can see the hound, and it is intangible and invulnerable. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound has Truesight with a range of 30 feet.\n\nAt the start of each of your turns, the hound attempts to bite one enemy within 5 feet of it. That enemy must succeed on a Dexterity saving throw or take 4d8 Force damage.\n\nOn your later turns, you can take a Magic action to move the hound up to 30 feet.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"fire-shield","name":"Fire Shield","level":4,"school":"Evocation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a bit of phosphorus or a firefly","costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"Wispy flames wreathe your body for the duration, shedding Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.\n\nThe flames provide you with a warm shield or a chill shield, as you choose. The warm shield grants you Resistance to Cold damage, and the chill shield grants you Resistance to Fire damage.\n\nIn addition, whenever a creature within 5 feet of you hits you with a melee attack roll, the shield erupts with flame. The attacker takes 2d8 Fire damage from a warm shield or 2d8 Cold damage from a chill shield.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"freedom-of-movement","name":"Freedom of Movement","level":4,"school":"Abjuration","classes":["Bard","Cleric","Druid","Ranger"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a leather strap","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch a willing creature. For the duration, the target’s movement is unaffected by Difficult Terrain, and spells and other magical effects can neither reduce the target’s Speed nor cause the target to have the Paralyzed or Restrained conditions. The target also has a Swim Speed equal to its Speed.\n\nIn addition, the target can spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature imposing the Grappled condition on it.","higher":"You can target one additional creature for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"giant-insect","name":"Giant Insect","level":4,"school":"Conjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You summon a giant centipede, spider, or wasp (chosen when you cast the spell). It manifests in an unoccupied space you can see within range and uses the **Giant Insect** stat block. The form you choose determines certain details in its stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends.\n\nThe creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don’t issue any, it takes the Dodge action and uses its movement to avoid danger.","higher":"Use the spell slot’s level for the spell’s level in the stat block.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"greater-invisibility","name":"Greater Invisibility","level":4,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A creature you touch has the Invisible condition until the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"guardian-of-faith","name":"Guardian of Faith","level":4,"school":"Conjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"A Large spectral guardian appears and hovers for the duration in an unoccupied space that you can see within range. The guardian occupies that space and is invulnerable, and it appears in a form appropriate for your deity or pantheon.\n\nAny enemy that moves to a space within 10 feet of the guardian for the first time on a turn or starts its turn there makes a Dexterity saving throw, taking 20 Radiant damage on a failed save or half as much damage on a successful one. The guardian vanishes when it has dealt a total of 60 damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"hallucinatory-terrain","name":"Hallucinatory Terrain","level":4,"school":"Illusion","classes":["Bard","Druid","Warlock","Wizard"],"time":"10 minutes","ritual":false,"range":"300 feet","v":true,"s":true,"m":true,"mat":"a mushroom","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"You make natural terrain in a 150-foot Cube in range look, sound, and smell like another sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren’t changed.\n\nThe tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to notice the illusion. If the difference isn’t obvious by touch, a creature examining the illusion can take the Study action to make an Intelligence (Investigation) check against your spell save DC to disbelieve it. If a creature discerns that the terrain is illusory, the creature sees a vague image superimposed on the real terrain.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"ice-storm","name":"Ice Storm","level":4,"school":"Evocation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"300 feet","v":true,"s":true,"m":true,"mat":"a mitten","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Hail falls in a 20-foot-radius, 40-foot-high Cylinder centered on a point within range. Each creature in the Cylinder makes a Dexterity saving throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a failed save or half as much damage on a successful one.\n\nHailstones turn ground in the Cylinder into Difficult Terrain until the end of your next turn.","higher":"The Bludgeoning damage increases by 1d10 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"locate-creature","name":"Locate Creature","level":4,"school":"Divination","classes":["Bard","Cleric","Druid","Paladin","Ranger","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"fur from a bloodhound","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"Describe or name a creature that is familiar to you. You sense the direction to the creature’s location if that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement.\n\nThe spell can locate a specific creature known to you or the nearest creature of a specific kind (such as a human or a unicorn) if you have seen such a creature up close—within 30 feet—at least once. If the creature you described or named is in a different form, such as under the effects of a *Flesh to Stone* or *Polymorph* spell, this spell doesn’t locate the creature.\n\nThis spell can’t locate a creature if any thickness of lead blocks a direct path between you and the creature.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"phantasmal-killer","name":"Phantasmal Killer","level":4,"school":"Illusion","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You tap into the nightmares of a creature you can see within range and create an illusion of its deepest fears, visible only to that creature. The target makes a Wisdom saving throw. On a failed save, the target takes 4d10 Psychic damage and has Disadvantage on ability checks and attack rolls for the duration. On a successful save, the target takes half as much damage, and the spell ends.\n\nFor the duration, the target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes the Psychic damage again. On a successful save, the spell ends.","higher":"The damage increases by 1d10 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"polymorph","name":"Polymorph","level":4,"school":"Transmutation","classes":["Bard","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a caterpillar cocoon","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You attempt to transform a creature that you can see within range into a Beast. The target must succeed on a Wisdom saving throw or shape-shift into a Beast form for the duration. That form can be any Beast you choose that has a Challenge Rating equal to or less than the target’s (or the target’s level if it doesn’t have a Challenge Rating). The target’s game statistics are replaced by the stat block of the chosen Beast, but the target retains its alignment, personality, creature type, Hit Points, and Hit Point Dice. See the “Animals” section of “Monsters” for a sample of Beast stat blocks.\n\nThe target gains a number of Temporary Hit Points equal to the Hit Points of the Beast form. These Temporary Hit Points vanish if any remain when the spell ends. The spell ends early on the target if it has no Temporary Hit Points left.\n\nThe target is limited in the actions it can perform by the anatomy of its new form, and it can’t speak or cast spells.\n\nThe target’s gear melds into the new form. The creature can’t use or otherwise benefit from any of that equipment.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"private-sanctum","name":"Private Sanctum","level":4,"school":"Abjuration","classes":["Wizard"],"time":"10 minutes","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a thin sheet of lead","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"You make an area within range magically secure. The area is a Cube that can be as small as 5 feet to as large as 100 feet on each side. The spell lasts for the duration.\n\nWhen you cast the spell, you decide what sort of security the spell provides, choosing any of the following properties:\n\n- Sound can’t pass through the barrier at the edge of the warded area.\n- The barrier of the warded area appears dark and foggy, preventing vision (including Darkvision) through it.\n- Sensors created by Divination spells can’t appear inside the protected area or pass through the barrier at its perimeter.\n- Creatures in the area can’t be targeted by Divination spells.\n- Nothing can teleport into or out of the warded area.\n- Planar travel is blocked within the warded area.\n\nCasting this spell on the same spot every day for 365 days makes the spell last until dispelled.","higher":"You can increase the size of the Cube by 100 feet for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"resilient-sphere","name":"Resilient Sphere","level":4,"school":"Abjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a glass sphere","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A shimmering sphere encloses a Large or smaller creature or object within range. An unwilling creature must succeed on a Dexterity saving throw or be enclosed for the duration.\n\nNothing—not physical objects, energy, or other spell effects—can pass through the barrier, in or out, though a creature in the sphere can breathe there. The sphere is immune to all damage, and a creature or object inside can’t be damaged by attacks or effects originating from outside, nor can a creature inside the sphere damage anything outside it.\n\nThe sphere is weightless and just large enough to contain the creature or object inside. An enclosed creature can take an action to push against the sphere’s walls and thus roll the sphere at up to half the creature’s Speed. Similarly, the globe can be picked up and moved by other creatures.\n\nA *Disintegrate* spell targeting the globe destroys it without harming anything inside.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"secret-chest","name":"Secret Chest","level":4,"school":"Conjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a chest, 3 feet by 2 feet by 2 feet, constructed from rare materials worth 5,000+ GP, and a Tiny replica of the chest made from the same materials worth 50+ GP","costly":true,"consumed":false,"duration":"Until dispelled","conc":false,"desc":"You hide a chest and all its contents on the Ethereal Plane. You must touch the chest and the miniature replica that serve as Material components for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet).\n\nWhile the chest remains on the Ethereal Plane, you can take a Magic action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by taking a Magic action to touch the chest and the replica.\n\nAfter 60 days, there is a cumulative 5 percent chance at the end of each day that the spell ends. The spell also ends if you cast this spell again or if the Tiny replica chest is destroyed. If the spell ends and the larger chest is on the Ethereal Plane, the chest remains there for you or someone else to find.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"stone-shape","name":"Stone Shape","level":4,"school":"Transmutation","classes":["Cleric","Druid","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"soft clay","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape you like. For example, you could shape a large rock into a weapon, statue, or coffer, or you could make a small passage through a wall that is 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn’t possible.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"stoneskin","name":"Stoneskin","level":4,"school":"Transmutation","classes":["Druid","Ranger","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"diamond dust worth 100+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Concentration, up to 1 hour","conc":true,"desc":"Until the spell ends, one willing creature you touch has Resistance to Bludgeoning, Piercing, and Slashing damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"vitriolic-sphere","name":"Vitriolic Sphere","level":4,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"a drop of bile","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You point at a location within range, and a glowing, 1-foot-diameter ball of acid streaks there and explodes in a 20-foot-radius Sphere. Each creature in that area makes a Dexterity saving throw. On a failed save, a creature takes 10d4 Acid damage and another 5d4 Acid damage at the end of its next turn. On a successful save, a creature takes half the initial damage only.","higher":"The initial damage increases by 2d4 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"wall-of-fire","name":"Wall of Fire","level":4,"school":"Evocation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a piece of charcoal","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration.\n\nWhen the wall appears, each creature in its area makes a Dexterity saving throw, taking 5d8 Fire damage on a failed save or half as much damage on a successful one.\n\nOne side of the wall, selected by you when you cast this spell, deals 5d8 Fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage.","higher":"The damage increases by 1d8 for each spell slot level above 4.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"animate-objects","name":"Animate Objects","level":5,"school":"Transmutation","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Objects animate at your command. Choose a number of nonmagical objects within range that aren’t being worn or carried, aren’t fixed to a surface, and aren’t Gargantuan. The maximum number of objects is equal to your spellcasting ability modifier; for this number, a Medium or smaller target counts as one object, a Large target counts as two, and a Huge target counts as three.\n\nEach target animates, sprouts legs, and becomes a Construct that uses the **Animated Object** stat block; this creature is under your control until the spell ends or until it is reduced to 0 Hit Points. Each creature you make with this spell is an ally to you and your allies. In combat, it shares your Initiative count and takes its turn immediately after yours.\n\nUntil the spell ends, you can take a Bonus Action to mentally command any creature you made with this spell if the creature is within 500 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to each one). If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. When the creature drops to 0 Hit Points, it reverts to its object form, and any remaining damage carries over to that form.","higher":"The creature’s Slam damage increases by 1d4 (Medium or smaller), 1d6 (Large), or 1d12 (Huge) for each spell slot level above 5. or make attacks with Ranged or Reach weapons through the barrier.\n\nIf you move so that an affected creature is forced to pass through the barrier, the spell ends.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"antilife-shell","name":"Antilife Shell","level":5,"school":"Abjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"An aura extends from you in a 10-foot Emanation for the duration. The aura prevents creatures other than Constructs and Undead from passing or reaching through it. An affected creature can cast spells Wisdom saving throw to end the effect, as described below.\n\n***Ending the Effect.*** If the Frightened or Charmed creature ends its turn more than 120 feet away from the target, the creature makes a Wisdom saving throw. On a successful save, the creature is no longer affected by the target. A creature that successfully saves against this effect is immune to it for 1 minute, after which it can be affected again.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"arcane-hand","name":"Arcane Hand","level":5,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"an eggshell and a glove","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a Large hand of shimmering magical energy in an unoccupied space that you can see within range. The hand lasts for the duration, and it moves at your command, mimicking the movements of your own hand.\n\nThe hand is an object that has AC 20 and Hit Points equal to your Hit Point maximum. If it drops to 0 Hit Points, the spell ends. The hand doesn’t occupy its space.\n\nWhen you cast the spell and as a Bonus Action on your later turns, you can move the hand up to 60 feet and then cause one of the following effects:\n\n**Clenched Fist.** The hand strikes a target within 5 feet of it. Make a melee spell attack. On a hit, the target takes 5d8 Force damage.\n\n**Forceful Hand.** The hand attempts to push a Huge or smaller creature within 5 feet of it. The target must succeed on a Strength saving throw, or the hand pushes the target up to 5 feet plus a number of feet equal to five times your spellcasting ability modifier. The hand moves with the target, remaining within 5 feet of it.\n\n**Grasping Hand.** The hand attempts to grapple a Huge or smaller creature within 5 feet of it. The target must succeed on a Dexterity saving throw, or the target has the Grappled condition, with an escape DC equal to your spell save DC. While the hand grapples the target, you can take a Bonus Action to cause the hand to crush it, dealing Bludgeoning damage to the target equal to 4d6 plus your spellcasting ability modifier.\n\n**Interposing Hand.** The hand grants you Half Cover against attacks and other effects that originate from its space or that pass through it. In addition, its space counts as Difficult Terrain for your enemies.","higher":"The damage of the Clenched Fist increases by 2d8 and the damage of the Grasping Hand increases by 2d6 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"awaken","name":"Awaken","level":5,"school":"Transmutation","classes":["Bard","Druid"],"time":"8 hours","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"an agate worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You spend the casting time tracing magical pathways within a precious gemstone, and then touch the target. The target must be either a Beast or Plant creature with an Intelligence of 3 or less or a natural plant that isn’t a creature. The target gains an Intelligence of 10 and the ability to speak one language you know. If the target is a natural plant, it becomes a Plant creature and gains the ability to move its limbs, roots, vines, creepers, and so forth, and it gains senses similar to a human’s. The GM chooses statistics appropriate for the awakened Plant, such as the statistics for the **Awakened Shrub** or **Awakened Tree** in “Monsters.”\n\nThe awakened target has the Charmed condition for 30 days or until you or your allies deal damage to it. When that condition ends, the awakened creature chooses its attitude toward you.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"cloudkill","name":"Cloudkill","level":5,"school":"Conjuration","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create a 20-foot-radius Sphere of yellow-green fog centered on a point within range. The fog lasts for the duration or until strong wind (such as the one created by *Gust of Wind*) disperses it, ending the spell. Its area is Heavily Obscured.\n\nEach creature in the Sphere makes a Constitution saving throw, taking 5d8 Poison damage on a failed save or half as much damage on a successful one. A creature must also make this save when the Sphere moves into its space and when it enters the Sphere or ends its turn there. A creature makes this save only once per turn.\n\nThe Sphere moves 10 feet away from you at the start of each of your turns.","higher":"The damage increases by 1d8 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"commune","name":"Commune","level":5,"school":"Divination","classes":["Cleric"],"time":"1 minute or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"incense","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"You contact a deity or a divine proxy and ask up to three questions that can be answered with yes or no. You must ask your questions before the spell ends. You receive a correct answer for each question.\n\nDivine beings aren’t necessarily omniscient, so you might receive “unclear” as an answer if a question pertains to information that lies beyond the deity’s knowledge. In a case where a one-word answer could be misleading or contrary to the deity’s interests, the GM might offer a short phrase as an answer instead.\n\nIf you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"commune-with-nature","name":"Commune with Nature","level":5,"school":"Divination","classes":["Druid","Ranger"],"time":"1 minute or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You commune with nature spirits and gain knowledge of the surrounding area. In the outdoors, the spell gives you knowledge of the area within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn’t function where nature has been replaced by construction, such as in castles and settlements.\n\nChoose three of the following facts; you learn those facts as they pertain to the spell’s area:\n\n- Locations of settlements\n- Locations of portals to other planes of existence\n- Location of one Challenge Rating 10+ creature (GM’s choice) that is a Celestial, an Elemental, a Fey, a Fiend, or an Undead\n- The most prevalent kind of plant, mineral, or Beast (you choose which to learn)\n- Locations of bodies of water\n\nFor example, you could determine the location of a powerful monster in the area, the locations of bodies of water, and the locations of any towns.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"cone-of-cold","name":"Cone of Cold","level":5,"school":"Evocation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a small crystal or glass cone","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You unleash a blast of cold air. Each creature in a 60
