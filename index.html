-foot Cone originating from you makes a Constitution saving throw, taking 8d8 Cold damage on a failed save or half as much damage on a successful one. A creature killed by this spell becomes a frozen statue until it thaws.","higher":"The damage increases by 1d8 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"conjure-elemental","name":"Conjure Elemental","level":5,"school":"Conjuration","classes":["Druid","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You conjure a Large, intangible spirit from the Elemental Planes that appears in an unoccupied space within range. Choose the spirit’s element, which determines its damage type: air (Lightning), earth (Thunder), fire (Fire), or water (Cold). The spirit lasts for the duration.\n\nWhenever a creature you can see enters the spirit’s space or starts its turn within 5 feet of the spirit, you can force that creature to make a Dexterity saving throw if the spirit has no creature Restrained. On failed save, the target takes 8d8 damage of the spirit’s type, and the target has the Restrained condition until the spell ends. At the start of each of its turns, the Restrained target repeats the save. On a failed save, the target takes 4d8 damage of the spirit’s type. On a successful save, the target isn’t Restrained by the spirit.","higher":"The damage increases by 1d8 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"contact-other-plane","name":"Contact Other Plane","level":5,"school":"Divination","classes":["Warlock","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"You mentally contact a demigod, the spirit of a longdead sage, or some other knowledgeable entity from another plane. Contacting this otherworldly intelligence can break your mind. When you cast this spell, make a DC 15 Intelligence saving throw. On a successful save, you can ask the entity up to five questions. You must ask your questions before the spell ends. The GM answers each question with one word, such as “yes,” “no,” “maybe,” “never,” “irrelevant,” or “unclear” (if the entity doesn’t know the answer to the question). If a one-word answer would be misleading, the GM might instead offer a short phrase as an answer.\n\nOn a failed save, you take 6d6 Psychic damage and have the Incapacitated condition until you finish a Long Rest. A *Greater Restoration* spell cast on you ends this effect.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"contagion","name":"Contagion","level":5,"school":"Necromancy","classes":["Cleric","Druid"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"7 days","conc":false,"desc":"Your touch inflicts a magical contagion. The target must succeed on a Constitution saving throw or take 11d8 Necrotic damage and have the Poisoned condition. Also, choose one ability when you cast the spell. While Poisoned, the target has Disadvantage on saving throws made with the chosen ability.\n\nThe target must repeat the saving throw at the end of each of its turns until it gets three successes or failures. If the target succeeds on three of these saves, the spell ends on the target. If the target fails three of the saves, the spell lasts for 7 days on it.\n\nWhenever the Poisoned target receives an effect that would end the Poisoned condition, the target must succeed on a Constitution saving throw, or the Poisoned condition doesn’t end on it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"creation","name":"Creation","level":5,"school":"Illusion","classes":["Sorcerer","Wizard"],"time":"1 minute","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a paintbrush","costly":false,"consumed":false,"duration":"Special","conc":false,"desc":"You pull wisps of shadow material from the Shadowfell to create an object within range. It is either an object of vegetable matter (soft goods, rope, wood, and the like) or mineral matter (stone, crystal, metal, and the like). The object must be no larger than a 5-foot Cube, and the object must be of a form and material that you have seen.\n\nThe spell’s duration depends on the object’s material, as shown in the Materials table. If the object is composed of multiple materials, use the shortest duration. Using any object created by this spell as another spell’s Material component causes the other spell to fail.\n\n**Materials**\n\n| Material | Duration |\n| --- | --- |\n| Vegetable matter | 24 hours |\n| Stone or crystal | 12 hours |\n| Precious metals | 1 hour |\n| Gems | 10 minutes |\n| Adamantine or mithral | 1 minute |","higher":"The Cube increases by 5 feet for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"dispel-evil-and-good","name":"Dispel Evil and Good","level":5,"school":"Abjuration","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"powdered silver and iron","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"For the duration, Celestials, Elementals, Fey, Fiends, and Undead have Disadvantage on attack rolls against you. You can end the spell early by using either of the following special functions.\n\n***Break Enchantment.*** As a Magic action, you touch a creature that is possessed by or has the Charmed or Frightened condition from one or more creatures of the types above. The target is no longer possessed, Charmed, or Frightened by such creatures.\n\n***Dismissal.*** As a Magic action, you target one creature you can see within 5 feet of you that has one of the creature types above. The target must succeed on a Charisma saving throw or be sent back to its home plane if it isn’t there already. If they aren’t on their home plane, Undead are sent to the Shadowfell, and Fey are sent to the Feywild.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dominate-person","name":"Dominate Person","level":5,"school":"Enchantment","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"One Humanoid you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.\n\nYou have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as “Attack that creature,” “Move over there,” or “Fetch that object.” The target does its best to obey on its turn. If it completes an order and doesn’t receive further direction from you, it acts and moves as it likes, focusing on protecting itself.\n\nYou can command the target to take a Reaction but must take your own Reaction to do so.","higher":"Your Concentration can last longer with a spell slot of level 6 (up to 10 minutes), 7 (up to 1 hour), or 8+ (up to 8 hours).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"dream","name":"Dream","level":5,"school":"Illusion","classes":["Bard","Warlock","Wizard"],"time":"1 minute","ritual":false,"range":"Special","v":true,"s":true,"m":true,"mat":"a handful of sand","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You target a creature you know on the same plane of existence. You or a willing creature you touch enters a trance state to act as a dream messenger. While in the trance, the messenger is Incapacitated and has a Speed of 0.\n\nIf the target is asleep, the messenger appears in the target’s dreams and can converse with the target as long as it remains asleep, through the spell’s duration. The messenger can also shape the dream’s environment, creating landscapes, objects, and other images. The messenger can emerge from the trance at any time, ending the spell. The target recalls the dream perfectly upon waking.\n\nIf the target is awake when you cast the spell, the messenger knows it and can either end the trance (and the spell) or wait for the target to sleep, at which point the messenger enters its dreams.\n\nYou can make the messenger terrifying to the target. If you do so, the messenger can deliver a message of no more than ten words, and then the target makes a Wisdom saving throw. On a failed save, the target gains no benefit from its rest, and it takes 3d6 Psychic damage when it wakes up.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"flame-strike","name":"Flame Strike","level":5,"school":"Evocation","classes":["Cleric"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a pinch of sulfur","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A vertical column of brilliant fire roars down from above. Each creature in a 10-foot-radius, 40-foot-high Cylinder centered on a point within range makes a Dexterity saving throw, taking 5d6 Fire damage and 5d6 Radiant damage on a failed save or half as much damage on a successful one.","higher":"The Fire damage and the Radiant damage increase by 1d6 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"geas","name":"Geas","level":5,"school":"Enchantment","classes":["Bard","Cleric","Druid","Paladin","Wizard"],"time":"1 minute","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"30 days","conc":false,"desc":"You give a verbal command to a creature that you can see within range, ordering it to carry out some service or refrain from an action or a course of activity as you decide. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target automatically succeeds if it can’t understand your command.\n\nWhile Charmed, the creature takes 5d10 Psychic damage if it acts in a manner directly counter to your command. It takes this damage no more than once each day.\n\nYou can issue any command you choose, short of an activity that would result in certain death. Should you issue a suicidal command, the spell ends.\n\nA *Remove Curse*, *Greater Restoration*, or *Wish* spell ends this spell.","higher":"If you use a level 7 or 8 spell slot, the duration is 365 days. If you use a level 9 spell slot, the spell lasts until it is ended by one of the spells mentioned above.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"greater-restoration","name":"Greater Restoration","level":5,"school":"Abjuration","classes":["Bard","Cleric","Druid","Paladin","Ranger"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"diamond dust worth 100+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You touch a creature and magically remove one of the following effects from it:\n\n- 1 Exhaustion level\n- The Charmed or Petrified condition\n- A curse, including the target’s Attunement to a cursed magic item\n- Any reduction to one of the target’s ability scores\n- Any reduction to the target’s Hit Point maximum","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"hallow","name":"Hallow","level":5,"school":"Abjuration","classes":["Cleric"],"time":"24 hours","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"incense worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"You touch a point and infuse an area around it with holy or unholy power. The area can have a radius up to 60 feet, and the spell fails if the radius includes an area already under the effect of *Hallow*. The affected area has the following effects.\n\n***Hallowed Ward.*** Choose any of these creature types: Aberration, Celestial, Elemental, Fey, Fiend, or Undead. Creatures of the chosen types can’t willingly enter the area, and any creature that is possessed by or that has the Charmed or Frightened condition from such creatures isn’t possessed, Charmed, or Frightened by them while in the area.\n\n***Extra Effect.*** You bind an extra effect to the area from the list below:\n\n**Courage.** Creatures of any types you choose can’t gain the Frightened condition while in the area.\n\n**Darkness.** Darkness fills the area. Normal light, as well as magical light created by spells of a level lower than this spell, can’t illuminate the area.\n\n**Daylight.** Bright light fills the area. Magical Darkness created by spells of a level lower than this spell can’t extinguish the light.\n\n**Peaceful Rest.** Dead bodies interred in the area can’t be turned into Undead.\n\n**Extradimensional Interference.** Creatures of any types you choose can’t enter or exit the area using teleportation or interplanar travel.\n\n**Fear.** Creatures of any types you choose have the Frightened condition while in the area.\n\n**Resistance.** Creatures of any types you choose have Resistance to one damage type of your choice while in the area.\n\n**Silence.** No sound can emanate from within the area, and no sound can reach into it.\n\n**Tongues.** Creatures of any types you choose can communicate with any other creature in the area even if they don’t share a common language.\n\n**Vulnerability.** Creatures of any types you choose have Vulnerability to one damage type of your choice while in the area.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"hold-monster","name":"Hold Monster","level":5,"school":"Enchantment","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"a straight piece of iron","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Choose a creature that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.","higher":"You can target one additional creature for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"insect-plague","name":"Insect Plague","level":5,"school":"Conjuration","classes":["Cleric","Druid","Sorcerer"],"time":"Action","ritual":false,"range":"300 feet","v":true,"s":true,"m":true,"mat":"a locust","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"Swarming locusts fill a 20-foot-radius Sphere centered on a point you choose within range. The Sphere remains for the duration, and its area is Lightly Obscured and Difficult Terrain.\n\nWhen the swarm appears, each creature in it makes a Constitution saving throw, taking 4d10 Piercing damage on a failed save or half as much damage on a successful one. A creature also makes this save when it enters the spell’s area for the first time on a turn or ends its turn there. A creature makes this save only once per turn.","higher":"The damage increases by 1d10 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"legend-lore","name":"Legend Lore","level":5,"school":"Divination","classes":["Bard","Cleric","Wizard"],"time":"10 minutes","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"incense worth 250+ GP, which the spell consumes, and four ivory strips worth 50+ GP each","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"Name or describe a famous person, place, or object. The spell brings to your mind a brief summary of the significant lore about that famous thing, as described by the GM.\n\nThe lore might consist of important details, amusing revelations, or even secret lore that has never been widely known. The more information you already know about the thing, the more precise and detailed the information you receive is. That information is accurate but might be couched in figurative language or poetry, as determined by the GM.\n\nIf the famous thing you chose isn’t actually famous, you hear sad musical notes played on a trombone, and the spell fails.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mass-cure-wounds","name":"Mass Cure Wounds","level":5,"school":"Abjuration","classes":["Bard","Cleric","Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A wave of healing energy washes out from a point you can see within range. Choose up to six creatures in a 30-foot-radius Sphere centered on that point. Each target regains Hit Points equal to 5d8 plus your spellcasting ability modifier.","higher":"The healing increases by 1d8 for each spell slot level above 5.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"mislead","name":"Mislead","level":5,"school":"Illusion","classes":["Bard","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":false,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You gain the Invisible condition at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends immediately after you make an attack roll, deal damage, or cast a spell.\n\nAs a Magic action, you can move the illusory double up to twice your Speed and make it gesture, speak, and behave in whatever way you choose. It is intangible and invulnerable.\n\nYou can see through its eyes and hear through its ears as if you were located where it is.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"modify-memory","name":"Modify Memory","level":5,"school":"Enchantment","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You attempt to reshape another creature’s memories. One creature that you can see within range makes a Wisdom saving throw. If you are fighting the creature, it has Advantage on the save. On a failed save, the target has the Charmed condition for the duration. While Charmed in this way, the target also has the Incapacitated condition and is unaware of its surroundings, though it can hear you. If it takes any damage or is targeted by another spell, this spell ends, and no memories are modified.\n\nWhile this charm lasts, you can affect the target’s memory of an event that it experienced within the last 24 hours and that lasted no more than 10 minutes. You can permanently eliminate all memory of the event, allow the target to recall the event with perfect clarity, change its memory of the event’s details, or create a memory of some other event.\n\nYou must speak to the target to describe how its memories are affected, and it must be able to understand your language for the modified memories to take root. Its mind fills in any gaps in the details of your description. If the spell ends before you finish describing the modified memories, the creature’s memory isn’t altered. Otherwise, the modified memories take hold when the spell ends.\n\nA modified memory doesn’t necessarily affect how a creature behaves, particularly if the memory contradicts the creature’s natural inclinations, alignment, or beliefs. An illogical modified memory, such as a false memory of how much the creature enjoyed swimming in acid, is dismissed as a bad dream. The GM might deem a modified memory too nonsensical to affect a creature.\n\nA *Remove Curse* or *Greater Restoration* spell cast on the target restores the creature’s true memory.","higher":"You can alter the target’s memories of an event that took place up to 7 days ago (level 6 spell slot), 30 days ago (level 7 spell slot), 365 days ago (level 8 spell slot), or any time in the creature’s past (level 9 spell slot).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"passwall","name":"Passwall","level":5,"school":"Transmutation","classes":["Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a pinch of sesame seeds","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"A passage appears at a point that you can see on a wooden, plaster, or stone surface (such as a wall, ceiling, or floor) within range and lasts for the duration. You choose the opening’s dimensions: up to 5 feet wide, 8 feet tall, and 20 feet deep. The passage creates no instability in a structure surrounding it.\n\nWhen the opening disappears, any creatures or objects still in the passage created by the spell are safely ejected to an unoccupied space nearest to the surface on which you cast the spell.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"planar-binding","name":"Planar Binding","level":5,"school":"Abjuration","classes":["Bard","Cleric","Druid","Warlock","Wizard"],"time":"1 hour","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a jewel worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"24 hours","conc":false,"desc":"You attempt to bind a Celestial, an Elemental, a Fey, or a Fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of the inverted version of the *Magic Circle* spell to trap it while this spell is cast.) At the completion of the casting, the target must succeed on a Charisma saving throw or be bound to serve you for the duration. If the creature was summoned or created by another spell, that spell’s duration is extended to match the duration of this spell.\n\nA bound creature must follow your commands to the best of its ability. You might command the creature to accompany you on an adventure, to guard a location, or to deliver a message. If the creature is Hostile, it strives to twist your commands to achieve its own objectives. If the creature carries out your commands completely before the spell ends, it travels to you to report this fact if you are on the same plane of existence. If you are on a different plane, it returns to the place where you bound it and remains there until the spell ends.","higher":"The duration increases with a spell slot of level 6 (10 days), 7 (30 days), 8 (180 days), and 9 (366 days).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"raise-dead","name":"Raise Dead","level":5,"school":"Necromancy","classes":["Bard","Cleric","Paladin"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a diamond worth 500+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"With a touch, you revive a dead creature if it has been dead no longer than 10 days and it wasn’t Undead when it died.\n\nThe creature returns to life with 1 Hit Point. This spell also neutralizes any poisons that affected the creature at the time of death.\n\nThis spell closes all mortal wounds, but it doesn’t restore missing body parts. If the creature is lacking body parts or organs integral for its survival—its head, for instance—the spell automatically fails.\n\nComing back from the dead is an ordeal. The target takes a −4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"reincarnate","name":"Reincarnate","level":5,"school":"Necromancy","classes":["Druid"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"rare oils worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You touch a dead Humanoid or a piece of one. If the creature has been dead no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d10 and consult the table below to determine the body’s species, or the GM chooses another playable species.\n\n| 1d10 | Species | 1d10 | Species |\n| --- | --- | --- | --- |\n| 1 | Roll again. | 6 | Goliath |\n| 2 | Dragonborn | 7 | Halfling |\n| 3 | Dwarf | 8 | Human |\n| 4 | Elf | 9 | Orc |\n| 5 | Gnome | 10 | Tiefling |\n\nThe reincarnated creature makes any choices that a species’ description offers, and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"scrying","name":"Scrying","level":5,"school":"Divination","classes":["Bard","Cleric","Druid","Warlock","Wizard"],"time":"10 minutes","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a focus worth 1,000+ GP, such as a crystal ball, mirror, or water-filled font","costly":true,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You can see and hear a creature you choose that is on the same plane of existence as you. The target makes a Wisdom saving throw, which is modified (see the tables below) by how well you know the target and the sort of physical connection you have to it. The target doesn’t know what it is making the save against, only that it feels uneasy.\n\n| Your Knowledge of the Target Is … | Save Modifier |\n| --- | --- |\n| Secondhand (heard of the target) | +5 |\n| Firsthand (met the target) | +0 |\n| Extensive (know the target well) | −5 |\n\n| You Have the Target’s … | Save Modifier |\n| --- | --- |\n| Picture or other likeness | −2 |\n| Garment or other possession | −4 |\n| Body part, lock of hair, or bit of nail | −10 |\n\nOn a successful save, the target isn’t affected, and you can’t use this spell on it again for 24 hours.\n\nOn a failed save, the spell creates an Invisible, intangible sensor within 10 feet of the target. You can see and hear through the sensor as if you were there. The sensor moves with the target, remaining within 10 feet of it for the duration. If something can see the sensor, it appears as a luminous orb about the size of your fist.\n\nInstead of targeting a creature, you can target a location you have seen. When you do so, the sensor appears at that location and doesn’t move.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"seeming","name":"Seeming","level":5,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You give an illusory appearance to each creature of your choice that you can see within range. An unwilling target can make a Charisma saving throw, and if it succeeds, it is unaffected by this spell.\n\nYou can give the same appearance or different ones to the targets. The spell can change the appearance of the targets’ bodies and equipment. You can make each creature seem 1 foot shorter or taller and appear heavier or lighter. A target’s new appearance must have the same basic arrangement of limbs as the target, but the extent of the illusion is otherwise up to you. The spell lasts for the duration.\n\nThe changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to a creature’s outfit, objects pass through the hat.\n\nA creature that takes the Study action to examine a target can make an Intelligence (Investigation) check against your spell save DC. If it succeeds, it becomes aware that the target is disguised.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"summon-dragon","name":"Summon Dragon","level":5,"school":"Conjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"an object with the image of a dragon engraved on it worth 500+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You call forth a Dragon spirit. It manifests in an unoccupied space that you can see within range and uses the **Draconic Spirit** stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends.\n\nThe creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don’t issue any, it takes the Dodge action and uses its movement to avoid danger.","higher":"Use the spell slot’s level for the spell’s level in the stat block.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"telekinesis","name":"Telekinesis","level":5,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell and as a Magic action on your later turns before the spell ends, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell.\n\n***Creature.*** You can try to move a Huge or smaller creature. The target must succeed on a Strength saving throw, or you move it up to 30 feet in any direction within the spell’s range. Until the end of your next turn, the creature has the Restrained condition, and if you lift it into the air, it is suspended there. It falls at the end of your next turn unless you use this option on it again and it fails the save.\n\n***Object.*** You can try to move a Huge or smaller object. If the object isn’t being worn or carried, you automatically move it up to 30 feet in any direction within the spell’s range.\n\nIf the object is worn or carried by a creature, that creature must succeed on a Strength saving throw, or you pull the object away and move it up to 30 feet in any direction within the spell’s range.\n\nYou can exert fine control on objects with your telekinetic grip, such as manipulating a simple tool,","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"telepathic-bond","name":"Telepathic Bond","level":5,"school":"Divination","classes":["Bard","Wizard"],"time":"Action or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"two eggs","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures that can’t communicate in any languages aren’t affected by this spell.\n\nUntil the spell ends, the targets can communicate telepathically through the bond whether or not they share a language. The communication is possible over any distance, though it can’t extend to other planes of existence.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"teleportation-circle","name":"Teleportation Circle","level":5,"school":"Conjuration","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"1 minute","ritual":false,"range":"10 feet","v":true,"s":false,"m":true,"mat":"rare inks worth 50+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"1 round","conc":false,"desc":"As you cast the spell, you draw a 5-foot-radius circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied.\n\nMany major temples, guildhalls, and other important places have permanent teleportation circles. Each circle includes a unique sigil sequence—a string of runes arranged in a particular pattern.\n\nWhen you first gain the ability to cast this spell, you learn the sigil sequences for two destinations on the Material Plane, determined by the GM. You might learn additional sigil sequences during your adventures. You can commit a new sigil sequence to memory after studying it for 1 minute.\n\nYou can create a permanent teleportation circle by casting this spell in the same location every day for 365 days.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"tree-stride","name":"Tree Stride","level":5,"school":"Conjuration","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You gain the ability to enter a tree and move from inside it to inside another tree of the same kind within 500 feet. Both trees must be living and at least the same size as you. You must use 5 feet of movement to enter a tree. You instantly know the location of all other trees of the same kind within 500 feet and, as part of the move used to enter the tree, can either pass into one of those trees or step out of the tree you’re in. You appear in a spot of your choice within 5 feet of the destination tree, using another 5 feet of movement. If you have no movement left, you appear within 5 feet of the tree you entered.\n\nYou can use this transportation ability only once on each of your turns. You must end each turn outside a tree.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"wall-of-force","name":"Wall of Force","level":5,"school":"Evocation","classes":["Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a shard of glass","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"An Invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick and lasts for the duration. If the wall cuts through a creature’s space when it appears, the creature is pushed to one side of the wall (you choose which side).\n\nNothing can physically pass through the wall. It is immune to all damage and can’t be dispelled by *Dispel Magic.* A *Disintegrate* spell destroys the wall instantly, however. The wall also extends into the Ethereal Plane and blocks ethereal travel through the wall.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"wall-of-stone","name":"Wall of Stone","level":5,"school":"Evocation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a cube of granite","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. Alternatively, you can create 10-foot-by-20-foot panels that are only 3 inches thick.\n\nIf the wall cuts through a creature’s space when it appears, the creature is pushed to one side of the wall (you choose which side). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a Dexterity saving throw. On a success, it can use its Reaction to move up to its Speed so that it is no longer enclosed by the wall.\n\nThe wall can have any shape you desire, though it can’t occupy the same space as a creature or object. The wall doesn’t need to be vertical or rest on a firm foundation. It must, however, merge with and be solidly supported by existing stone. Thus, you can use this spell to bridge a chasm or create a ramp.\n\nIf you create a span greater than 20 feet in length, you must halve the size of each panel to create supports. You can crudely shape the wall to create battlements and the like.\n\nThe wall is an object made of stone that can be damaged and thus breached. Each panel has AC 15 and 30 Hit Points per inch of thickness, and it has Immunity to Poison and Psychic damage. Reducing a panel to 0 Hit Points destroys it and might cause connected panels to collapse at the GM’s discretion.\n\nIf you maintain your Concentration on this spell for its full duration, the wall becomes permanent and can’t be dispelled. Otherwise, the wall disappears when the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"blade-barrier","name":"Blade Barrier","level":6,"school":"Evocation","classes":["Cleric"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create a wall of whirling blades made of magical energy. The wall appears within range and lasts for the duration. You make a straight wall up to 100 feet long, 20 feet high, and 5 feet thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 5 feet thick. The wall provides Three-Quarters Cover, and its space is Difficult Terrain.\n\nAny creature in the wall’s space makes a Dexterity saving throw, taking 6d10 Force damage on a failed save or half as much damage on a successful one. A creature also makes that save if it enters the wall’s space or ends it turn there. A creature makes that save only once per turn.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"chain-lightning","name":"Chain Lightning","level":6,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"three silver pins","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You launch a lightning bolt toward a target you can see within range. Three bolts then leap from that target to as many as three other targets of your choice, each of which must be within 30 feet of the first target. A target can be a creature or an object and can be targeted by only one of the bolts.\n\nEach target makes a Dexterity saving throw, taking 10d8 Lightning damage on a failed save or half as much damage on a successful one.","higher":"One additional bolt leaps from the first target to another target for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"circle-of-death","name":"Circle of Death","level":6,"school":"Necromancy","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"the powder of a crushed black pearl worth 500+ GP","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Negative energy ripples out in a 60-foot-radius Sphere from a point you choose within range. Each creature in that area makes a Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one.","higher":"The damage increases by 2d8 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"conjure-fey","name":"Conjure Fey","level":6,"school":"Conjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You conjure a Medium spirit from the Feywild in an unoccupied space you can see within range. The spirit lasts for the duration, and it looks like a Fey creature of your choice. When the spirit appears, you can make one melee spell attack against a creature within 5 feet of it. On a hit, the target takes Psychic damage equal to 3d12 plus your spellcasting ability modifier, and the target has the Frightened condition until the start of your next turn, with both you and the spirit as the source of the fear.\n\nAs a Bonus Action on your later turns, you can teleport the spirit to an unoccupied space you can see within 30 feet of the space it left and make the attack against a creature within 5 feet of it.","higher":"The damage increases by 1d12 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"contingency","name":"Contingency","level":6,"school":"Abjuration","classes":["Wizard"],"time":"10 minutes","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a gem-encrusted statuette of yourself worth 1,500+ GP","costly":true,"consumed":false,"duration":"10 days","conc":false,"desc":"Choose a spell of level 5 or lower that you can cast, that has a casting time of an action, and that can target you. You cast that spell—called the contingent spell—as part of casting *Contingency*, expending spell slots for both, but the contingent spell doesn’t come into effect. Instead, it takes effect when a certain trigger occurs. You describe that trigger when you cast the two spells. For example, a *Contingency* cast with *Water Breathing* might stipulate that *Water Breathing* comes into effect when you are engulfed in water or a similar liquid.\n\nThe contingent spell takes effect immediately after the trigger occurs for the first time, whether or not you want it to, and then *Contingency* ends.\n\nThe contingent spell takes effect only on you, even if it can normally target others. You can use only one *Contingency* spell at a time. If you cast this spell again, the effect of another *Contingency* spell on you ends. Also, *Contingency* ends on you if its material component is ever not on your person.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"create-undead","name":"Create Undead","level":6,"school":"Necromancy","classes":["Cleric","Warlock","Wizard"],"time":"1 minute","ritual":false,"range":"10 feet","v":true,"s":true,"m":true,"mat":"one 150+ GP black onyx stone for each corpse","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You can cast this spell only at night. Choose up to three corpses of Medium or Small Humanoids within range. Each one becomes a **Ghoul** under your control (see “Monsters” for its stat block).\n\nAs a Bonus Action on each of your turns, you can mentally command any creature you animated with this spell if the creature is within 120 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to them). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a particular place. If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. Once given an order, the creature continues to follow the order until its task is complete.\n\nThe creature is under your control for 24 hours, after which it stops obeying any command you’ve given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature before the current 24-hour period ends. This use of the spell reasserts your control over up to three creatures you have animated with this spell rather than animating new ones.","higher":"If you use a level 7 spell slot, you can animate or reassert control over four **Ghouls**. If you use a level 8 spell slot, you can animate or reassert control over five **Ghouls** or two **Ghasts** or **Wights**. If you use a level 9 spell slot, you can animate or reassert control over six **Ghouls**, three **Ghasts** or **Wights**, or two **Mummies**. See “Monsters” for these stat blocks.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"disintegrate","name":"Disintegrate","level":6,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a lodestone and dust","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You launch a green ray at a target you can see within range. The target can be a creature, a nonmagical object, or a creation of magical force, such as the wall created by *Wall of Force.*\n\nA creature targeted by this spell makes a Dexterity saving throw. On a failed save, the target takes 10d6 + 40 Force damage. If this damage reduces it to 0 Hit Points, it and everything nonmagical it is wearing and carrying are disintegrated into gray dust. The target can be revived only by a *True Resurrection* or a *Wish* spell.\n\nThis spell automatically disintegrates a Large or smaller nonmagical object or a creation of magical force. If such a target is Huge or larger, this spell disintegrates a 10-foot-Cube portion of it.","higher":"The damage increases by 3d6 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"eyebite","name":"Eyebite","level":6,"school":"Necromancy","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"For the duration, your eyes become an inky void. One creature of your choice within 60 feet of you that you can see must succeed on a Wisdom saving throw or be affected by one of the following effects of your choice for the duration.\n\nOn each of your turns until the spell ends, you can take a Magic action to target another creature but can’t target a creature again if it has succeeded on a save against this casting of the spell.\n\n***Asleep.*** The target has the Unconscious condition. It wakes up if it takes any damage or if another creature takes an action to shake it awake.\n\n***Panicked.*** The target has the Frightened condition. On each of its turns, the Frightened target must take the Dash action and move away from you by the safest and shortest route available. If the target moves to a space at least 60 feet away from you where it can’t see you, this effect ends.\n\n***Sickened.*** The target has the Poisoned condition.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"find-the-path","name":"Find the Path","level":6,"school":"Divination","classes":["Bard","Cleric","Druid"],"time":"1 minute","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a set of divination tools—such as cards or runes—worth 100+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 day","conc":true,"desc":"You magically sense the most direct physical route to a location you name. You must be familiar with the location, and the spell fails if you name a destination on another plane of existence, a moving destination (such as a mobile fortress), or an unspecific destination (such as “a green dragon’s lair”).\n\nFor the duration, as long as you are on the same plane of existence as the destination, you know how far it is and in what direction it lies. Whenever you","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"flesh-to-stone","name":"Flesh to Stone","level":6,"school":"Transmutation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a cockatrice feather","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You attempt to turn one creature that you can see within range into stone. The target makes a Constitution saving throw. On a failed save, it has the Restrained condition for the duration. On a successful save, its Speed is 0 until the start of your next turn. Constructs automatically succeed on the save.\n\nA Restrained target makes another Constitution saving throw at the end of each of its turns. If it successfully saves against this spell three times, the spell ends. If it fails its saves three times, it is turned to stone and has the Petrified condition for the duration. The successes and failures needn’t be consecutive; keep track of both until the target collects three of a kind.\n\nIf you maintain your Concentration on this spell for the entire possible duration, the target is Petrified until the condition is ended by *Greater Restoration* or similar magic.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"forbiddance","name":"Forbiddance","level":6,"school":"Abjuration","classes":["Cleric"],"time":"10 minutes or Ritual","ritual":true,"range":"Touch","v":true,"s":true,"m":true,"mat":"ruby dust worth 1,000+ GP","costly":true,"consumed":false,"duration":"1 day","conc":false,"desc":"You create a ward against magical travel that protects up to 40,000 square feet of floor space to a height of 30 feet above the floor. For the duration, creatures can’t teleport into the area or use portals, such as those created by the *Gate* spell, to enter the area. The spell proofs the area against planar travel, and therefore prevents creatures from accessing the area by way of the Astral Plane, the Ethereal Plane, the Feywild, the Shadowfell, or the *Plane Shift* spell.\n\nIn addition, the spell damages types of creatures that you choose when you cast it. Choose one or more of the following: Aberrations, Celestials, Elementals, Fey, Fiends, and Undead. When a creature of a chosen type enters the spell’s area for the first time on a turn or ends its turn there, the creature takes 5d10 Radiant or Necrotic damage (your choice when you cast this spell).\n\nYou can designate a password when you cast the spell. A creature that speaks the password as it enters the area takes no damage from the spell.\n\nThe spell’s area can’t overlap with the area of another *Forbiddance* spell. If you cast *Forbiddance* every day for 30 days in the same location, the spell lasts until it is dispelled, and the Material components are consumed on the last casting.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"freezing-sphere","name":"Freezing Sphere","level":6,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"300 feet","v":true,"s":true,"m":true,"mat":"a miniature crystal sphere","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A frigid globe streaks from you to a point of your choice within range, where it explodes in a 60-foot-radius Sphere. Each creature in that area makes a Constitution saving throw, taking 10d6 Cold damage on failed save or half as much damage on a successful one.\n\nIf the globe strikes a body of water, it freezes the water to a depth of 6 inches over an area 30 feet square. This ice lasts for 1 minute. Creatures that were swimming on the surface of frozen water are trapped in the ice and have the Restrained condition. A trapped creature can take an action to make a Strength (Athletics) check against your spell save DC to break free.\n\nYou can refrain from firing the globe after completing the spell’s casting. If you do so, a globe about the size of a sling bullet, cool to the touch, appears in your hand. At any time, you or a creature you give the globe to can throw the globe (to a range of 40 feet) or hurl it with a sling (to the sling’s normal range). It shatters on impact, with the same effect as a normal casting of the spell. You can also set the globe down without shattering it. After 1 minute, if the globe hasn’t already shattered, it explodes.","higher":"The damage increases by 1d6 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"globe-of-invulnerability","name":"Globe of Invulnerability","level":6,"school":"Abjuration","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a glass bead","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"An immobile, shimmering barrier appears in a 10-foot Emanation around you and remains for the duration.\n\nAny spell of level 5 or lower cast from outside the barrier can’t affect anything within it. Such a spell can target creatures and objects within the barrier, but the spell has no effect on them. Similarly, the area within the barrier is excluded from areas of effect created by such spells.","higher":"The barrier blocks spells of 1 level higher for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"guards-and-wards","name":"Guards and Wards","level":6,"school":"Abjuration","classes":["Bard","Wizard"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a silver rod worth 10+ GP","costly":true,"consumed":false,"duration":"24 hours","conc":false,"desc":"You create a ward that protects up to 2,500 square feet of floor space. The warded area can be up to 20 feet tall, and you shape it as one 50-foot square, one hundred 5-foot squares that are contiguous, or twenty-five 10-foot squares that are contiguous.\n\nWhen you cast this spell, you can specify individuals that are unaffected by the spell’s effects. You can also specify a password that, when spoken aloud within 5 feet of the warded area, makes the speaker immune to its effects.\n\nThe spell creates the effects below within the warded area. *Dispel Magic* has no effect on *Guards and Wards* itself, but each of the following effects can be dispelled. If all four are dispelled, *Guards and Wards* ends. If you cast the spell every day for 365 days on the same area, the spell thereafter lasts until all its effects are dispelled.\n\n***Corridors.*** Fog fills all the warded corridors, making them Heavily Obscured. In addition, at each intersection or branching passage offering a choice of direction, there is a 50 percent chance that a creature other than you believes it is going in the opposite direction from the one it chooses.\n\n***Doors.*** All doors in the warded area are magically locked, as if sealed by the *Arcane Lock* spell. In addition, you can cover up to ten doors with an illusion to make them appear as plain sections of wall.\n\n***Stairs.*** Webs fill all stairs in the warded area from top to bottom, as in the *Web* spell. These strands regrow in 10 minutes if they are destroyed while *Guards and Wards* lasts.\n\n***Other Spell Effect.*** Place one of the following magical effects within the warded area:\n\n- *Dancing Lights* in four corridors, with a simple program that the lights repeat as long as *Guards and Wards* lasts\n- *Magic Mouth* in two locations\n- *Stinking Cloud* in two locations (the vapors return within 10 minutes if dispersed while *Guards and Wards* lasts)\n- *Gust of Wind* in one corridor or room (the wind blows continuously while the spell lasts)\n- *Suggestion* in one 5-foot square; any creature that enters that square receives the suggestion mentally","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"harm","name":"Harm","level":6,"school":"Necromancy","classes":["Cleric"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You unleash virulent magic on a creature you can see within range. The target makes a Constitution saving throw. On a failed save, it takes 14d6 Necrotic damage, and its Hit Point maximum is reduced by an amount equal to the Necrotic damage it took. On a successful save, it takes half as much damage only. This spell can’t reduce a target’s Hit Point maximum below 1.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"heal","name":"Heal","level":6,"school":"Abjuration","classes":["Cleric","Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Choose a creature that you can see within range. Positive energy washes through the target, restoring 70 Hit Points. This spell also ends the Blinded, Deafened, and Poisoned conditions on the target.","higher":"The healing increases by 10 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"heroes-feast","name":"Heroes’ Feast","level":6,"school":"Conjuration","classes":["Bard","Cleric","Druid"],"time":"10 minutes","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a gem-encrusted bowl worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You conjure a feast that appears on a surface in an unoccupied 10-foot Cube next to you. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don’t set in until this hour is over. Up to twelve creatures can partake of the feast.\n\nA creature that partakes gains several benefits, which last for 24 hours. The creature has Resistance to Poison damage, and it has Immunity to the Frightened and Poisoned conditions. Its Hit Point maximum also increases by 2d10, and it gains the same number of Hit Points.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"instant-summons","name":"Instant Summons","level":6,"school":"Conjuration","classes":["Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"Touch","v":true,"s":true,"m":true,"mat":"a sapphire worth 1,000+ GP","costly":true,"consumed":false,"duration":"Until dispelled","conc":false,"desc":"You touch the sapphire used in the casting and an object weighing 10 pounds or less whose longest dimension is 6 feet or less. The spell leaves an Invisible mark on that object and invisibly inscribes the object’s name on the sapphire. Each time you cast this spell, you must use a different sapphire.\n\nThereafter, you can take a Magic action to speak the object’s name and crush the sapphire. The object instantly appears in your hand regardless of physical or planar distances, and the spell ends.\n\nIf another creature is holding or carrying the object, crushing the sapphire doesn’t transport it, but instead you learn who that creature is and where that creature is currently located.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"irresistible-dance","name":"Irresistible Dance","level":6,"school":"Enchantment","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"One creature that you can see within range must make a Wisdom saving throw. On a successful save, the target dances comically until the end of its next turn, during which it must spend all its movement to dance in place.\n\nOn a failed save, the target has the Charmed condition for the duration. While Charmed, the target dances comically, must use all its movement to dance in place, and has Disadvantage on Dexterity saving throws and attack rolls, and other creatures have Advantage on attack rolls against it. On each of its turns, the target can take an action to collect itself and repeat the save, ending the spell on itself on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"magic-jar","name":"Magic Jar","level":6,"school":"Necromancy","classes":["Wizard"],"time":"1 minute","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a gem, crystal, or reliquary worth 500+ GP","costly":true,"consumed":false,"duration":"Until dispelled","conc":false,"desc":"Your body falls into a catatonic state as your soul leaves it and enters the container you used for the spell’s Material component. While your soul inhabits the container, you are aware of your surroundings as if you were in the container’s space. You can’t move or take Reactions. The only action you can take is to project your soul up to 100 feet out of the container, either returning to your living body (and ending the spell) or attempting to possess a Humanoid’s body.\n\nYou can attempt to possess any Humanoid within 100 feet of you that you can see (creatures warded by a *Protection from Evil and Good* or *Magic Circle* spell can’t be possessed). The target makes a Charisma saving throw. On a failed save, your soul enters the target’s body, and the target’s soul becomes trapped in the container. On a successful save, the target resists your efforts to possess it, and you can’t attempt to possess it again for 24 hours.\n\nOnce you possess a creature’s body, you control it. Your Hit Points, Hit Point Dice, Strength, Dexterity, Constitution, Speed, and senses are replaced by the creature’s. You otherwise keep your game statistics.\n\nMeanwhile, the possessed creature’s soul can perceive from the container using its own senses, but it can’t move and it is Incapacitated.\n\nWhile possessing a body, you can take a Magic action to return from the host body to the container if it is within 100 feet of you, returning the host creature’s soul to its body. If the host body dies while you’re in it, the creature dies, and you make a Charisma saving throw against your own spellcasting DC. On a success, you return to the container if it is within 100 feet of you. Otherwise, you die.\n\nIf the container is destroyed or the spell ends, your soul returns to your body. If your body is more than 100 feet away from you or if your body is dead, you die. If another creature’s soul is in the container when it is destroyed, the creature’s soul returns to its body if the body is alive and within 100 feet. Otherwise, that creature dies.\n\nWhen the spell ends, the container is destroyed.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mass-suggestion","name":"Mass Suggestion","level":6,"school":"Enchantment","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":true,"mat":"a snake’s tongue","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"You suggest a course of activity—described in no more than 25 words—to twelve or fewer creatures you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to any of the targets or their allies. For example, you could say, “Walk to the village down that road, and help the villagers there harvest crops until sunset.” Or you could say, “Now is not the time for violence. Drop your weapons, and dance! Stop in an hour.”\n\nEach target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. Each Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for a target upon completing it.","higher":"The duration is longer with a spell slot of level 7 (10 days), 8 (30 days), or 9 (366 days).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"move-earth","name":"Move Earth","level":6,"school":"Transmutation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a miniature shovel","costly":false,"consumed":false,"duration":"Concentration, up to 2 hours","conc":true,"desc":"Choose an area of terrain no larger than 40 feet on a side within range. You can reshape dirt, sand, or clay in the area in any manner you choose for the duration. You can raise or lower the area’s elevation, create or fill in a trench, erect or flatten a wall, or form a pillar. The extent of any such changes can’t exceed half the area’s largest dimension. For example, if you affect a 40-foot square, you can create a pillar up to 20 feet high, raise or lower the square’s elevation by up to 20 feet, dig a trench up to 20 feet deep, and so on. It takes 10 minutes for these changes to complete. Because the terrain’s transformation occurs slowly, creatures in the area can’t usually be trapped or injured by the ground’s movement.\n\nAt the end of every 10 minutes you spend concentrating on the spell, you can choose a new area of terrain to affect within range.\n\nThis spell can’t manipulate natural stone or stone construction. Rocks and structures shift to accommodate the new terrain. If the way you shape the terrain would make a structure unstable, it might collapse.\n\nSimilarly, this spell doesn’t directly affect plant growth. The moved earth carries any plants along with it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"planar-ally","name":"Planar Ally","level":6,"school":"Conjuration","classes":["Cleric"],"time":"10 minutes","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You beseech an otherworldly entity for aid. The being must be known to you: a god, a demon prince, or some other being of cosmic power. That entity sends a Celestial, an Elemental, or a Fiend loyal to it to aid you, making the creature appear in an unoccupied space within range. If you know a specific creature’s name, you can speak that name when you cast this spell to request that creature, though you might get a different creature anyway (GM’s choice).\n\nWhen the creature appears, it is under no compulsion to behave a particular way. You can ask it to perform a service in exchange for payment, but it isn’t obliged to do so. The requested task could range from simple (fly us across the chasm, or help us fight a battle) to complex (spy on our enemies, or protect us during our foray into the dungeon). You must be able to communicate with the creature to bargain for its services.\n\nPayment can take a variety of forms. A Celestial might require a sizable donation of gold or magic items to an allied temple, while a Fiend might demand a living sacrifice or a gift of treasure. Some creatures might exchange their service for a quest undertaken by you.\n\nA task that can be measured in minutes requires a payment worth 100 GP per minute. A task measured in hours requires 1,000 GP per hour. And a task measured in days (up to 10 days) requires 10,000 GP per day. The GM can adjust these payments based on the circumstances under which you cast the spell. If the task is aligned with the creature’s ethos, the payment might be halved or even waived. Nonhazardous tasks typically require only half the suggested payment, while especially dangerous tasks might require a greater gift. Creatures rarely accept tasks that seem suicidal.\n\nAfter the creature completes the task, or when the agreed-upon duration of service expires, the creature returns to its home plane after reporting back to you if possible. If you are unable to agree on a price for the creature’s service, the creature immediately returns to its home plane.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"programmed-illusion","name":"Programmed Illusion","level":6,"school":"Illusion","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"jade dust worth 25+ GP","costly":true,"consumed":false,"duration":"Until dispelled","conc":false,"desc":"You create an illusion of an object, a creature, or some other visible phenomenon within range that activates when a specific trigger occurs. The illusion is imperceptible until then. It must be no larger than a 30-foot Cube, and you decide when you cast the spell how the illusion behaves and what sounds it makes. This scripted performance can last up to 5 minutes.\n\nWhen the trigger you specify occurs, the illusion springs into existence and performs in the manner you described. Once the illusion finishes performing, it disappears and remains dormant for 10 minutes, after which the illusion can be activated again.\n\nThe trigger can be as general or as detailed as you like, though it must be based on visual or audible phenomena that occur within 30 feet of the area. For example, you could create an illusion of yourself to appear and warn off others who attempt to open a trapped door.\n\nPhysical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sunbeam","name":"Sunbeam","level":6,"school":"Evocation","classes":["Cleric","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a magnifying glass","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You launch a sunbeam in a 5-foot-wide, 60-foot-long Line. Each creature in the Line makes a Constitution saving throw. On a failed save, a creature takes 6d8 Radiant damage and has the Blinded condition until the start of your next turn. On a successful save, it takes half as much damage only.\n\nUntil the spell ends, you can take a Magic action to create a new Line of radiance.\n\nFor the duration, a mote of brilliant radiance shines above you. It sheds Bright Light in a 30-foot radius and Dim Light for an additional 30 feet. This light is sunlight.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"transport-via-plants","name":"Transport via Plants","level":6,"school":"Conjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"10 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"This spell creates a magical link between a Large or larger inanimate plant within range and another plant, at any distance, on the same plane of existence. You must have seen or touched the destination plant at least once before. For the duration, any creature can step into the target plant and exit from the destination plant by using 5 feet of movement.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"true-seeing","name":"True Seeing","level":6,"school":"Divination","classes":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"mushroom powder worth 25+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"1 hour","conc":false,"desc":"For the duration, the willing creature you touch has Truesight with a range of 120 feet.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"wall-of-ice","name":"Wall of Ice","level":6,"school":"Evocation","classes":["Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a piece of quartz","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create a wall of ice on a solid surface within range. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-square panels. Each panel must be contiguous with another panel. In any form, the wall is 1 foot thick and lasts for the duration.\n\nIf the wall cuts through a creature’s space when it appears, the creature is pushed to one side of the wall (you choose which side) and makes a Dexterity saving throw, taking 10d6 Cold damage on a failed save or half as much damage on a successful one.\n\nThe wall is an object that can be damaged and thus breached. It has AC 12 and 30 Hit Points per 10-foot section, and it has Immunity to Cold, Poison, and Psychic damage and Vulnerability to Fire damage. Reducing a 10-foot section of wall to 0 Hit Points destroys it and leaves behind a sheet of frigid air in the space the wall occupied.\n\nA creature moving through the sheet of frigid air for the first time on a turn makes a Constitution saving throw, taking 5d6 Cold damage on a failed save or half as much damage on a successful one.","higher":"The damage the wall deals when it appears increases by 2d6 and the damage from passing through the sheet of frigid air increases by 1d6 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"wall-of-thorns","name":"Wall of Thorns","level":6,"school":"Conjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a handful of thorns","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create a wall of tangled brush bristling with needle-sharp thorns. The wall appears within range on a solid surface and lasts for the duration. You choose to make the wall up to 60 feet long, 10 feet high, and 5 feet thick or a circle that has a 20-foot diameter and is up to 20 feet high and 5 feet thick. The wall blocks line of sight.\n\nWhen the wall appears, each creature in its area makes a Dexterity saving throw, taking 7d8 Piercing damage on a failed save or half as much damage on a successful one.\n\nA creature can move through the wall, albeit slowly and painfully. For every 1 foot a creature moves through the wall, it must spend 4 feet of movement. Furthermore, the first time a creature enters a space in the wall on a turn or ends its turn there, the creature makes a Dexterity saving throw, taking 7d8 Slashing damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.","higher":"Both types of damage increase by 1d8 for each spell slot level above 6.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"wind-walk","name":"Wind Walk","level":6,"school":"Transmutation","classes":["Druid"],"time":"1 minute","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a candle","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You and up to ten willing creatures of your choice within range assume gaseous forms for the duration, appearing as wisps of cloud. While in this cloud form, a target has a Fly Speed of 300 feet and can hover; it has Immunity to the Prone condition; and it has Resistance to Bludgeoning, Piercing, and Slashing damage. The only actions a target can take in this form are the Dash action or a Magic action to begin reverting to its normal form. Reverting takes 1 minute, during which the target has the Stunned condition. Until the spell ends, the target can revert to cloud form, which also requires a Magic action followed by a 1-minute transformation.\n\nIf a target is in cloud form and flying when the effect ends, the target descends 60 feet per round for 1 minute until it lands, which it does safely. If it can’t land after 1 minute, it falls the remaining distance.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"word-of-recall","name":"Word of Recall","level":6,"school":"Conjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"5 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect.\n\nYou must designate a location, such as a temple, as a sanctuary by casting this spell there.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"arcane-sword","name":"Arcane Sword","level":7,"school":"Evocation","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"a miniature sword worth 250+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a spectral sword that hovers within range. It lasts for the duration.\n\nWhen the sword appears, you make a melee spell attack against a target within 5 feet of the sword. On a hit, the target takes Force damage equal to 4d12 plus your spellcasting ability modifier.\n\nOn your later turns, you can take a Bonus Action to move the sword up to 30 feet to a spot you can see and repeat the attack against the same target or a different one.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"conjure-celestial","name":"Conjure Celestial","level":7,"school":"Conjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You conjure a spirit from the Upper Planes, which manifests as a pillar of light in a 10-foot-radius, 40-foot-high Cylinder centered on a point within range. For each creature you can see in the Cylinder, choose which of these lights shines on it:\n\n**Healing Light.** The target regains Hit Points equal to 4d12 plus your spellcasting ability modifier.\n\n**Searing Light.** The target makes a Dexterity saving throw, taking 6d12 Radiant damage on a failed save or half as much damage on a successful one.\n\nUntil the spell ends, Bright Light fills the Cylinder, and when you move on your turn, you can also move the Cylinder up to 30 feet.\n\nWhenever the Cylinder moves into the space of a creature you can see and whenever a creature you can see enters the Cylinder or ends its turn there, you can bathe it in one of the lights. A creature can be affected by this spell only once per turn.","higher":"The healing and damage increase by 1d12 for each spell slot level above 7.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"delayed-blast-fireball","name":"Delayed Blast Fireball","level":7,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"a ball of bat guano and sulfur","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A beam of yellow light flashes from you, then condenses at a chosen point within range as a glowing bead for the duration. When the spell ends, the bead explodes, and each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw. A creature takes Fire damage equal to the total accumulated damage on a failed save or half as much damage on a successful one.\n\nThe spell’s base damage is 12d6, and the damage increases by 1d6 whenever your turn ends and the spell hasn’t ended.\n\nIf a creature touches the glowing bead before the spell ends, that creature makes a Dexterity saving throw. On a failed save, the spell end
