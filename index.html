ing damage from a creature that you can see within 60 feet of yourself","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"The creature that damaged you is momentarily surrounded by green flames. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failed save or half as much damage on a successful one.","higher":"The damage increases by 1d10 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"heroism","name":"Heroism","level":1,"school":"Enchantment","classes":["Bard","Paladin"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to the Frightened condition and gains Temporary Hit Points equal to your spellcasting ability modifier at the start of each of its turns.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"hex","name":"Hex","level":1,"school":"Enchantment","classes":["Warlock"],"time":"Bonus Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"the petrified eye of a newt","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has Disadvantage on ability checks made with the chosen ability.\n\nIf the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action on a later turn to curse a new creature.","higher":"Your Concentration can last longer with a spell slot of level 2 (up to 4 hours), 3–4 (up to 8 hours), or 5+ (24 hours).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"hideous-laughter","name":"Hideous Laughter","level":1,"school":"Enchantment","classes":["Bard","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a tart and a feather","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"One creature of your choice that you can see within range makes a Wisdom saving throw. On a failed save, it has the Prone and Incapacitated conditions for the duration. During that time, it laughs uncontrollably if it’s capable of laughter, and it can’t end the Prone condition on itself.\n\nAt the end of each of its turns and each time it takes damage, it makes another Wisdom saving throw. The target has Advantage on the save if the save is triggered by damage. On a successful save, the spell ends.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"hunters-mark","name":"Hunter’s Mark","level":1,"school":"Divination","classes":["Ranger"],"time":"Bonus Action","ritual":false,"range":"90 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have Advantage on any Wisdom (Perception or Survival) check you make to find it.\n\nIf the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action to move the mark to a new creature you can see within range.","higher":"Your Concentration can last longer with a spell slot of level 3–4 (up to 8 hours) or 5+ (up to 24 hours).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"ice-knife","name":"Ice Knife","level":1,"school":"Conjuration","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":false,"s":true,"m":true,"mat":"a drop of water or a piece of ice","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 Cold damage.","higher":"The Cold damage increases by 1d6 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"identify","name":"Identify","level":1,"school":"Divination","classes":["Bard","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"Touch","v":true,"s":true,"m":true,"mat":"a pearl worth 100+ GP","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You touch an object throughout the spell’s casting. If the object is a magic item or some other magical object, you learn its properties and how to use them, whether it requires Attunement, and how many charges it has, if any. You learn whether any ongoing spells are affecting the item and what they are. If the item was created by a spell, you learn that spell’s name.\n\nIf you instead touch a creature throughout the casting, you learn which ongoing spells, if any, are currently affecting it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"illusory-script","name":"Illusory Script","level":1,"school":"Illusion","classes":["Bard","Warlock","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"Touch","v":false,"s":true,"m":true,"mat":"ink worth 10+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"10 days","conc":false,"desc":"You write on parchment, paper, or another suitable material and imbue it with an illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, seems to be written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, the illusion can alter the meaning, handwriting, and language of the text, though the language must be one you know.\n\nIf the spell is dispelled, the original script and the illusion both disappear.\n\nA creature that has Truesight can read the hidden message.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"inflict-wounds","name":"Inflict Wounds","level":1,"school":"Necromancy","classes":["Cleric"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A creature you touch makes a Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one.","higher":"The damage increases by 1d10 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"jump","name":"Jump","level":1,"school":"Transmutation","classes":["Druid","Ranger","Sorcerer","Wizard"],"time":"Bonus Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a grasshopper's hind leg","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"longstrider","name":"Longstrider","level":1,"school":"Transmutation","classes":["Bard","Druid","Ranger","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a pinch of dirt","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch a creature. The target’s Speed increases by 10 feet until the spell ends.","higher":"You can target one additional creature for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"mage-armor","name":"Mage Armor","level":1,"school":"Abjuration","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a piece of cured leather","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You touch a willing creature who isn’t wearing armor. Until the spell ends, the target’s base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"magic-missile","name":"Magic Missile","level":1,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.","higher":"The spell creates one more dart for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"protection-from-evil-and-good","name":"Protection from Evil and Good","level":1,"school":"Abjuration","classes":["Cleric","Druid","Paladin","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a flask of Holy Water worth 25+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Concentration up to 10 minutes","conc":true,"desc":"Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can’t be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"purify-food-and-drink","name":"Purify Food and Drink","level":1,"school":"Transmutation","classes":["Cleric","Druid","Paladin"],"time":"Action or Ritual","ritual":true,"range":"10 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You remove poison and rot from nonmagical food and drink in a 5-foot-radius Sphere centered on a point within range.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"ray-of-sickness","name":"Ray of Sickness","level":1,"school":"Necromancy","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the Poisoned condition until the end of your next turn.","higher":"The damage increases by 1d8 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"sanctuary","name":"Sanctuary","level":1,"school":"Abjuration","classes":["Cleric"],"time":"Bonus Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a shard of glass from a mirror","costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn’t protect the warded creature from areas of effect. The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"searing-smite","name":"Searing Smite","level":1,"school":"Evocation","classes":["Paladin"],"time":"Bonus Action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends.","higher":"All the damage increases by 1d6 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"shield","name":"Shield","level":1,"school":"Abjuration","classes":["Sorcerer","Wizard"],"time":"Reaction, which you take when you are hit by an attack roll or targeted by the Magic Missile spell","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 round","conc":false,"desc":"An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from *Magic Missile*.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"shield-of-faith","name":"Shield of Faith","level":1,"school":"Abjuration","classes":["Cleric","Paladin"],"time":"Bonus Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a prayer scroll","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"silent-image","name":"Silent Image","level":1,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a bit of fleece","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot Cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn’t accompanied by sound, smell, or other sensory effects.\n\nAs a Magic action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking.\n\nPhysical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sleep","name":"Sleep","level":1,"school":"Enchantment","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a pinch of sand or rose petals","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Each creature of your choice in a 5-foot-radius Sphere centered on a point within range must succeed on a Wisdom saving throw or have the Incapacitated condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the Unconscious condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell’s effect.\n\nCreatures that don’t sleep, such as elves, or that have Immunity to the Exhaustion condition automatically succeed on saves against this spell.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"speak-with-animals","name":"Speak with Animals","level":1,"school":"Divination","classes":["Bard","Druid","Ranger","Warlock"],"time":"Action or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action’s skill options with them.\n\nMost Beasts have little to say about topics that don’t pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"thunderwave","name":"Thunderwave","level":1,"school":"Evocation","classes":["Bard","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You unleash a wave of thunderous energy. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only.\n\nIn addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.","higher":"The damage increases by 1d8 for each spell slot level above 1.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"unseen-servant","name":"Unseen Servant","level":1,"school":"Conjuration","classes":["Bard","Warlock","Wizard"],"time":"Action or Ritual","ritual":true,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a bit of string and of wood","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"This spell creates an Invisible, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 Hit Point, and a Strength of 2, and it can’t attack. If it drops to 0 Hit Points, the spell ends.\n\nOnce on each of your turns as a Bonus Action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring drinks. Once you give the command, the servant performs the task to the best of its ability until it completes the task, then waits for your next command.\n\nIf you command the servant to perform a task that would move it more than 60 feet away from you, the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"acid-arrow","name":"Acid Arrow","level":2,"school":"Evocation","classes":["Wizard"],"time":"Action","ritual":false,"range":"90 feet","v":true,"s":true,"m":true,"mat":"powdered rhubarb leaf","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A shimmering green arrow streaks toward a target within range and bursts in a spray of acid. Make a ranged spell attack against the target. On a hit, the target takes 4d4 Acid damage and 2d4 Acid damage at the end of its next turn. On a miss, the arrow splashes the target with acid for half as much of the initial damage only.","higher":"The damage (both initial and later) increases by 1d4 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"aid","name":"Aid","level":2,"school":"Abjuration","classes":["Bard","Cleric","Druid","Paladin","Ranger"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a strip of white cloth","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"Choose up to three creatures within range. Each target’s Hit Point maximum and current Hit Points increase by 5 for the duration.","higher":"Each target’s Hit Points increase by 5 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"alter-self","name":"Alter Self","level":2,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You alter your physical form. Choose one of the following options. Its effects last for the duration, during which you can take a Magic action to replace the option you chose with a different one.\n\n***Aquatic Adaptation.*** You sprout gills and grow webs between your fingers. You can breathe underwater and gain a Swim Speed equal to your Speed.\n\n***Change Appearance.*** You alter your appearance. You decide what you look like, including your height, weight, facial features, sound of your voice, hair length, coloration, and other distinguishing characteristics. You can make yourself appear as a member of another species, though none of your statistics change. You can’t appear as a creature of a different size, and your basic shape stays the same; if you’re bipedal, you can’t use this spell to become quadrupedal, for instance. For the duration, you can take a Magic action to change your appearance in this way again.\n\n***Natural Weapons.*** You grow claws (Slashing), fangs (Piercing), horns (Piercing), or hooves (Bludgeoning). When you use your Unarmed Strike to deal damage with that new growth, it deals 1d6 damage of the type in parentheses instead of dealing the normal damage for your Unarmed Strike, and you use your spellcasting ability modifier for the attack and damage rolls rather than using Strength.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"animal-messenger","name":"Animal Messenger","level":2,"school":"Enchantment","classes":["Bard","Druid","Ranger"],"time":"Action or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a morsel of food","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"A Tiny Beast of your choice that you can see within range must succeed on a Charisma saving throw, or it attempts to deliver a message for you (if the target’s Challenge Rating isn’t 0, it automatically succeeds). You specify a location you have visited and a recipient who matches a general description, such as “a person dressed in the uniform of the town guard” or “a red-haired dwarf wearing a pointed hat.” You also communicate a message of up to twenty-five words. The Beast travels for the duration toward the specified location, covering about 25 miles per 24 hours or 50 miles if the Beast can fly.\n\nWhen the Beast arrives, it delivers your message to the creature that you described, mimicking your communication. If the Beast doesn’t reach its destination before the spell ends, the message is lost, and the Beast returns to where you cast the spell.","higher":"The spell’s duration increases by 48 hours for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"arcane-lock","name":"Arcane Lock","level":2,"school":"Abjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"gold dust worth 25+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"You touch a closed door, window, gate, container, or hatch and magically lock it for the duration. This lock can’t be unlocked by any nonmagical means. You and any creatures you designate when you cast the spell can open and close the object despite the lock. You can also set a password that, when spoken within 5 feet of the object, unlocks it for 1 minute.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"arcanists-magic-aura","name":"Arcanist’s Magic Aura","level":2,"school":"Illusion","classes":["Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a small square of silk","costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"With a touch, you place an illusion on a willing creature or an object that isn’t being worn or carried. A creature gains the Mask effect below, and an object gains the False Aura effect below. The effect lasts for the duration. If you cast the spell on the same target every day for 30 days, the illusion lasts until dispelled.\n\n***Mask (Creature).*** Choose a creature type other than the target’s actual type. Spells and other magical effects treat the target as if it were a creature of the chosen type.\n\n***False Aura (Object).*** You change the way the target appears to spells and magical effects that detect magical auras, such as *Detect Magic*. You can make a nonmagical object appear magical, make a magic item appear nonmagical, or change the object’s aura so that it appears to belong to a school of magic you choose.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"augury","name":"Augury","level":2,"school":"Divination","classes":["Cleric","Druid","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"specially marked sticks, bones, cards, or other divinatory tokens worth 25+ GP","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You receive an omen from an otherworldly entity about the results of a course of action that you plan to take within the next 30 minutes. The GM chooses the omen from the Omens table. The spell doesn’t account for circumstances, such as other spells, that might change the results.\n\n**Omens**\n\n| Omen | For Results That Will Be … |\n| --- | --- |\n| Weal | Good |\n| Woe | Bad |\n| Weal and woe | Good and bad |\n| Indifference | Neither good nor bad |\n\nIf you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"barkskin","name":"Barkskin","level":2,"school":"Transmutation","classes":["Druid","Ranger"],"time":"Bonus Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a handful of bark","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch a willing creature. Until the spell ends, the target’s skin assumes a bark-like appearance, and the target has an Armor Class of 17 if its AC is lower than that.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"blindness-deafness","name":"Blindness/Deafness","level":2,"school":"Transmutation","classes":["Bard","Cleric","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"One creature that you can see within range must succeed on a Constitution saving throw, or it has the Blinded or Deafened condition (your choice) for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.","higher":"You can target one additional creature for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"blur","name":"Blur","level":2,"school":"Illusion","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Your body becomes blurred. For the duration, any creature has Disadvantage on attack rolls against you. An attacker is immune to this effect if it perceives you with Blindsight or Truesight.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"calm-emotions","name":"Calm Emotions","level":2,"school":"Enchantment","classes":["Bard","Cleric"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Each Humanoid in a 20-foot-radius Sphere centered on a point you choose within range must succeed on a Charisma saving throw or be affected by one of the following effects (choose for each creature):\n\n- The creature has Immunity to the Charmed and Frightened conditions until the spell ends. If the creature was already Charmed or Frightened, those conditions are suppressed for the duration.\n- The creature becomes Indifferent about creatures of your choice that it’s Hostile toward. This indifference ends if the target takes damage or witnesses its allies taking damage. When the spell ends, the creature’s attitude returns to normal.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"continual-flame","name":"Continual Flame","level":2,"school":"Evocation","classes":["Cleric","Druid","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"ruby dust worth 50+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"A flame springs from an object that you touch. The effect casts Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. It looks like a regular flame, but it creates no heat and consumes no fuel. The flame can be covered or hidden but not smothered or quenched.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"darkness","name":"Darkness","level":2,"school":"Evocation","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":true,"mat":"bat fur and a piece of coal","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"For the duration, magical Darkness spreads from a point within range and fills a 15-foot-radius Sphere. Darkvision can’t see through it, and nonmagical light can’t illuminate it.\n\nAlternatively, you cast the spell on an object that isn’t being worn or carried, causing the Darkness to fill a 15-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the Darkness.\n\nIf any of this spell’s area overlaps with an area of Bright Light or Dim Light created by a spell of level 2 or lower, that other spell is dispelled.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"darkvision","name":"Darkvision","level":2,"school":"Transmutation","classes":["Druid","Ranger","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a dried carrot","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"For the duration, a willing creature you touch has Darkvision with a range of 150 feet.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"detect-thoughts","name":"Detect Thoughts","level":2,"school":"Divination","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"1 Copper Piece","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You activate one of the effects below. Until the spell ends, you can activate either effect as a Magic action on your later turns.\n\n***Sense Thoughts.*** You sense the presence of thoughts within 30 feet of yourself that belong to creatures that know languages or are telepathic. You don’t read the thoughts, but you know that a thinking creature is present.\n\nThe spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.\n\n***Read Thoughts.*** Target one creature you can see within 30 feet of yourself or one creature within 30 feet of yourself that you detected with the Sense Thoughts option. You learn what is most on the target’s mind right now. If the target doesn’t know any languages and isn’t telepathic, you learn nothing.\n\nAs a Magic action on your next turn, you can try to probe deeper into the target’s mind. If you probe deeper, the target makes a Wisdom saving throw. On a failed save, you discern the target’s reasoning, emotions, and something that looms large in its mind (such as a worry, love, or hate). On a successful save, the spell ends. Either way, the target knows that you are probing into its mind, and until you shift your attention away from the target’s mind, the target can take an action on its turn to make an Intelligence (Arcana) check against your spell save DC, ending the spell on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dragons-breath","name":"Dragon’s Breath","level":2,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Bonus Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a hot pepper","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You touch one willing creature, and choose Acid, Cold, Fire, Lightning, or Poison. Until the spell ends, the target can take a Magic action to exhale a 15-foot Cone. Each creature in that area makes a Dexterity saving throw, taking 3d6 damage of the chosen type on a failed save or half as much damage on a successful one.","higher":"The damage increases by 1d6 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"enhance-ability","name":"Enhance Ability","level":2,"school":"Transmutation","classes":["Bard","Cleric","Druid","Ranger","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"fur or a feather","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You touch a creature and choose Strength, Dexterity, Intelligence, Wisdom, or Charisma. For the duration, the target has Advantage on ability checks using the chosen ability.","higher":"You can target one additional creature for each spell slot level above 2. You can choose a different ability for each target.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"enlarge-reduce","name":"Enlarge/Reduce","level":2,"school":"Transmutation","classes":["Bard","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a pinch of powdered iron","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"For the duration, the spell enlarges or reduces a creature or an object you can see within range (see the chosen effect below). A targeted object must be neither worn nor carried. If the target is an unwilling creature, it can make a Constitution saving throw. On a successful save, the spell has no effect.\n\nEverything that a targeted creature is wearing and carrying changes size with it. Any item it drops returns to normal size at once. A thrown weapon or piece of ammunition returns to normal size immediately after it hits or misses a target.\n\n***Enlarge.*** The target’s size increases by one category—from Medium to Large, for example. The target also has Advantage on Strength checks and Strength saving throws. The target’s attacks with its enlarged weapons or Unarmed Strikes deal an extra 1d4 damage on a hit.\n\n***Reduce.*** The target’s size decreases by one category—from Medium to Small, for example. The target also has Disadvantage on Strength checks and Strength saving throws. The target’s attacks with its reduced weapons or Unarmed Strikes deal 1d4 less damage on a hit (this can’t reduce the damage below 1).","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"enthrall","name":"Enthrall","level":2,"school":"Enchantment","classes":["Bard","Warlock"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You weave a distracting string of words, causing creatures of your choice that you can see within range to make a Wisdom saving throw. Any creature you or your companions are fighting automatically succeeds on this save. On a failed save, a target has a −10 penalty to Wisdom (Perception) checks and Passive Perception until the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"find-steed","name":"Find Steed","level":2,"school":"Conjuration","classes":["Paladin"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You summon an otherworldly being that appears as a loyal steed in an unoccupied space of your choice within range. This creature uses the **Otherworldly Steed** stat block. If you already have a steed from this spell, the steed is replaced by the new one.\n\nThe steed resembles a Large, rideable animal of your choice, such as a horse, a camel, a dire wolf, or an elk. Whenever you cast the spell, choose the steed’s creature type—Celestial, Fey, or Fiend—which determines certain traits in the stat block.\n\n***Combat.*** The steed is an ally to you and your allies. In combat, it shares your Initiative count, and it functions as a controlled mount while you ride it (as defined in the rules on mounted combat). If you have the Incapacitated condition, the steed takes its turn immediately after yours and acts independently, focusing on protecting you.\n\n***Disappearance of the Steed.*** The steed disappears if it drops to 0 Hit Points or if you die. When it disappears, it leaves behind anything it was wearing or carrying. If you cast this spell again, you decide whether you summon the steed that disappeared or a different one.","higher":"Use the spell slot’s level for the spell’s level in the stat block. face a choice of paths along the way there, you know which path is the most direct.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"find-traps","name":"Find Traps","level":2,"school":"Divination","classes":["Cleric","Druid","Ranger"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You sense any trap within range that is within line of sight. A trap, for the purpose of this spell, includes any object or mechanism that was created to cause damage or other danger. Thus, the spell would sense the *Alarm* or *Glyph of Warding* spell or a mechanical pit trap, but it wouldn’t reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole.\n\nThis spell reveals that a trap is present but not its location. You do learn the general nature of the danger posed by a trap you sense.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"flame-blade","name":"Flame Blade","level":2,"school":"Evocation","classes":["Druid","Sorcerer"],"time":"Bonus Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a sumac leaf","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke it again as a Bonus Action.\n\nAs a Magic action, you can make a melee spell attack with the fiery blade. On a hit, the target takes Fire damage equal to 3d6 plus your spellcasting ability modifier.\n\nThe flaming blade sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.","higher":"The damage increases by 1d6 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"flaming-sphere","name":"Flaming Sphere","level":2,"school":"Conjuration","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a ball of wax","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a 5-foot-diameter sphere of fire in an unoccupied space on the ground within range. It lasts for the duration. Any creature that ends its turn within 5 feet of the sphere makes a Dexterity saving throw, taking 2d6 Fire damage on a failed save or half as much damage on a successful one.\n\nAs a Bonus Action, you can move the sphere up to 30 feet, rolling it along the ground. If you move the sphere into a creature’s space, that creature makes the save against the sphere, and the sphere stops moving for the turn.\n\nWhen you move the sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. Flammable objects that aren’t being worn or carried start burning if touched by the sphere, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet.","higher":"The damage increases by 1d6 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"gentle-repose","name":"Gentle Repose","level":2,"school":"Necromancy","classes":["Cleric","Paladin","Wizard"],"time":"Action or Ritual","ritual":true,"range":"Touch","v":true,"s":true,"m":true,"mat":"2 Copper Pieces, which the spell consumes","costly":false,"consumed":true,"duration":"10 days","conc":false,"desc":"You touch a corpse or other remains. For the duration, the target is protected from decay and can’t become Undead.\n\nThe spell also effectively extends the time limit on raising the target from the dead, since days spent under the influence of this spell don’t count against the time limit of spells such as *Raise Dead*.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"gust-of-wind","name":"Gust of Wind","level":2,"school":"Evocation","classes":["Druid","Ranger","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a legume seed","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A Line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the duration. Each creature in the Line must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the Line. A creature that ends its turn in the Line must make the same save.\n\nAny creature in the Line must spend 2 feet of movement for every 1 foot it moves when moving closer to you.\n\nThe gust disperses gas or vapor, and it extinguishes candles and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance to extinguish them.\n\nAs a Bonus Action on your later turns, you can change the direction in which the Line blasts from you.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"heat-metal","name":"Heat Metal","level":2,"school":"Transmutation","classes":["Bard","Druid"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a piece of iron and a flame","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Choose a manufactured metal object, such as a metal weapon or a suit of Heavy or Medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 Fire damage when you cast the spell. Until the spell ends, you can take a Bonus Action on each of your later turns to deal this damage again if the object is within range.\n\nIf a creature is holding or wearing the object and takes the damage from it, the creature must succeed on a Constitution saving throw or drop the object if it can. If it doesn’t drop the object, it has Disadvantage on attack rolls and ability checks until the start of your next turn.","higher":"The damage increases by 1d8 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"hold-person","name":"Hold Person","level":2,"school":"Enchantment","classes":["Bard","Cleric","Druid","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a straight piece of iron","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Choose a Humanoid that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.","higher":"You can target one additional Humanoid for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"invisibility","name":"Invisibility","level":2,"school":"Illusion","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"an eyelash in gum arabic","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"A creature you touch has the Invisible condition until the spell ends. The spell ends early immediately after the target makes an attack roll, deals damage, or casts a spell.","higher":"You can target one additional creature for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"knock","name":"Knock","level":2,"school":"Transmutation","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access.\n\nA target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked.\n\nIf the target is held shut by *Arcane Lock*, that spell is suppressed for 10 minutes, during which time the target can be opened and closed.\n\nWhen you cast the spell, a loud knock, audible up to 300 feet away, emanates from the target.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"lesser-restoration","name":"Lesser Restoration","level":2,"school":"Abjuration","classes":["Bard","Cleric","Druid","Paladin","Ranger"],"time":"Bonus Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You touch a creature and end one condition on it: Blinded, Deafened, Paralyzed, or Poisoned.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"levitate","name":"Levitate","level":2,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a metal spring","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"One creature or loose object of your choice that you can see within range rises vertically up to 20 feet and remains suspended there for the duration. The spell can levitate an object that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected.\n\nThe target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target’s altitude by up to 20 feet in either direction on your turn. If you are the target, you can move up or down as part of your move. Otherwise, you can take a Magic action to move the target, which must remain within the spell’s range.\n\nWhen the spell ends, the target floats gently to the ground if it is still aloft.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"locate-animals-or-plants","name":"Locate Animals or Plants","level":2,"school":"Divination","classes":["Bard","Druid","Ranger"],"time":"Action or Ritual","ritual":true,"range":"Self","v":true,"s":true,"m":true,"mat":"fur from a bloodhound","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Describe or name a specific kind of Beast, Plant creature, or nonmagical plant. You learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"locate-object","name":"Locate Object","level":2,"school":"Divination","classes":["Bard","Cleric","Druid","Paladin","Ranger","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a forked twig","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"Describe or name an object that is familiar to you. You sense the direction to the object’s location if that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement.\n\nThe spell can locate a specific object known to you if you have seen it up close—within 30 feet—at least once. Alternatively, the spell can locate the nearest object of a particular kind, such as a certain kind of apparel, jewelry, furniture, tool, or weapon.\n\nThis spell can’t locate an object if any thickness of lead blocks a direct path between you and the object.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"magic-mouth","name":"Magic Mouth","level":2,"school":"Illusion","classes":["Bard","Wizard"],"time":"1 minute or Ritual","ritual":true,"range":"30 feet","v":true,"s":true,"m":true,"mat":"jade dust worth 10+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"You implant a message within an object in range—a message that is uttered when a trigger condition is met. Choose an object that you can see and that isn’t being worn or carried by another creature. Then speak the message, which must be 25 words or fewer, though it can be delivered over as long as 10 minutes. Finally, determine the circumstance that will trigger the spell to deliver your message.\n\nWhen that trigger occurs, a magical mouth appears on the object and recites the message in your voice and at the same volume you spoke. If the object you chose has a mouth or something that looks like a mouth (for example, the mouth of a statue), the magical mouth appears there, so the words appear to come from the object’s mouth. When you cast this spell, you can have the spell end after it delivers its message, or it can remain and repeat its message whenever the trigger occurs.\n\nThe trigger can be as general or as detailed as you like, though it must be based on visual or audible conditions that occur within 30 feet of the object. For example, you could instruct the mouth to speak when any creature moves within 30 feet of the object or when a silver bell rings within 30 feet of it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"magic-weapon","name":"Magic Weapon","level":2,"school":"Transmutation","classes":["Paladin","Ranger","Sorcerer","Wizard"],"time":"Bonus Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls. The spell ends early if you cast it again.","higher":"The bonus increases to +2 with a level 3–5 spell slot. The bonus increases to +3 with a level 6+ spell slot.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"mind-spike","name":"Mind Spike","level":2,"school":"Divination","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":false,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You drive a spike of psionic energy into the mind of one creature you can see within range. The target makes a Wisdom saving throw, taking 3d8 Psychic damage on a failed save or half as much damage on a successful one. On a failed save, you also always know the target’s location until the spell ends, but only while the two of you are on the same plane of existence. While you have this knowledge, the target can’t become hidden from you, and if it has the Invisible condition, it gains no benefit from that condition against you.","higher":"The damage increases by 1d8 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"mirror-image","name":"Mirror Image","level":2,"school":"Illusion","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it’s impossible to track which image is real.\n\nEach time a creature hits you with an attack roll during the spell’s duration, roll a d6 for each of your remaining duplicates. If any of the d6s rolls a 3 or higher, one of the duplicates is hit instead of you, and the duplicate is destroyed. The duplicates otherwise ignore all other damage and effects. The spell ends when all three duplicates are destroyed.\n\nA creature is unaffected by this spell if it has the Blinded condition, Blindsight, or Truesight.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"misty-step","name":"Misty Step","level":2,"school":"Conjuration","classes":["Sorcerer","Warlock","Wizard"],"time":"Bonus Action","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space you can see.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"moonbeam","name":"Moonbeam","level":2,"school":"Evocation","classes":["Druid"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":true,"mat":"a moonseed leaf","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet.\n\nWhen the Cylinder appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the *Polymorph* spell, for example), it reverts to its true form and can’t shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell’s area moves into its space and when it enters the spell’s area or ends its turn there. A creature makes this save only once per turn.","higher":"The damage increases by 1d10 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"pass-without-trace","name":"Pass without Trace","level":2,"school":"Abjuration","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"ashes from burned mistletoe","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You radiate a concealing aura in a 30-foot Emanation for the duration. While in the aura, you and each creature you choose have a +10 bonus to Dexterity (Stealth) checks and leave no tracks.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"phantasmal-force","name":"Phantasmal Force","level":2,"school":"Illusion","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a bit of fleece","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You attempt to craft an illusion in the mind of a creature you can see within range. The target makes an Intelligence saving throw. On a failed save, you create a phantasmal object, creature, or other phenomenon that is no larger than a 10-foot Cube and that is perceivable only to the target for the duration. The phantasm includes sound, temperature, and other stimuli.\n\nThe target can take a Study action to examine the phantasm with an Intelligence (Investigation) check against your spell save DC. If the check succeeds, the target realizes that the phantasm is an illusion, and the spell ends.\n\nWhile affected by the spell, the target treats the phantasm as if it were real and rationalizes any illogical outcomes from interacting with it. For example, if the target steps through a phantasmal bridge and survives the fall, it believes the bridge exists and something else caused it to fall.\n\nAn affected target can even take damage from the illusion if the phantasm represents a dangerous creature or hazard. On each of your turns, such a phantasm can deal 2d8 Psychic damage to the target if it is in the phantasm’s area or within 5 feet of the phantasm. The target perceives the damage as a type appropriate to the illusion.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"prayer-of-healing","name":"Prayer of Healing","level":2,"school":"Abjuration","classes":["Cleric","Paladin"],"time":"10 minutes","ritual":false,"range":"30 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Up to five creatures of your choice who remain within range for the spell’s entire casting gain the benefits of a Short Rest and also regain 2d8 Hit Points. A creature can’t be affected by this spell again until that creature finishes a Long Rest.","higher":"The healing increases by 1d8 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"protection-from-poison","name":"Protection from Poison","level":2,"school":"Abjuration","classes":["Cleric","Druid","Paladin","Ranger"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch a creature and end the Poisoned condition on it. For the duration, the target has Advantage on saving throws to avoid or end the Poisoned condition, and it has Resistance to Poison damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"ray-of-enfeeblement","name":"Ray of Enfeeblement","level":2,"school":"Necromancy","classes":["Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A beam of enervating energy shoots from you toward a creature within range. The target must make a Constitution saving throw. On a successful save, the target has Disadvantage on the next attack roll it makes until the start of your next turn.\n\nOn a failed save, the target has Disadvantage on Strength-based D20 Tests for the duration. During that time, it also subtracts 1d8 from all its damage rolls. The target repeats the save at the end of each of its turns, ending the spell on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"rope-trick","name":"Rope Trick","level":2,"school":"Transmutation","classes":["Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a segment of rope","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch a rope. One end of it hovers upward until the rope hangs perpendicular to the ground or the rope reaches a ceiling. At the rope’s upper end, an Invisible 3-foot-by-5-foot portal opens to an extradimensional space that lasts until the spell ends. That space can be reached by climbing the rope, which can be pulled into or dropped out of it.\n\nThe space can hold up to eight Medium or smaller creatures. Attacks, spells, and other effects can’t pass into or out of the space, but creatures inside it can see through the portal. Anything inside the space drops out when the spell ends.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"scorching-ray","name":"Scorching Ray","level":2,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You hurl three fiery rays. You can hurl them at one target within range or at several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 Fire damage.","higher":"You create one additional ray for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"see-invisibility","name":"See Invisibility","level":2,"school":"Divination","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a pinch of talc","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"For the duration, you see creatures and objects that have the Invisible condition as if they were visible, and you can see into the Ethereal Plane. Creatures and objects there appear ghostly.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"shatter","name":"Shatter","level":2,"school":"Evocation","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a chip of mica","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius Sphere centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has Disadvantage on the save.\n\nA nonmagical object that isn’t being worn or carried also takes the damage if it’s in the spell’s area.","higher":"The damage increases by 1d8 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"shining-smite","name":"Shining Smite","level":2,"school":"Transmutation","classes":["Paladin"],"time":"Bonus Action, which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can’t benefit from the Invisible condition.","higher":"The damage increases by 1d6 for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"silence","name":"Silence","level":2,"school":"Illusion","classes":["Bard","Cleric","Ranger"],"time":"Action or Ritual","ritual":true,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"spider-climb","name":"Spider Climb","level":2,"school":"Transmutation","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a drop of bitumen and a spider","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and along ceilings, while leaving its hands free. The target also gains a Climb Speed equal to its Speed.","higher":"You can target one additional creature for each spell slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"spike-growth","name":"Spike Growth","level":2,"school":"Transmutation","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"seven thorns","costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"The ground in a 20-foot-radius Sphere centered on a point within range sprouts hard spikes and thorns. The area becomes Difficult Terrain for the duration. When a creature moves into or within the area, it takes 2d4 Piercing damage for every 5 feet it travels.\n\nThe transformation of the ground is camouflaged to look natural. Any creature that can’t see the area when the spell is cast must take a Search action and succeed on a Wisdom (Perception or Survival) check against your spell save DC to recognize the terrain as hazardous before entering it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"spiritual-weapon","name":"Spiritual Weapon","level":2,"school":"Evocation","classes":["Cleric"],"time":"Bonus Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You create a floating, spectral force that resembles a weapon of your choice and lasts for the duration. The force appears within range in a space of your choice, and you can immediately make one melee spell attack against one creature within 5 feet of the force. On a hit, the target takes Force damage equal to 1d8 plus your spellcasting ability modifier.\n\nAs a Bonus Action on your later turns, you can move the force up to 20 feet and repeat the attack against a creature within 5 feet of it.","higher":"The damage increases by 1d8 for every slot level above 2.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"suggestion","name":"Suggestion","level":2,"school":"Enchantment","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":false,"m":true,"mat":"a drop of honey","costly":false,"consumed":false,"duration":"Concentration, up to 8 hours","conc":true,"desc":"You suggest a course of activity—described in no more than 25 words—to one creature you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to the target or its allies. For example, you could say, “Fetch the key to the cult’s treasure vault, and give the key to me.” Or you could say, “Stop fighting, leave this library peacefully, and don’t return.”\n\nThe target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. The Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for the target upon completing it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"warding-bond","name":"Warding Bond","level":2,"school":"Abjuration","classes":["Cleric","Paladin"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration","costly":true,"consumed":false,"duration":"1 hour","conc":false,"desc":"You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has Resistance to all damage. Also, each time it takes damage, you take the same amount of damage.\n\nThe spell ends if you drop to 0 Hit Points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"web","name":"Web","level":2,"school":"Conjuration","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a bit of spiderweb","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot Cube there for the duration. The webs are Difficult Terrain, and the area within them is Lightly Obscured.\n\nIf the webs aren’t anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet.\n\nThe first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Restrained condition while in the webs or until it breaks free.\n\nA creature Restrained by the webs can take an action to make a Strength (Athletics) check against your spell save DC. If it succeeds, it is no longer Restrained.\n\nThe webs are flammable. Any 5-foot Cube of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"zone-of-truth","name":"Zone of Truth","level":2,"school":"Enchantment","classes":["Bard","Cleric","Paladin"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"You create a magical zone that guards against deception in a 15-foot-radius Sphere centered on a point within range. Until the spell ends, a creature that enters the spell’s area for the first time on a turn or starts its turn there makes a Charisma saving throw. On a failed save, a creature can’t speak a deliberate lie while in the radius. You know whether a creature succeeds or fails on this save.\n\nAn affected creature is aware of the spell and can avoid answering questions to which it would normally respond with a lie. Such a creature can be evasive yet must be truthful.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"animate-dead","name":"Animate Dead","level":3,"school":"Necromancy","classes":["Cleric","Wizard"],"time":"1 minute","ritual":false,"range":"10 feet","v":true,"s":true,"m":true,"mat":"a drop of blood, a piece of flesh, and a pinch of bone dust","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Choose a pile of bones or a corpse of a Medium or Small Humanoid within range. The target becomes an Undead creature: a **Skeleton** if you chose bones or a **Zombie** if you chose a corpse (see “Monsters” for the stat blocks).\n\nOn each of your turns, you can take a Bonus Action to mentally command any creature you made with this spell if the creature is within 60 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to each one). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a chamber or corridor. If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. Once given an order, the creature continues to follow it until its task is complete.\n\nThe creature is under your control for 24 hours, after which it stops obeying any command you’ve given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature again before the current 24-hour period ends. This use of the spell reasserts your control over up to four creatures you have animated with this spell rather than animating a new creature.","higher":"You animate or reassert control over two additional Undead creatures for each spell slot level above 3. Each of the creatures must come from a different corpse or pile of bones.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"beacon-of-hope","name":"Beacon of Hope","level":3,"school":"Abjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Choose any number of creatures within range. For the duration, each target has Advantage on Wisdom saving throws and Death Saving Throws and regains the maximum number of Hit Points possible from any healing.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"bestow-curse","name":"Bestow Curse","level":3,"school":"Necromancy","classes":["Bard","Cleric","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You touch a creature, which must succeed on a Wisdom saving throw or become cursed for the duration. Until the curse ends, the target suffers one of the following effects of your choice:\n\n- Choose one ability. The target has Disadvantage on ability checks and saving throws made with that ability.\n- The target has Disadvantage on attack rolls against you.\n- In combat, the target must succeed on a Wisdom saving throw at the start of each of its turns or be forced to take the Dodge action on that turn.\n- If you deal damage to the target with an attack roll or a spell, the target takes an extra 1d8 Necrotic damage.","higher":"If you cast this spell using a level 4 spell slot, you can maintain Concentration on it for up to 10 minutes. If you use a level 5+ spell slot, the spell doesn’t require Concentration, and the duration becomes 8 hours (level 5–6 slot) or 24 hours (level 7–8 slot). If you use a level 9 spell slot, the spell lasts until dispelled.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"blink","name":"Blink","level":3,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 minute","conc":false,"desc":"Roll 1d6 at the end of each of your turns for the duration. On a roll of 4–6, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell ends instantly if you are already on that plane). While on the Ethereal Plane, you can perceive the plane you left, which is cast in shades of gray, but you can’t see anything there more than 60 feet away. You can affect and be affected only by other creatures on the Ethereal Plane, and creatures on the other plane can’t perceive you unless they have a special ability that lets them perceive things on the Ethereal Plane.\n\nYou return to the other plane at the start of your next turn and when the spell ends if you are on the Ethereal Plane. You return to an unoccupied space of your choice that you can see within 10 feet of the space you left. If no unoccupied space is available within that range, you appear in the nearest unoccupied space.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"call-lightning","name":"Call Lightning","level":3,"school":"Conjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"A storm cloud appears at a point within range that you can see above yourself. It takes the shape of a Cylinder that is 10 feet tall with a 60-foot radius.\n\nWhen you cast the spell, choose a point you can see under the cloud. A lightning bolt shoots from the cloud to that point. Each creature within 5 feet of that point makes a Dexterity saving throw, taking 3d10 Lightning damage on a failed save or half as much damage on a successful one.\n\nUntil the spell ends, you can take a Magic action to call down lightning in that way again, targeting the same point or a different one.\n\nIf you’re outdoors in a storm when you cast this spell, the spell gives you control over that storm instead of creating a new one. Under such conditions, the spell’s damage increases by 1d10.","higher":"The damage increases by 1d10 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"clairvoyance","name":"Clairvoyance","level":3,"school":"Divination","classes":["Bard","Cleric","Sorcerer","Wizard"],"time":"10 minutes","ritual":false,"range":"1 mile","v":true,"s":true,"m":true,"mat":"a focus worth 100+ GP, either a jeweled horn for hearing or a glass eye for seeing","costly":true,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You create an Invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The intangible, invulnerable sensor remains in place for the duration.\n\nWhen you cast the spell, choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As a Bonus Action, you can switch between seeing and hearing.\n\nA creature that sees the sensor (such as a creature benefiting from *See Invisibility* or Truesight) sees a luminous orb about the size of your fist.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"conjure-animals","name":"Conjure Animals","level":3,"school":"Conjuration","classes":["Druid","Ranger"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You conjure nature spirits that appear as a Large pack of spectral, intangible animals in an unoccupied space you can see within range. The pack lasts for the duration, and you choose the spirits’ animal form, such as wolves, serpents, or birds.\n\nYou have Advantage on Strength saving throws while you’re within 5 feet of the pack, and when you move on your turn, you can also move the pack up to 30 feet to an unoccupied space you can see.\n\nWhenever the pack moves within 10 feet of a creature you can see and whenever a creature you can see enters a space within 10 feet of the pack or ends its turn there, you can force that creature to make a Dexterity saving throw. On a failed save, the creature takes 3d10 Slashing damage. A creature makes this save only once per turn.","higher":"The damage increases by 1d10 for each spell slot level above 3.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id"
