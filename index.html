s, causing the bead to explode. On a successful save, the creature can throw the bead up to 40 feet. If the thrown bead enters a creature’s space or collides with a solid object, the spell ends, and the bead explodes.\n\nWhen the bead explodes, flammable objects in the explosion that aren’t being worn or carried start burning.","higher":"The base damage increases by 1d6 for each spell slot level above 7.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"divine-word","name":"Divine Word","level":7,"school":"Evocation","classes":["Cleric"],"time":"Bonus Action","ritual":false,"range":"30 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You utter a word imbued with power from the Upper Planes. Each creature of your choice in range makes a Charisma saving throw. On a failed save, a target that has 50 Hit Points or fewer suffers an effect based on its current Hit Points, as shown in the Divine Word Effects table. Regardless of its Hit Points, a Celestial, an Elemental, a Fey, or a Fiend target that fails its save is forced back to its plane of origin (if it isn’t there already) and can’t return to the current plane for 24 hours by any means short of a *Wish* spell.\n\n**Divine Word Effects**\n\n| Hit Points | Effect |\n| --- | --- |\n| 0–20 | The target dies. |\n| 21–30 | The target has the Blinded, Deafened, and Stunned conditions for 1 hour. |\n| 31–40 | The target has the Blinded and Deafened conditions for 10 minutes. |\n| 41–50 | The target has the Deafened condition for 1 minute. |","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"etherealness","name":"Etherealness","level":7,"school":"Conjuration","classes":["Bard","Cleric","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Up to 8 hours","conc":false,"desc":"You step into the border regions of the Ethereal Plane, where it overlaps with your current plane. You remain in the Border Ethereal for the duration. During this time, you can move in any direction. If you move up or down, every foot of movement costs an extra foot. You can perceive the plane you left, which looks gray, and you can’t see anything there more than 60 feet away.\n\nWhile on the Ethereal Plane, you can affect and be affected only by creatures, objects, and effects on that plane. Creatures that aren’t on the Ethereal Plane can’t perceive or interact with you unless a feature gives them the ability to do so.\n\nWhen the spell ends, you return to the plane you left in the spot that corresponds to your space in the Border Ethereal. If you appear in an occupied space, you are shunted to the nearest unoccupied space and take Force damage equal to twice the number of feet you are moved.\n\nThis spell ends instantly if you cast it while you are on the Ethereal Plane or a plane that doesn’t border it, such as one of the Outer Planes.","higher":"You can target up to three willing creatures (including yourself) for each spell slot level above 7. The creatures must be within 10 feet of you when you cast the spell.","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"finger-of-death","name":"Finger of Death","level":7,"school":"Necromancy","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You unleash negative energy toward a creature you can see within range. The target makes a Constitution saving throw, taking 7d8 + 30 Necrotic damage on a failed save or half as much damage on a successful one.\n\nA Humanoid killed by this spell rises at the start of your next turn as a **Zombie** (see “Monsters”) that follows your verbal orders.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"fire-storm","name":"Fire Storm","level":7,"school":"Evocation","classes":["Cleric","Druid","Sorcerer"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A storm of fire appears within range. The area of the storm consists of up to ten 10-foot Cubes, which you arrange as you like. Each Cube must be contiguous with at least one other Cube. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failed save or half as much damage on a successful one.\n\nFlammable objects in the area that aren’t being worn or carried start burning.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"forcecage","name":"Forcecage","level":7,"school":"Evocation","classes":["Bard","Warlock","Wizard"],"time":"Action","ritual":false,"range":"100 feet","v":true,"s":true,"m":true,"mat":"ruby dust worth 1,500+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Concentration, up to 1 hour","conc":true,"desc":"An immobile, Invisible, Cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose.\n\nA prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the area.\n\nWhen you cast the spell, any creature that is completely inside the cage’s area is trapped. Creatures only partially within the area, or those too large to fit inside it, are pushed away from the center of the area until they are completely outside it.\n\nA creature inside the cage can’t leave it by nonmagical means. If the creature tries to use teleportation or interplanar travel to leave, it must first make a Charisma saving throw. On a successful save, the creature can use that magic to exit the cage. On a failed save, the creature doesn’t exit the cage and wastes the spell or effect. The cage also extends into the Ethereal Plane, blocking ethereal travel.\n\nThis spell can’t be dispelled by *Dispel Magic*.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"magnificent-mansion","name":"Magnificent Mansion","level":7,"school":"Conjuration","classes":["Bard","Wizard"],"time":"1 minute","ritual":false,"range":"300 feet","v":true,"s":true,"m":true,"mat":"a miniature door worth 15+ GP","costly":true,"consumed":false,"duration":"24 hours","conc":false,"desc":"You conjure a shimmering door in range that lasts for the duration. The door leads to an extradimensional dwelling and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the door remains open. You can open or close it (no action required) if you are within 30 feet of it. While closed, the door is imperceptible.\n\nBeyond the door is a magnificent foyer with numerous chambers beyond. The dwelling’s atmosphere is clean, fresh, and warm.\n\nYou can create any floor plan you like for the dwelling, but it can’t exceed 50 contiguous 10-foot Cubes. The place is furnished and decorated as you choose. It contains sufficient food to serve a ninecourse banquet for up to 100 people. Furnishings and other objects created by this spell dissipate into smoke if removed from it.\n\nA staff of 100 near-transparent servants attends all who enter. You determine the appearance of these servants and their attire. They are invulnerable and obey your commands. Each servant can perform tasks that a human could perform, but they can’t attack or take any action that would directly harm another creature. Thus the servants can fetch things, clean, mend, fold clothes, light fires, serve food, pour wine, and so on. The servants can’t leave the dwelling.\n\nWhen the spell ends, any creatures or objects left inside the extradimensional space are expelled into the unoccupied spaces nearest to the entrance.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mirage-arcane","name":"Mirage Arcane","level":7,"school":"Illusion","classes":["Bard","Druid","Wizard"],"time":"10 minutes","ritual":false,"range":"Sight","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"10 days","conc":false,"desc":"You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other rough or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road.\n\nSimilarly, you can alter the appearance of structures or add them where none are present. The spell doesn’t disguise, conceal, or add creatures.\n\nThe illusion includes audible, visual, tactile, and olfactory elements, so it can turn clear ground into Difficult Terrain (or vice versa) or otherwise impede movement through the area. Any piece of the illusory terrain (such as a rock or stick) that is removed from the spell’s area disappears immediately.\n\nCreatures with Truesight can see through the illusion to the terrain’s true form; however, all other elements of the illusion remain, so while the creature is aware of the illusion’s presence, the creature can still physically interact with the illusion.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"plane-shift","name":"Plane Shift","level":7,"school":"Conjuration","classes":["Cleric","Druid","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a forked, metal rod worth 250+ GP and attuned to a plane of existence","costly":true,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as a specific city on the Elemental Plane of Fire or palace on the second level of the Nine Hells, and you appear in or near that destination, as determined by the GM.\n\nAlternatively, if you know the sigil sequence of a teleportation circle on another plane of existence, this spell can take you to that circle. If the teleportation circle is too small to hold all the creatures you transported, they appear in the closest unoccupied spaces next to the circle.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"prismatic-spray","name":"Prismatic Spray","level":7,"school":"Evocation","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Eight rays of light flash from you in a 60-foot Cone. Each creature in the Cone makes a Dexterity saving throw. For each target, roll 1d8 to determine which color ray affects it, consulting the Prismatic Rays table.\n\n**Prismatic Rays**\n\n| 1d8 | Ray |\n| --- | --- |\n| 1 | **Red.** *Failed Save:* 12d6 Fire damage. *Successful Save:* Half as much damage. |\n| 2 | **Orange.** *Failed Save:* 12d6 Acid damage. *Successful Save:* Half as much damage. |\n| 3 | **Yellow.** *Failed Save:* 12d6 Lightning damage. *Successful Save:* Half as much damage. |\n| 4 | **Green.** *Failed Save:* 12d6 Poison damage. *Successful Save:* Half as much damage. |\n| 5 | **Blue.** *Failed Save:* 12d6 Cold damage. *Successful Save:* Half as much damage. |\n| 6 | **Indigo.** *Failed Save:* The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the *Greater Restoration* spell. The successes and failures needn’t be consecutive; keep track of both until the target collects three of a kind. |\n| 7 | **Violet.** *Failed Save:* The target has the Blinded condition and makes a Wisdom saving throw at the start of your next turn. On a successful save, the condition ends. On a failed save, the condition ends, and the creature teleports to another plane of existence (GM’s choice). |\n| 8 | **Special.** The target is struck by two rays. Roll twice, rerolling any 8. |","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"project-image","name":"Project Image","level":7,"school":"Illusion","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"500 miles","v":true,"s":true,"m":true,"mat":"a statuette of yourself worth 5+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 day","conc":true,"desc":"You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you, but it is intangible. If the illusion takes any damage, it disappears, and the spell ends.\n\nYou can see through the illusion’s eyes and hear through its ears as if you were in its space. As a Magic action, you can move it up to 60 feet and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly.\n\nPhysical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"regenerate","name":"Regenerate","level":7,"school":"Transmutation","classes":["Bard","Cleric","Druid"],"time":"1 minute","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a prayer wheel","costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"A creature you touch regains 4d8 + 15 Hit Points. For the duration, the target regains 1 Hit Point at the start of each of its turns, and any severed body parts regrow after 2 minutes.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"resurrection","name":"Resurrection","level":7,"school":"Necromancy","classes":["Bard","Cleric"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a diamond worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"With a touch, you revive a dead creature that has been dead for no more than a century, didn’t die of old age, and wasn’t Undead when it died.\n\nThe creature returns to life with all its Hit Points. This spell also neutralizes any poisons that affected the creature at the time of death. This spell closes all mortal wounds and restores any missing body parts.\n\nComing back from the dead is an ordeal. The target takes a −4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0.\n\nCasting this spell to revive a creature that has been dead for 365 days or longer taxes you. Until you finish a Long Rest, you can’t cast spells again, and you have Disadvantage on D20 Tests.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"reverse-gravity","name":"Reverse Gravity","level":7,"school":"Transmutation","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"100 feet","v":true,"s":true,"m":true,"mat":"a lodestone and iron filings","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"This spell reverses gravity in a 50-foot-radius, 100-foot high Cylinder centered on a point within range. All creatures and objects in that area that aren’t anchored to the ground fall upward and reach the top of the Cylinder. A creature can make a Dexterity saving throw to grab a fixed object it can reach, thus avoiding the fall upward.\n\nIf a ceiling or an anchored object is encountered in this upward fall, creatures and objects strike it just as they would during a downward fall. If an affected creature or object reaches the Cylinder’s top without striking anything, it hovers there for the duration. When the spell ends, affected objects and creatures fall downward.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sequester","name":"Sequester","level":7,"school":"Transmutation","classes":["Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"gem dust worth 5,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"With a touch, you magically sequester an object or a willing creature. For the duration, the target has the Invisible condition and can’t be targeted by Divination spells, detected by magic, or viewed remotely with magic.\n\nIf the target is a creature, it enters a state of suspended animation; it has the Unconscious condition, doesn’t age, and doesn’t need food, water, or air.\n\nYou can set a condition for the spell to end early. The condition can be anything you choose, but it must occur or be visible within 1 mile of the target. Examples include “after 1,000 years” or “when the tarrasque awakens.” This spell also ends if the target takes any damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"simulacrum","name":"Simulacrum","level":7,"school":"Illusion","classes":["Wizard"],"time":"12 hours","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"powdered ruby worth 1,500+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"You create a simulacrum of one Beast or Humanoid that is within 10 feet of you for the entire casting of the spell. You finish the casting by touching both the creature and a pile of ice or snow that is the same size as that creature, and the pile turns into the simulacrum, which is a creature. It uses the game statistics of the original creature at the time of casting, except it is a Construct, its Hit Point maximum is half as much, and it can’t cast this spell.\n\nThe simulacrum is Friendly to you and creatures you designate. It obeys your commands and acts on your turn in combat. The simulacrum can’t gain levels, and it can’t take Short or Long Rests.\n\nIf the simulacrum takes damage, the only way to restore its Hit Points is to repair it as you take a Long Rest, during which you expend components worth 100 GP per Hit Point restored. The simulacrum must stay within 5 feet of you for the repair.\n\nThe simulacrum lasts until it drops to 0 Hit Points, at which point it reverts to snow and melts away. If you cast this spell again, any simulacrum you created with this spell is instantly destroyed.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"symbol","name":"Symbol","level":7,"school":"Abjuration","classes":["Bard","Cleric","Druid","Wizard"],"time":"1 minute","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"powdered diamond worth 1,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled or triggered","conc":false,"desc":"You inscribe a harmful glyph either on a surface (such as a section of floor or wall) or within an object that can be closed (such as a book or chest). The glyph can cover an area no larger than 10 feet in diameter. If you choose an object, it must remain in place; if it is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.\n\nThe glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice.\n\nWhen you inscribe the glyph, you set its trigger and choose which effect the symbol bears: Death, Discord, Fear, Pain, Sleep, or Stunning. Each one is explained below.\n\n***Set the Trigger.*** You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph.\n\nYou can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don’t trigger the glyph, such as those who say a certain password.\n\nOnce triggered, the glyph glows, filling a 60-foot-radius Sphere with Dim Light for 10 minutes, after which time the spell ends. Each creature in the Sphere when the glyph activates is targeted by its effect, as is a creature that enters the Sphere for the first time on a turn or ends its turn there. A creature is targeted only once per turn.\n\n***Death.*** Each target makes a Constitution saving throw, taking 10d10 Necrotic damage on a failed save or half as much damage on a successful save.\n\n***Discord.*** Each target makes a Wisdom saving throw. On a failed save, a target argues with other creatures for 1 minute. During this time, it is incapable of meaningful communication and has Disadvantage on attack rolls and ability checks.\n\n***Fear.*** Each target must succeed on a Wisdom saving throw or have the Frightened condition for 1 minute. While Frightened, the target must move at least 30 feet away from the glyph on each of its turns, if able.\n\n***Pain.*** Each target must succeed on a Constitution saving throw or have the Incapacitated condition for 1 minute.\n\n***Sleep.*** Each target must succeed on a Wisdom saving throw or have the Unconscious condition for 10 minutes. A creature awakens if it takes damage or if someone takes an action to shake it awake.\n\n***Stunning.*** Each target must succeed on a Wisdom saving throw or have the Stunned condition for 1 minute.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"teleport","name":"Teleport","level":7,"school":"Conjuration","classes":["Bard","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"10 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"This spell instantly transports you and up to eight willing creatures that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be Large or smaller, and it can’t be held or carried by an unwilling creature.\n\nThe destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The GM rolls 1d100 and consults the Teleportation Outcome table and the explanations after it.\n\n**Teleportation Outcome**\n\n| Familiarity | Mishap | Similar Area | Off Target | On Target |\n| --- | --- | --- | --- | --- |\n| Permanent circle | — | — | — | 01–00 |\n| Linked object | — | — | — | 01–00 |\n| Very familiar | 01–05 | 06–13 | 14–24 | 25–00 |\n| Seen casually | 01–33 | 34–43 | 44–53 | 54–00 |\n| Viewed once or described | 01–43 | 44–53 | 54–73 | 74–00 |\n| False destination | 01–50 | 51–00 | — | — |\n\n***Familiarity.*** Here are the meanings of the terms in the table’s Familiarity column:\n\n- “Permanent circle” means a permanent teleportation circle whose sigil sequence you know.\n- “Linked object” means you possess an object taken from the desired destination within the last six months, such as a book from a wizard’s library.\n- “Very familiar” is a place you have visited often, a place you have carefully studied, or a place you can see when you cast the spell.\n- “Seen casually” is a place you have seen more than once but with which you aren’t very familiar.\n- “Viewed once or described” is a place you have seen once, possibly using magic, or a place you know through someone else’s description, perhaps from a map.\n- “False destination” is a place that doesn’t exist. Perhaps you tried to scry an enemy’s sanctum but instead viewed an illusion, or you are attempting to teleport to a location that no longer exists.\n\n***Mishap.*** The spell’s unpredictable magic results in a difficult journey. Each teleporting creature (or the target object) takes 3d10 Force damage, and the GM rerolls on the table to see where you wind up (multiple mishaps can occur, dealing damage each time).\n\n***Similar Area.*** You and your group (or the target object) appear in a different area that’s visually or thematically similar to the target area. You appear in the closest similar place. If you are heading for your home laboratory, for example, you might appear in another person’s laboratory in the same city.\n\n***Off Target.*** You and your group (or the target object) appear 2d12 miles away from the destination in a random direction. Roll 1d8 for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5, west; 6, northwest; 7, north; or 8, northeast.\n\n***On Target.*** You and your group (or the target object) appear where you intended.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"animal-shapes","name":"Animal Shapes","level":8,"school":"Transmutation","classes":["Druid"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"Choose any number of willing creatures that you can see within range. Each target shape-shifts into a Large or smaller Beast of your choice that has a Challenge Rating of 4 or lower. You can choose a different form for each target. On later turns, you can take a Magic action to transform the targets again.\n\nA target’s game statistics are replaced by the chosen Beast’s statistics, but the target retains its creature type; Hit Points; Hit Point Dice; alignment; ability to communicate; and Intelligence, Wisdom, and Charisma scores. The target’s actions are limited by the Beast form’s anatomy, and it can’t cast spells. The target’s equipment melds into the new form, and the target can’t use any of that equipment while in that form.\n\nThe target gains a number of Temporary Hit Points equal to the Hit Points of the first form into which it shape-shifts. These Temporary Hit Points vanish if any remain when the spell ends. The transformation lasts for the duration or until the target ends it as a Bonus Action.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"antimagic-field","name":"Antimagic Field","level":8,"school":"Abjuration","classes":["Cleric","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"iron filings","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"An aura of antimagic surrounds you in 10-foot Emanation. No one can cast spells, take Magic actions, or create other magical effects inside the aura, and those things can’t target or otherwise affect anything inside it. Magical properties of magic items don’t work inside the aura or on anything inside it.\n\nAreas of effect created by spells or other magic can’t extend into the aura, and no one can teleport into or out of it or use planar travel there. Portals close temporarily while in the aura.\n\nOngoing spells, except those cast by an Artifact or a deity, are suppressed in the area. While an effect is suppressed, it doesn’t function, but the time it spends suppressed counts against its duration.\n\n*Dispel Magic* has no effect on the aura, and the auras created by different *Antimagic Field* spells don’t nullify each other.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"antipathy-sympathy","name":"Antipathy/Sympathy","level":8,"school":"Enchantment","classes":["Bard","Druid","Wizard"],"time":"1 hour","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a mix of vinegar and honey","costly":false,"consumed":false,"duration":"10 days","conc":false,"desc":"As you cast the spell, choose whether it creates antipathy or sympathy, and target one creature or object that is Huge or smaller. Then specify a kind of creature, such as red dragons, goblins, or vampires. A creature of the chosen kind makes a Wisdom saving throw when it comes within 120 feet of the target. Your choice of antipathy or sympathy determines what happens to a creature when it fails that save:\n\n**Antipathy.** The creature has the Frightened condition. The Frightened creature must use its movement on its turns to get as far away as possible from the target, moving by the safest route.\n\n**Sympathy.** The creature has the Charmed condition. The Charmed creature must use its movement on its turns to get as close as possible to the target, moving by the safest route. If the creature is within 5 feet of the target, the creature can’t willingly move away. If the target damages the Charmed creature, that creature can make a","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"befuddlement","name":"Befuddlement","level":8,"school":"Enchantment","classes":["Bard","Druid","Warlock","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"a key ring with no keys","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You blast the mind of a creature that you can see within range. The target makes an Intelligence saving throw.\n\nOn a failed save, the target takes 10d12 Psychic damage and can’t cast spells or take the Magic action. At the end of every 30 days, the target repeats the save, ending the effect on a success. The effect can also be ended by the *Greater Restoration*, *Heal*, or *Wish* spell.\n\nOn a successful save, the target takes half as much damage only.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"clone","name":"Clone","level":8,"school":"Necromancy","classes":["Wizard"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a diamond worth 1,000+ GP, which the spell consumes, and a sealable vessel worth 2,000+ GP that is large enough to hold the creature being cloned","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You touch a creature or at least 1 cubic inch of its flesh. An inert duplicate of that creature forms inside the vessel used in the spell’s casting and finishes growing after 120 days; you choose whether the finished clone is the same age as the creature or younger. The clone remains inert and endures indefinitely while its vessel remains undisturbed.\n\nIf the original creature dies after the clone finishes forming, the creature’s soul transfers to the clone if the soul is free and willing to return. The clone is physically identical to the original and has the same personality, memories, and abilities, but none of the original’s equipment. The creature’s original remains, if any, become inert and can’t be revived, since the creature’s soul is elsewhere.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"control-weather","name":"Control Weather","level":8,"school":"Transmutation","classes":["Cleric","Druid","Wizard"],"time":"10 minutes","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"burning incense","costly":false,"consumed":false,"duration":"Concentration, up to 8 hours","conc":true,"desc":"You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell, and it ends early if you go indoors.\n\nWhen you cast the spell, you change the current weather conditions, which are determined by the GM. You can change precipitation, temperature, and wind. It takes 1d4 × 10 minutes for the new conditions to take effect. Once they do so, you can change the conditions again. When the spell ends, the weather gradually returns to normal.\n\nWhen you change the weather conditions, find a current condition on the following tables and change its stage by one, up or down. When changing the wind, you can change its direction.\n\n**Precipitation**\n\n| Stage | Condition |\n| --- | --- |\n| 1 | Clear |\n| 2 | Light clouds |\n| 3 | Overcast or ground fog |\n| 4 | Rain, hail, or snow |\n| 5 | Torrential rain, driving hail, or blizzard |\n\n**Temperature**\n\n| Stage | Condition |\n| --- | --- |\n| 1 | Heat wave |\n| 2 | Hot |\n| 3 | Warm |\n| 4 | Cool |\n| 5 | Cold |\n| 6 | Freezing |\n\n**Wind**\n\n| Stage | Condition |\n| --- | --- |\n| 1 | Calm |\n| 2 | Moderate wind |\n| 3 | Strong wind |\n| 4 | Gale |\n| 5 | Storm |","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"demiplane","name":"Demiplane","level":8,"school":"Conjuration","classes":["Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":false,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"You create a shadowy Medium door on a flat solid surface that you can see within range. This door can be opened and closed, and it leads to a demiplane that is an empty room 30 feet in each dimension, made of wood or stone (your choice).\n\nWhen the spell ends, the door vanishes, and any objects inside the demiplane remain there. Any creatures inside also remain unless they opt to be shunted through the door as it vanishes, landing with the Prone condition in the unoccupied spaces closest to the door’s former space.\n\nEach time you cast this spell, you can create a new demiplane or connect the shadowy door to a demiplane you created with a previous casting of this spell. Additionally, if you know the nature and contents of a demiplane created by a casting of this spell by another creature, you can connect the shadowy door to that demiplane instead.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"dominate-monster","name":"Dominate Monster","level":8,"school":"Enchantment","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"One creature you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.\n\nYou have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as “Attack that creature,” “Move over there,” or “Fetch that object.” The target does its best to obey on its turn. If it completes an order and doesn’t receive further direction from you, it acts and moves as it likes, focusing on protecting itself.\n\nYou can command the target to take a Reaction but must take your own Reaction to do so.","higher":"Your Concentration can last longer with a level 9 spell slot (up to 8 hours).","higherLabel":"Using a Higher-Level Spell Slot","src":"SRD 5.2.1"},{"id":"earthquake","name":"Earthquake","level":8,"school":"Transmutation","classes":["Cleric","Druid","Sorcerer"],"time":"Action","ritual":false,"range":"500 feet","v":true,"s":true,"m":true,"mat":"a fractured rock","costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"Choose a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100-foot-radius circle centered on that point. The ground there is Difficult Terrain.\n\nWhen you cast this spell and at the end of each of your turns for the duration, each creature on the ground in the area makes a Dexterity saving throw. On a failed save, a creature has the Prone condition, and its Concentration is broken.\n\nYou can also cause the effects below.\n\n***Fissures.*** A total of 1d6 fissures open in the spell’s area at the end of the turn you cast it. You choose the fissures’ locations, which can’t be under structures. Each fissure is 1d10 × 10 feet deep and 10 feet wide, and it extends from one edge of the spell’s area to another edge. A creature in the same space as a fissure must succeed on a Dexterity saving throw or fall in. A creature that successfully saves moves with the fissure’s edge as it opens.\n\n***Structures.*** The tremor deals 50 Bludgeoning damage to any structure in contact with the ground in the area when you cast the spell and at the end of each of your turns until the spell ends. If a structure drops to 0 Hit Points, it collapses.\n\nA creature within a distance from a collapsing structure equal to half the structure’s height makes a Dexterity saving throw. On a failed save, the creature takes 12d6 Bludgeoning damage, has the Prone condition, and is buried in the rubble, requiring a DC 20 Strength (Athletics) check as an action to escape. On a successful save, the creature takes half as much damage only.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"glibness","name":"Glibness","level":8,"school":"Enchantment","classes":["Bard","Warlock"],"time":"Action","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"1 hour","conc":false,"desc":"Until the spell ends, when you make a Charisma check, you can replace the number you roll with a 15. Additionally, no matter what you say, magic that would determine if you are telling the truth indicates that you are being truthful.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"holy-aura","name":"Holy Aura","level":8,"school":"Abjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a reliquary worth 1,000+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"For the duration, you emit an aura in a 30-foot Emanation. While in the aura, creatures of your choice have Advantage on all saving throws, and other creatures have Disadvantage on attack rolls against them. In addition, when a Fiend or an Undead hits an affected creature with a melee attack roll, the attacker must succeed on a Constitution saving throw or have the Blinded condition until the end of its next turn.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"incendiary-cloud","name":"Incendiary Cloud","level":8,"school":"Conjuration","classes":["Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A swirling cloud of embers and smoke fills a 20-foot-radius Sphere centered on a point within range. The cloud’s area is Heavily Obscured. It lasts for the duration or until a strong wind (like that created by *Gust of Wind*) disperses it.\n\nWhen the cloud appears, each creature in it makes a Dexterity saving throw, taking 10d8 Fire damage on a failed save or half as much damage on a successful one. A creature must also make this save when the Sphere moves into its space and when it enters the Sphere or ends its turn there. A creature makes this save only once per turn.\n\nThe cloud moves 10 feet away from you in a direction you choose at the start of each of your turns.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"maze","name":"Maze","level":8,"school":"Conjuration","classes":["Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 10 minutes","conc":true,"desc":"You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze.\n\nThe target can take a Study action to try to escape. When it does so, it makes a DC 20 Intelligence (Investigation) check. If it succeeds, it escapes, and the spell ends.\n\nWhen the spell ends, the target reappears in the space it left or, if that space is occupied, in the nearest unoccupied space.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mind-blank","name":"Mind Blank","level":8,"school":"Abjuration","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"Touch","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"24 hours","conc":false,"desc":"Until the spell ends, one willing creature you touch has Immunity to Psychic damage and the Charmed condition. The target is also unaffected by anything that would sense its emotions or alignment, read its thoughts, or magically detect its location, and no spell—not even *Wish*—can gather information about the target, observe it remotely, or control its mind.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"power-word-stun","name":"Power Word Stun","level":8,"school":"Enchantment","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You overwhelm the mind of one creature you can see within range. If the target has 150 Hit Points or fewer, it has the Stunned condition. Otherwise, its Speed is 0 until the start of your next turn.\n\nThe Stunned target makes a Constitution saving throw at the end of each of its turns, ending the condition on itself on a success.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"sunburst","name":"Sunburst","level":8,"school":"Evocation","classes":["Cleric","Druid","Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"150 feet","v":true,"s":true,"m":true,"mat":"a piece of sunstone","costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Brilliant sunlight flashes in a 60-foot-radius Sphere centered on a point you choose within range. Each creature in the Sphere makes a Constitution saving throw. On a failed save, a creature takes 12d6 Radiant damage and has the Blinded condition for 1 minute. On a successful save, it takes half as much damage only.\n\nA creature Blinded by this spell makes another Constitution saving throw at the end of each of its turns, ending the effect on itself on a success.\n\nThis spell dispels Darkness in its area that was created by any spell.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"tsunami","name":"Tsunami","level":8,"school":"Conjuration","classes":["Druid"],"time":"1 minute","ritual":false,"range":"1 mile","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 6 rounds","conc":true,"desc":"A wall of water springs into existence at a point you choose within range. You can make the wall up to 300 feet long, 300 feet high, and 50 feet thick. The wall lasts for the duration.\n\nWhen the wall appears, each creature in its area makes a Strength saving throw, taking 6d10 Bludgeoning damage on a failed save or half as much damage on a successful one.\n\nAt the start of each of your turns after the wall appears, the wall, along with any creatures in it, moves 50 feet away from you. Any Huge or smaller creature inside the wall or whose space the wall enters when it moves must succeed on a Strength saving throw or take 5d10 Bludgeoning damage. A creature can take this damage only once per round. At the end of the turn, the wall’s height is reduced by 50 feet, and the damage the wall deals on later rounds is reduced by 1d10. When the wall reaches 0 feet in height, the spell ends.\n\nA creature caught in the wall can move by swimming. Because of the wave’s force, though, the creature must succeed on a Strength (Athletics) check against your spell save DC to move at all. If it fails the check, it can’t move. A creature that moves out of the wall falls to the ground.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"astral-projection","name":"Astral Projection","level":9,"school":"Necromancy","classes":["Cleric","Warlock","Wizard"],"time":"1 hour","ritual":false,"range":"10 feet","v":true,"s":true,"m":true,"mat":"for each of the spell’s targets, one jacinth worth 1,000+ GP and one silver bar worth 100+ GP, all of which the spell consumes","costly":true,"consumed":true,"duration":"Until dispelled","conc":false,"desc":"You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell ends instantly if you are already on that plane). Each target’s body is left behind in a state of suspended animation; it has the Unconscious condition, doesn’t need food or air, and doesn’t age.\n\nA target’s astral form resembles its body in almost every way, replicating its game statistics and possessions. The principal difference is the addition of a silvery cord that trails from between the shoulder blades of the astral form. The cord fades from view after 1 foot. If the cord is cut—which happens only when an effect states that it does so—the target’s body and astral form both die.\n\nA target’s astral form can travel through the Astral Plane. The moment an astral form leaves that plane, the target’s body and possessions travel along the silver cord, causing the target to re-enter its body on the new plane.\n\nAny damage or other effects that apply to an astral form have no effect on the target’s body and vice versa. If a target’s body or astral form drops to 0 Hit Points, the spell ends for that target. The spell ends for all the targets if you take a Magic action to dismiss it.\n\nWhen the spell ends for a target who isn’t dead, the target reappears in its body and exits the state of suspended animation.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"foresight","name":"Foresight","level":9,"school":"Divination","classes":["Bard","Druid","Warlock","Wizard"],"time":"1 minute","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"a hummingbird feather","costly":false,"consumed":false,"duration":"8 hours","conc":false,"desc":"You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target has Advantage on D20 Tests, and other creatures have Disadvantage on attack rolls against it. The spell ends early if you cast it again.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"gate","name":"Gate","level":9,"school":"Conjuration","classes":["Cleric","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":true,"mat":"a diamond worth 5,000+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You conjure a portal linking an unoccupied space you can see within range to a precise location on a different plane of existence. The portal is a circular opening, which you can make 5 to 20 feet in diameter. You can orient the portal in any direction you choose. The portal lasts for the duration, and the portal’s destination is visible through it.\n\nThe portal has a front and a back on each plane where it appears. Travel through the portal is possible only by moving through its front. Anything that does so is instantly transported to the other plane, appearing in the unoccupied space nearest to the portal.\n\nDeities and other planar rulers can prevent portals created by this spell from opening in their presence or anywhere within their domains.\n\nWhen you cast this spell, you can speak the name of a specific creature (a pseudonym, title, or nickname doesn’t work). If that creature is on a plane other than the one you are on, the portal opens next to the named creature and transports it to the nearest unoccupied space on your side of the portal. You gain no special power over the creature, and it is free to act as the GM deems appropriate. It might leave, attack you, or help you.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"imprisonment","name":"Imprisonment","level":9,"school":"Abjuration","classes":["Warlock","Wizard"],"time":"1 minute","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a statuette of the target worth 5,000+ GP","costly":true,"consumed":false,"duration":"Until dispelled","conc":false,"desc":"You create a magical restraint to hold a creature that you can see within range. The target must make a Wisdom saving throw. On a successful save, the target is unaffected, and it is immune to this spell for the next 24 hours. On a failed save, the target is imprisoned. While imprisoned, the target doesn’t need to breathe, eat, or drink, and it doesn’t age. Divination spells can’t locate or perceive the imprisoned target, and the target can’t teleport.\n\nUntil the spell ends, the target is also affected by one of the following effects of your choice:\n\n**Burial.** The target is entombed beneath the earth in a hollow globe of magical force that is just large enough to contain the target. Nothing can pass into or out of the globe.\n\n**Chaining.** Chains firmly rooted in the ground hold the target in place. The target has the Restrained condition and can’t be moved by any means.\n\n**Hedged Prison.** The target is trapped in a demiplane that is warded against teleportation and planar travel. The demiplane is your choice of a labyrinth, a cage, a tower, or the like.\n\n**Minimus Containment.** The target becomes 1 inch tall and is trapped inside an indestructible gemstone or a similar object. Light can pass through the gemstone (allowing the target to see out and other creatures to see in), but nothing else can pass through by any means.\n\n**Slumber.** The target has the Unconscious condition and can’t be awoken.\n\n***Ending the Spell.*** When you cast the spell, specify a trigger that will end it. The trigger can be as simple or as elaborate as you choose, but the GM must agree that it has a high likelihood of happening within the next decade. The trigger must be an observable action, such as someone making a particular offering at the temple of your god, saving your true love, or defeating a specific monster.\n\nA *Dispel Magic* spell can end the spell only if it is cast with a level 9 spell slot, targeting either the prison or the component used to create it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"mass-heal","name":"Mass Heal","level":9,"school":"Abjuration","classes":["Cleric"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A flood of healing energy flows from you into creatures around you. You restore up to 700 Hit Points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell also have the Blinded, Deafened, and Poisoned conditions removed from them.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"meteor-swarm","name":"Meteor Swarm","level":9,"school":"Evocation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"1 mile","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius Sphere centered on each of those points makes a Dexterity saving throw. A creature takes 20d6 Fire damage and 20d6 Bludgeoning damage on a failed save or half as much damage on a successful one. A creature in the area of more than one fiery Sphere is affected only once.\n\nA nonmagical object that isn’t being worn or carried also takes the damage if it’s in the spell’s area, and the object starts burning if it’s flammable.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"power-word-heal","name":"Power Word Heal","level":9,"school":"Enchantment","classes":["Bard","Cleric"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"A wave of healing energy washes over one creature you can see within range. The target regains all its Hit Points. If the creature has the Charmed, Frightened, Paralyzed, Poisoned, or Stunned condition, the condition ends. If the creature has the Prone condition, it can use its Reaction to stand up.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"power-word-kill","name":"Power Word Kill","level":9,"school":"Enchantment","classes":["Bard","Sorcerer","Warlock","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You compel one creature you can see within range to die. If the target has 100 Hit Points or fewer, it dies. Otherwise, it takes 12d12 Psychic damage.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"prismatic-wall","name":"Prismatic Wall","level":9,"school":"Abjuration","classes":["Bard","Wizard"],"time":"Action","ritual":false,"range":"60 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"10 minutes","conc":false,"desc":"A shimmering, multicolored plane of light forms a vertical opaque wall—up to 90 feet long, 30 feet high, and 1 inch thick—centered on a point within range. Alternatively, you shape the wall into a globe up to 30 feet in diameter centered on a point within range. The wall lasts for the duration. If you position the wall in a space occupied by a creature, the spell ends instantly without effect.\n\nThe wall sheds Bright Light within 100 feet and Dim Light for an additional 100 feet. You and creatures you designate when you cast the spell can pass through and be near the wall without harm. If another creature that can see the wall moves within 20 feet of it or starts its turn there, the creature must succeed on a Constitution saving throw or have the Blinded condition for 1 minute.\n\nThe wall consists of seven layers, each with a different color. When a creature reaches into or passes through the wall, it does so one layer at a time through all the layers. Each layer forces the creature to make a Dexterity saving throw or be affected by that layer’s properties as described in the Prismatic Layers table.\n\nThe wall, which has AC 10, can be destroyed one layer at a time, in order from red to violet, by means specific to each layer. If a layer is destroyed, it is gone for the duration. *Antimagic Field* has no effect on the wall, and *Dispel Magic* can affect only the violet layer.\n\n**Prismatic Layers**\n\n| Order | Effects |\n| --- | --- |\n| 1 | **Red.** *Failed Save:* 12d6 Fire damage. *Successful Save:* Half as much damage. *Additional Effects*: Nonmagical ranged attacks can’t pass through this layer, which is destroyed if it takes at least 25 Cold damage. |\n| 2 | **Orange.** *Failed Save:* 12d6 Acid damage. *Successful Save:* Half as much damage. *Additional Effects:* Magical ranged attacks can’t pass through this layer, which is destroyed by a strong wind (such as the one created by *Gust of Wind*). |\n| 3 | **Yellow.** *Failed Save:* 12d6 Lightning damage. *Successful Save:* Half as much damage. *Additional Effects:* The layer is destroyed if it takes at least 60 Force damage. |\n| 4 | **Green.** *Failed Save:* 12d6 Poison damage. *Successful Save:* Half as much damage. *Additional Effects:* A *Passwall* spell, or another spell of equal or greater level that can open a portal on a solid surface, destroys this layer. |\n| 5 | **Blue.** *Failed Save:* 12d6 Cold damage. *Successful Save:* Half as much damage. *Additional Effects:* The layer is destroyed if it takes at least 25 Fire damage. |\n| 6 | **Indigo.** *Failed Save:* The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the *Greater Restoration* spell. The successes and failures needn’t be consecutive; keep track of both until the target collects three of a kind. *Additional Effects:* Spells can’t be cast through this layer, which is destroyed by Bright Light shed by the *Daylight* spell. |\n| 7 | **Violet.** *Failed Save:* The target has the Blinded condition and makes a Wisdom saving throw at the start of your next turn. On a successful save, the condition ends. On a failed save, the condition ends, and the creature teleports to another plane of existence (GM’s choice). *Additional Effects:* This layer is destroyed by *Dispel Magic*. |","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"shapechange","name":"Shapechange","level":9,"school":"Transmutation","classes":["Druid","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":true,"m":true,"mat":"a jade circlet worth 1,500+ GP","costly":true,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"You shape-shift into another creature for the duration or until you take a Magic action to shape-shift into a different eligible form. The new form must be of a creature that has a Challenge Rating no higher than your level or Challenge Rating. You must have seen the sort of creature before, and it can’t be a Construct or an Undead.\n\nWhen you cast the spell, you gain a number of Temporary Hit Points equal to the Hit Points of the first form into which you shape-shift. These Temporary Hit Points vanish if any remain when the spell ends.\n\nYour game statistics are replaced by the stat block of the chosen form, but you retain your creature type; alignment; personality; Intelligence, Wisdom, and Charisma scores; Hit Points; Hit Point Dice; proficiencies; and ability to communicate. If you have the Spellcasting feature, you retain it too.\n\nUpon shape-shifting, you determine whether your equipment drops to the ground or changes in size and shape to fit the new form while you’re in it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"storm-of-vengeance","name":"Storm of Vengeance","level":9,"school":"Conjuration","classes":["Druid"],"time":"Action","ritual":false,"range":"1 mile","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"A churning storm cloud forms for the duration, centered on a point within range and spreading to a radius of 300 feet. Each creature under the cloud when it appears must succeed on a Constitution saving throw or take 2d6 Thunder damage and have the Deafened condition for the duration.\n\nAt the start of each of your later turns, the storm produces different effects, as detailed below.\n\n***Turn 2.*** Acidic rain falls. Each creature and object under the cloud takes 4d6 Acid damage.\n\n***Turn 3.*** You call six bolts of lightning from the cloud to strike six different creatures or objects beneath it. Each target makes a Dexterity saving throw, taking 10d6 Lightning damage on a failed save or half as much damage on a successful one.\n\n***Turn 4.*** Hailstones rain down. Each creature under the cloud takes 2d6 Bludgeoning damage.\n\n***Turns 5–10.*** Gusts and freezing rain assail the area under the cloud. Each creature there takes 1d6 Cold damage. Until the spell ends, the area is Difficult Terrain and Heavily Obscured, ranged attacks with weapons are impossible there, and strong wind blows through the area.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"time-stop","name":"Time Stop","level":9,"school":"Transmutation","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal.\n\nThis spell ends if one of the actions you use during this period, or any effects that you create during it, affects a creature other than you or an object being worn or carried by someone other than you. In addition, the spell ends if you move to a place more than 1,000 feet from the location where you cast it.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"true-polymorph","name":"True Polymorph","level":9,"school":"Transmutation","classes":["Bard","Warlock","Wizard"],"time":"Action","ritual":false,"range":"30 feet","v":true,"s":true,"m":true,"mat":"a drop of mercury, a dollop of gum arabic, and a wisp of smoke","costly":false,"consumed":false,"duration":"Concentration, up to 1 hour","conc":true,"desc":"Choose one creature or nonmagical object that you can see within range. The creature shape-shifts into a different creature or a nonmagical object, or the object shape-shifts into a creature (the object must be neither worn nor carried). The transformation lasts for the duration or until the target dies or is destroyed, but if you maintain Concentration on this spell for the full duration, the spell lasts until dispelled.\n\nAn unwilling creature can make a Wisdom saving throw, and if it succeeds, it isn’t affected by this spell.\n\n***Creature into Creature.*** If you turn a creature into another kind of creature, the new form can be any kind you choose that has a Challenge Rating equal to or less than the target’s Challenge Rating or level. The target’s game statistics are replaced by the stat block of the new form, but it retains its Hit Points, Hit Point Dice, alignment, and personality.\n\nThe target gains a number of Temporary Hit Points equal to the Hit Points of the new form. These Temporary Hit Points vanish if any remain when the spell ends.\n\nThe target is limited in the actions it can perform by the anatomy of its new form, and it can’t speak or cast spells.\n\nThe target’s gear melds into the new form. The creature can’t use or otherwise benefit from any of that equipment.\n\n***Object into Creature.*** You can turn an object into any kind of creature, as long as the creature’s size is no larger than the object’s size and the creature has a Challenge Rating of 9 or lower. The creature is Friendly to you and your allies. In combat, it takes its turns immediately after yours, and it obeys your commands.\n\nIf the spell lasts more than an hour, you no longer control the creature. It might remain Friendly to you, depending on how you have treated it.\n\n***Creature into Object.*** If you turn a creature into an object, it transforms along with whatever it is wearing and carrying into that form, as long as the object’s size is no larger than the creature’s size. The creature’s statistics become those of the object, and the creature has no memory of time spent in this form after the spell ends and it returns to normal.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"true-resurrection","name":"True Resurrection","level":9,"school":"Necromancy","classes":["Cleric","Druid"],"time":"1 hour","ritual":false,"range":"Touch","v":true,"s":true,"m":true,"mat":"diamonds worth 25,000+ GP, which the spell consumes","costly":true,"consumed":true,"duration":"Instantaneous","conc":false,"desc":"You touch a creature that has been dead for no longer than 200 years and that died for any reason except old age. The creature is revived with all its Hit Points.\n\nThis spell closes all wounds, neutralizes any poison, cures all magical contagions, and lifts any curses affecting the creature when it died. The spell replaces damaged or missing organs and limbs. If the creature was Undead, it is restored to its non-Undead form.\n\nThe spell can provide a new body if the original no longer exists, in which case you must speak the creature’s name. The creature then appears in an unoccupied space you choose within 10 feet of you.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"weird","name":"Weird","level":9,"school":"Illusion","classes":["Warlock","Wizard"],"time":"Action","ritual":false,"range":"120 feet","v":true,"s":true,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Concentration, up to 1 minute","conc":true,"desc":"You try to create illusory terrors in others’ minds. Each creature of your choice in a 30-foot-radius Sphere centered on a point within range makes a Wisdom saving throw. On a failed save, a target takes 10d10 Psychic damage and has the Frightened condition for the duration. On a successful save, a target takes half as much damage only.\n\nA Frightened target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes 5d10 Psychic damage. On a successful save, the spell ends on that target.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"},{"id":"wish","name":"Wish","level":9,"school":"Conjuration","classes":["Sorcerer","Wizard"],"time":"Action","ritual":false,"range":"Self","v":true,"s":false,"m":false,"mat":null,"costly":false,"consumed":false,"duration":"Instantaneous","conc":false,"desc":"*Wish* is the mightiest spell a mortal can cast. By simply speaking aloud, you can alter reality itself. The basic use of this spell is to duplicate any other spell of level 8 or lower. If you use it this way, you don’t need to meet any requirements to cast that spell, including costly components. The spell simply takes effect. Alternatively, you can create one of the following effects of your choice:\n\n**Object Creation.** You create one object of up to 25,000 GP in value that isn’t a magic item. The object can be no more than 300 feet in any dimension, and it appears in an unoccupied space that you can see on the ground.\n\n**Instant Health.** You allow yourself and up to twenty creatures that you can see to regain all Hit Points, and you end all effects on them listed in the *Greater Restoration* spell.\n\n**Resistance.** You grant up to ten creatures that you can see Resistance to one damage type that you choose. This Resistance is permanent.\n\n**Spell Immunity.** You grant up to ten creatures you can see immunity to a single spell or other magical effect for 8 hours.\n\n**Sudden Learning.** You replace one of your feats with another feat for which you are eligible. You lose all the benefits of the old feat and gain the benefits of the new one. You can’t replace a feat that is a prerequisite for any of your other feats or features.\n\n**Roll Redo.** You undo a single recent event by forcing a reroll of any die roll made within the last round (including your last turn). Reality reshapes itself to accommodate the new result. For example, a *Wish* spell could undo an ally’s failed saving throw or a foe’s Critical Hit. You can force the reroll to be made with Advantage or Disadvantage, and you choose whether to use the reroll or the original roll.\n\n**Reshape Reality.** You may wish for something not included in any of the other effects. To do so, state your wish to the GM as precisely as possible. The GM has great latitude in ruling what occurs in such an instance; the greater the wish, the greater the likelihood that something goes wrong. This spell might simply fail, the effect you desire might be achieved only in part, or you might suffer an unforeseen consequence as a result of how you worded the wish. For example, wishing that a villain were dead might propel you forward in time to a period when that villain is no longer alive, effectively removing you from the game.\n\nSimilarly, wishing for a Legendary magic item or an Artifact might instantly transport you to the presence of the item’s current owner. If your wish is granted and its effects have consequences for a whole community, region, or world, you are likely to attract powerful foes. If your wish would affect a god, the god’s divine servants might instantly intervene to prevent it or to encourage you to craft the wish in a particular way. If your wish would undo the multiverse itself, your wish fails. The stress of casting *Wish* to produce any effect other than duplicating another spell weakens you. After enduring that stress, each time you cast a spell until you finish a Long Rest, you take 1d10 Necrotic damage per level of that spell. This damage can’t be reduced or prevented in any way. In addition, your Strength score becomes 3 for 2d4 days. For each of those days that you spend resting and doing nothing more than light activity, your remaining recovery time decreases by 2 days. Finally, there is a 33 percent chance that you are unable to cast *Wish* ever again if you suffer this stress.","higher":null,"higherLabel":null,"src":"SRD 5.2.1"}];

uggestion","move-earth","programmed-illusion","sunbeam","true-seeing","wall-of-ice"],"7":["arcane-sword","delayed-blast-fireball","etherealness","finger-of-death","forcecage","magnificent-mansion","mirage-arcane","plane-shift","prismatic-spray","project-image","reverse-gravity","sequester","simulacrum","symbol","teleport"],"8":["antimagic-field","antipathy-sympathy","befuddlement","clone","control-weather","demiplane","dominate-monster","incendiary-cloud","maze","mind-blank","power-word-stun","sunburst"],"9":["astral-projection","foresight","gate","imprisonment","meteor-swarm","power-word-kill","prismatic-wall","shapechange","time-stop","true-polymorph","weird","wish"]},"changing":"Whenever you finish a Long Rest, you can change your list of prepared spells, replacing any of the spells there with spells from your spellbook.","focus":"You can use an Arcane Focus or your spellbook as a Spellcasting Focus for your Wizard spells.","grants":[],"notes":{"Ritual Adept":{"level":1,"text":"You can cast any spell as a Ritual if that spell has the Ritual tag and the spell is in your spellbook. You needn’t have the spell prepared, but you must read from the book to cast a spell in this way."},"Arcane Recovery":{"level":1,"text":"You can regain some of your magical energy by studying your spellbook. When you finish a Short Rest, you can choose expended spell slots to recover. The spell slots can have a combined level equal to no more than half your Wizard level (round up), and none of the slots can be level 6 or higher. For example, if you’re a level 4 Wizard, you can recover up to two levels’ worth of spell slots, regaining either one level 2 spell slot or two level 1 spell slots.\n\nOnce you use this feature, you can’t do so again until you finish a Long Rest."},"Memorize Spell":{"level":5,"text":"Whenever you finish a Short Rest, you can study your spellbook and replace one of the level 1+ Wizard spells you have prepared for your Spellcasting feature with another level 1+ spell from the book."},"Spell Mastery":{"level":18,"text":"You have achieved such mastery over certain spells that you can cast them at will. Choose a level 1 and a level 2 spell in your spellbook that have a casting time of an action. You always have those spells prepared, and you can cast them at their lowest level without expending a spell slot. To cast either spell at a higher level, you must expend a spell slot.\n\nWhenever you finish a Long Rest, you can study your spellbook and replace one of those spells with an eligible spell of the same level from the book."},"Signature Spells":{"level":20,"text":"Choose two level 3 spells in your spellbook as your signature spells. You always have these spells prepared, and you can cast each of them once at level 3 without expending a spell slot. When you do so, you can’t cast them in this way again until you finish a Short or Long Rest. To cast either spell at a higher level, you must expend a spell slot."}}}};

window.SRD_CONDITIONS={"Blinded":"While you have the Blinded condition, you experience the following effects.\n\n***Can’t See.*** You can’t see and automatically fail any ability check that requires sight.\n\n***Attacks Affected.*** Attack rolls against you have Advantage, and your attack rolls have Disadvantage.","Charmed":"While you have the Charmed condition, you experience the following effects.\n\n***Can’t Harm the Charmer.*** You can’t attack the charmer or target the charmer with damaging abilities or magical effects.\n\n***Social Advantage.*** The charmer has Advantage on any ability check to interact with you socially.","Deafened":"While you have the Deafened condition, you experience the following effect.\n\n***Can’t Hear.*** You can’t hear and automatically fail any ability check that requires hearing.","Exhaustion":"While you have the Exhaustion condition, you experience the following effects.\n\n***Exhaustion Levels.*** This condition is cumulative. Each time you receive it, you gain 1 Exhaustion level. You die if your Exhaustion level is 6.\n\n***D20 Tests Affected.*** When you make a D20 Test, the roll is reduced by 2 times your Exhaustion level.\n\n***Speed Reduced.*** Your Speed is reduced by a number of feet equal to 5 times your Exhaustion level.\n\n***Removing Exhaustion Levels.*** Finishing a Long Rest removes 1 of your Exhaustion levels. When your Exhaustion level reaches 0, the condition ends.","Frightened":"While you have the Frightened condition, you experience the following effects.\n\n***Ability Checks and Attacks Affected.*** You have Disadvantage on ability checks and attack rolls while the source of fear is within line of sight.\n\n***Can’t Approach.*** You can’t willingly move closer to the source of fear.","Grappled":"While you have the Grappled condition, you experience the following effects.\n\n***Speed 0.*** Your Speed is 0 and can’t increase.\n\n***Attacks Affected.*** You have Disadvantage on attack rolls against any target other than the grappler.\n\n***Movable.*** The grappler can drag or carry you when it moves, but every foot of movement costs it 1 extra foot unless you are Tiny or two or more sizes smaller than it.","Incapacitated":"While you have the Incapacitated condition, you experience the following effects.\n\n***Inactive.*** You can’t take any action, Bonus Action, or Reaction.\n\n***No Concentration.*** Your Concentration is broken.\n\n***Speechless.*** You can’t speak.\n\n***Surprised.*** If you’re Incapacitated when you roll Initiative, you have Disadvantage on the roll.","Invisible":"While you have the Invisible condition, you experience the following effects.\n\n***Surprise.*** If you’re Invisible when you roll Initiative, you have Advantage on the roll.\n\n***Concealed.*** You aren’t affected by any effect that requires its target to be seen unless the effect’s creator can somehow see you. Any equipment you are wearing or carrying is also concealed.\n\n***Attacks Affected.*** Attack rolls against you have Disadvantage, and your attack rolls have Advantage. If a creature can somehow see you, you don’t gain this benefit against that creature.","Paralyzed":"While you have the Paralyzed condition, you experience the following effects.\n\n***Incapacitated.*** You have the Incapacitated condition.\n\n***Speed 0.*** Your Speed is 0 and can’t increase.\n\n***Saving Throws Affected.*** You automatically fail Strength and Dexterity saving throws.\n\n***Attacks Affected.*** Attack rolls against you have Advantage.\n\n***Automatic Critical Hits.*** Any attack roll that hits you is a Critical Hit if the attacker is within 5 feet of you.","Petrified":"While you have the Petrified condition, you experience the following effects.\n\n***Turned to Inanimate Substance.*** You are transformed, along with any nonmagical objects you are wearing and carrying, into a solid inanimate substance (usually stone). Your weight increases by a factor of ten, and you cease aging.\n\n***Incapacitated.*** You have the Incapacitated condition.\n\n***Speed 0.*** Your Speed is 0 and can’t increase.\n\n***Attacks Affected.*** Attack rolls against you have Advantage.\n\n***Saving Throws Affected.*** You automatically fail Strength and Dexterity saving throws.\n\n***Resist Damage.*** You have Resistance to all damage.\n\n***Poison Immunity.*** You have Immunity to the Poisoned condition.","Poisoned":"While you have the Poisoned condition, you experience the following effect.\n\n***Ability Checks and Attacks Affected.*** You have Disadvantage on attack rolls and ability checks.","Prone":"While you have the Prone condition, you experience the following effects.\n\n***Restricted Movement.*** Your only movement options are to crawl or to spend an amount of movement equal to half your Speed (round down) to right yourself and thereby end the condition. If your Speed is 0, you can’t right yourself.\n\n***Attacks Affected.*** You have Disadvantage on attack rolls. An attack roll against you has Advantage if the attacker is within 5 feet of you. Otherwise, that attack roll has Disadvantage.","Restrained":"While you have the Restrained condition, you experience the following effects.\n\n***Speed 0.*** Your Speed is 0 and can’t increase.\n\n***Attacks Affected.*** Attack rolls against you have Advantage, and your attack rolls have Disadvantage.\n\n***Saving Throws Affected.*** You have Disadvantage on Dexterity saving throws.","Stunned":"While you have the Stunned condition, you experience the following effects.\n\n***Incapacitated.*** You have the Incapacitated condition.\n\n***Saving Throws Affected.*** You automatically fail Strength and Dexterity saving throws.\n\n***Attacks Affected.*** Attack rolls against you have Advantage.","Unconscious":"While you have the Unconscious condition, you experience the following effects.\n\n***Inert.*** You have the Incapacitated and Prone conditions, and you drop whatever you’re holding. When this condition ends, you remain Prone.\n\n***Speed 0.*** Your Speed is 0 and can’t increase.\n\n***Attacks Affected.*** Attack rolls against you have Advantage.\n\n***Saving Throws Affected.*** You automatically fail Strength and Dexterity saving throws.\n\n***Automatic Critical Hits.*** Any attack roll that hits you is a Critical Hit if the attacker is within 5 feet of you.\n\n***Unaware.*** You’re unaware of your surroundings."};
